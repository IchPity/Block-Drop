<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schach — Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --green: #22c55e; --bg: #060818; --cell: 64px; }

    body {
      background: var(--bg); min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #eee; overflow-x: hidden;
      display: flex; flex-direction: column; align-items: center;
      padding: 80px 16px 40px; gap: 16px;
    }

    /* ── Background ─────────────────────────────────────── */
    .orb { position: fixed; border-radius: 50%; filter: blur(130px); pointer-events: none; z-index: 0; }
    .orb-1 { width: 700px; height: 700px; background: #22c55e; opacity: 0.04; top: -240px; left: -200px; animation: f1 26s ease-in-out infinite alternate; }
    .orb-2 { width: 580px; height: 580px; background: #3050e0; opacity: 0.05; bottom: -200px; right: -180px; animation: f2 32s ease-in-out infinite alternate; }
    .orb-3 { width: 400px; height: 400px; background: #e94560; opacity: 0.03; top: 50%; left: 50%; transform: translate(-50%,-50%); animation: f3 20s ease-in-out infinite alternate; }
    @keyframes f1 { from{transform:translate(0,0)scale(1)} to{transform:translate(80px,60px)scale(1.15)} }
    @keyframes f2 { from{transform:translate(0,0)scale(1)} to{transform:translate(-70px,-80px)scale(1.18)} }
    @keyframes f3 { from{transform:translate(-50%,-50%)scale(1)} to{transform:translate(-54%,-46%)scale(1.12)} }
    .dot-grid { position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(rgba(255,255,255,0.012)1px,transparent 1px);background-size:30px 30px; }
    .vignette { position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 90% 75% at 50% 50%,transparent 35%,rgba(5,5,14,0.75)100%); }

    /* ── Navbar ─────────────────────────────────────────── */
    .navbar {
      position:fixed;top:0;left:0;right:0;z-index:100;
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 24px; background:rgba(6,8,24,0.75);
      border-bottom:1px solid rgba(255,255,255,0.05);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    }
    .nav-left { display:flex;align-items:center;gap:14px; }
    .nav-back {
      display:inline-flex;align-items:center;gap:6px;
      text-decoration:none;color:rgba(255,255,255,0.35);
      font-size:11px;font-weight:600;
      border:1px solid rgba(255,255,255,0.1);border-radius:8px;
      padding:6px 12px;transition:all 0.2s;
    }
    .nav-back:hover { color:rgba(255,255,255,0.75);border-color:rgba(255,255,255,0.2); }
    .nav-title { font-size:13px;font-weight:900;color:#fff;letter-spacing:-0.3px; }
    .nav-right { display:flex;align-items:center;gap:10px; }
    .turn-badge {
      display:flex;align-items:center;gap:8px;
      background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
      border-radius:10px;padding:6px 14px;
    }
    .turn-dot { width:10px;height:10px;border-radius:50%;transition:background 0.3s,box-shadow 0.3s; }
    .turn-dot.white { background:#fff;box-shadow:0 0 8px rgba(255,255,255,0.6); }
    .turn-dot.black { background:#0e0e18;box-shadow:0 0 6px rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.3); }
    #turn-indicator { font-size:12px;font-weight:700;color:rgba(255,255,255,0.7); }
    .btn-new {
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);border-radius:8px;
      padding:6px 14px;color:var(--green);font-family:inherit;
      font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;
    }
    .btn-new:hover { background:rgba(34,197,94,0.18);border-color:rgba(34,197,94,0.45); }

    /* ── Layout ─────────────────────────────────────────── */
    #wrapper { position:relative;z-index:1;display:flex;gap:16px;align-items:flex-start; }
    .panel { display:flex;flex-direction:column;gap:8px;width:130px; }
    .panel-box {
      background:rgba(255,255,255,0.028);border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;padding:12px 14px;
    }
    .panel-box h3 {
      font-size:8px;font-weight:700;text-transform:uppercase;
      letter-spacing:3px;color:rgba(255,255,255,0.2);margin-bottom:8px;
    }
    .captured-row { display:flex;flex-wrap:wrap;gap:2px;min-height:24px;font-size:18px;line-height:1; }
    .info-text { font-size:11px;color:rgba(255,255,255,0.3);line-height:1.9; }
    .info-text b { color:rgba(255,255,255,0.65); }

    /* ── Board ──────────────────────────────────────────── */
    #board-wrap {
      position:relative;border-radius:12px;overflow:hidden;
      box-shadow:0 0 0 1px rgba(255,255,255,0.08),0 0 60px rgba(34,197,94,0.08),0 32px 80px rgba(0,0,0,0.85);
    }
    #chess-board {
      display:grid;
      grid-template-columns:repeat(8,var(--cell));
      grid-template-rows:repeat(8,var(--cell));
      width:calc(var(--cell)*8);height:calc(var(--cell)*8);
      user-select:none;
    }
    .cell {
      position:relative;display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:filter 0.12s;
    }
    .cell.light { background:#d4a574; }
    .cell.dark  { background:#8b4513; }
    .cell.last-from { background:rgba(80,160,60,0.5)!important; }
    .cell.last-to   { background:rgba(80,160,60,0.65)!important; }
    .cell.selected  { background:rgba(34,197,94,0.55)!important; }
    .cell:hover     { filter:brightness(1.12); }

    /* ── Pieces ─────────────────────────────────────────── */
    .piece {
      font-size:42px;line-height:1;pointer-events:none;transition:transform 0.1s;
      text-shadow:0 1px 3px rgba(0,0,0,0.5);
    }
    .cell:hover .piece { transform:scale(1.08); }

    /* Black pieces — dark fill, white outline for visibility */
    .black-piece {
      color:#0c0c14;
      -webkit-text-stroke:0.8px rgba(220,220,255,0.28);
      text-shadow:0 0 4px rgba(255,255,255,0.18),0 1px 2px rgba(0,0,0,0.9);
    }

    .move-dot {
      width:22px;height:22px;border-radius:50%;
      background:rgba(20,20,20,0.42);pointer-events:none;
    }
    .cell.capturable-ring::after {
      content:'';position:absolute;inset:3px;border-radius:50%;
      border:3px solid rgba(20,20,20,0.4);pointer-events:none;
    }
    .file-lbl,.rank-lbl {
      position:absolute;font-size:9px;font-weight:700;pointer-events:none;opacity:0.55;
    }
    .file-lbl { bottom:2px;right:4px; }
    .rank-lbl { top:2px;left:3px; }
    .cell.light .file-lbl,.cell.light .rank-lbl { color:#8b4513; }
    .cell.dark  .file-lbl,.cell.dark  .rank-lbl { color:#d4a574; }

    /* ── START OVERLAY ──────────────────────────────────── */
    #start-overlay {
      position:absolute;inset:0;z-index:30;
      background:rgba(6,8,24,0.96);backdrop-filter:blur(16px);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    #start-form {
      display:flex;flex-direction:column;align-items:center;gap:20px;
      width:100%;max-width:380px;padding:0 24px;
    }
    .start-logo { font-size:36px;font-weight:900;letter-spacing:-2px;color:#fff; }
    .start-logo span { color:var(--green); }

    /* Input */
    .field-group { display:flex;flex-direction:column;gap:6px;width:100%; }
    .field-label {
      font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
      color:rgba(255,255,255,0.25);
    }
    .start-input {
      background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;padding:11px 14px;color:#fff;font-family:inherit;
      font-size:13px;font-weight:600;outline:none;transition:border-color 0.2s;width:100%;
    }
    .start-input:focus { border-color:rgba(34,197,94,0.4);background:rgba(34,197,94,0.04); }

    /* Color choice */
    .color-row { display:flex;gap:8px;width:100%; }
    .color-btn {
      flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;padding:10px 6px;font-family:inherit;font-size:11px;font-weight:700;
      color:rgba(255,255,255,0.4);cursor:pointer;transition:all 0.2s;
      display:flex;flex-direction:column;align-items:center;gap:4px;
    }
    .color-btn .sym { font-size:22px; }
    .color-btn .sym.black-piece { color:#0c0c14; -webkit-text-stroke:0.8px rgba(220,220,255,0.28); filter:drop-shadow(0 0 3px rgba(255,255,255,0.2)); }
    .color-btn.selected { background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.4);color:#fff; }
    .color-btn:hover:not(.selected) { border-color:rgba(255,255,255,0.2);color:rgba(255,255,255,0.7); }

    /* Start button */
    .start-play-btn {
      width:100%;background:var(--green);border:none;border-radius:14px;
      padding:14px;color:#fff;font-family:inherit;font-size:15px;font-weight:800;
      cursor:pointer;box-shadow:0 0 32px rgba(34,197,94,0.35);transition:all 0.22s;
    }
    .start-play-btn:hover { background:#16a34a;transform:translateY(-2px);box-shadow:0 0 48px rgba(34,197,94,0.55); }

    /* ── Promotion Overlay ──────────────────────────────── */
    #promotion-overlay {
      position:absolute;inset:0;z-index:20;
      background:rgba(6,8,24,0.94);backdrop-filter:blur(12px);
      display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    }
    #promotion-overlay h2 { font-size:16px;font-weight:900;color:#fff; }
    #promo-choices { display:flex;gap:12px; }
    .promo-btn {
      display:flex;flex-direction:column;align-items:center;gap:6px;
      background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);
      border-radius:16px;padding:16px 20px;cursor:pointer;transition:all 0.2s;font-family:inherit;
    }
    .promo-btn:hover { background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.4);transform:translateY(-2px); }
    .promo-sym { font-size:40px;line-height:1; }
    .promo-lbl { font-size:11px;font-weight:700;color:rgba(255,255,255,0.5); }

    /* ── Game Over ──────────────────────────────────────── */
    #gameover-overlay {
      position:absolute;inset:0;z-index:20;
      background:rgba(6,8,24,0.94);backdrop-filter:blur(14px);
      display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    }
    #gameover-overlay .go-icon { font-size:64px;animation:popIn 0.5s 0.1s both cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes popIn { from{transform:scale(0)rotate(-15deg);opacity:0} to{transform:scale(1)rotate(0);opacity:1} }
    #gameover-winner { font-size:28px;font-weight:900;color:#fff;letter-spacing:-1px;text-shadow:0 0 48px rgba(34,197,94,0.5); }
    #gameover-overlay p { font-size:12px;color:rgba(255,255,255,0.3); }
    .btn-go-new {
      background:var(--green);border:none;border-radius:14px;
      padding:14px 32px;color:#fff;font-family:inherit;font-size:14px;font-weight:800;
      cursor:pointer;box-shadow:0 0 32px rgba(34,197,94,0.4);transition:all 0.22s;
    }
    .btn-go-new:hover { background:#16a34a;transform:translateY(-2px);box-shadow:0 0 48px rgba(34,197,94,0.6); }

    /* ── Scrollbar ──────────────────────────────────────── */
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.07);border-radius:3px; }

    @media (max-width:780px) {
      :root { --cell:44px; }
      .panel { display:none; }
      .piece { font-size:28px; }
      .move-dot { width:14px;height:14px; }
    }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="dot-grid"></div>
<div class="vignette"></div>

<nav class="navbar">
  <div class="nav-left">
    <a href="../../" class="nav-back">&#8592; Arcade</a>
    <div class="nav-title">Schach</div>
  </div>
  <div class="nav-right">
    <div class="turn-badge">
      <div class="turn-dot white" id="turn-dot"></div>
      <div id="turn-indicator">Weiß ist dran</div>
    </div>
    <button class="btn-new" id="new-game-btn">&#8635; Neu</button>
  </div>
</nav>

<div id="wrapper">

  <!-- Left Panel -->
  <div class="panel">
    <div class="panel-box">
      <h3>Schwarz schlägt</h3>
      <div class="captured-row" id="captured-by-black"></div>
    </div>
    <div class="panel-box">
      <h3>Steuerung</h3>
      <div class="info-text">
        <b>Klick</b> Figur wählen<br>
        <b>Klick</b> Ziel wählen<br>
        <b>Punkte</b> = Züge<br>
        <b>Ring</b> = schlagbar
      </div>
    </div>
  </div>

  <!-- Board -->
  <div id="board-wrap">
    <div id="chess-board"></div>

    <!-- ── START OVERLAY ── -->
    <div id="start-overlay">

      <!-- Form (shown first) -->
      <div id="start-form">
        <div class="start-logo">♟ SCHACH<span>.</span></div>

        <!-- Player 1 name -->
        <div class="field-group">
          <div class="field-label">Dein Name</div>
          <input class="start-input" id="p1-name" type="text" placeholder="Spieler 1" maxlength="20" />
        </div>

        <!-- Player 2 name -->
        <div class="field-group">
          <div class="field-label">Gegner Name</div>
          <input class="start-input" id="p2-name" type="text" placeholder="Spieler 2" maxlength="20" />
        </div>

        <!-- Color choice -->
        <div id="color-row" style="width:100%">
          <div class="field-label" style="margin-bottom:8px">Farbe</div>
          <div class="color-row">
            <button class="color-btn" id="color-white">
              <span class="sym">♙</span>Weiß
            </button>
            <button class="color-btn" id="color-black">
              <span class="sym black-piece">♟</span>Schwarz
            </button>
            <button class="color-btn" id="color-random">
              <span class="sym">⚄</span>Zufall
            </button>
          </div>
        </div>

        <button class="start-play-btn" id="start-btn">Spielen &nbsp;→</button>
      </div>

    </div>
    <!-- ── END START OVERLAY ── -->

    <!-- Promotion chooser -->
    <div id="promotion-overlay">
      <h2>Bauernumwandlung</h2>
      <div id="promo-choices"></div>
    </div>

    <!-- Game Over -->
    <div id="gameover-overlay">
      <div class="go-icon">♟</div>
      <div id="gameover-winner">Weiß gewinnt!</div>
      <p>Das Spiel ist vorbei.</p>
      <button class="btn-go-new" id="gameover-new-btn">Neues Spiel</button>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="panel">
    <div class="panel-box">
      <h3>Weiß schlägt</h3>
      <div class="captured-row" id="captured-by-white"></div>
    </div>
    <div class="panel-box">
      <h3>Info</h3>
      <div class="info-text">
        Rochade ✓<br>
        Umwandlung ✓<br>
        Alle Figuren ✓<br>
        Lokal zu zweit ✓
      </div>
    </div>
  </div>

</div>

<script src="game.js"></script>
</body>
</html>
