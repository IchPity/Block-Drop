<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Block Casino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;900&display=swap">

<style>
/* ─── Token system: neon casino floor, dark-first ─────────────────────────
   Layout: centered machine on a felt-green, neon-trimmed floor
   Colors: deep noir bg, gold accent, red danger, green win, cool silver text
   Type: Bebas Neue display (casino marquee) + Inter (numbers/UI) */
:root {
  --bg:         #050510;
  --bg-felt:    #090920;
  --bg-card:    #12122a;
  --bg-card2:   #1a1a38;
  --line:       #2a2a55;
  --gold:       #ffc93c;
  --gold-deep:  #c8950a;
  --gold-glow:  rgba(255,201,60,.35);
  --red:        #ff4060;
  --red-glow:   rgba(255,64,96,.4);
  --green:      #00e676;
  --green-glow: rgba(0,230,118,.35);
  --blue:       #4db5ff;
  --purple:     #b06dff;
  --text:       #f0efff;
  --text-dim:   #7878aa;
  --text-muted: #44446a;
  --radius:     16px;
  --reel-h:     340px;
  color-scheme: dark;
}

* { margin:0; padding:0; box-sizing:border-box; }
[hidden] { display:none!important; }

html, body {
  height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

/* scrollbar */
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

/* ── Arcade floor background ─────────────────────────────────── */
body {
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%,   rgba(255,201,60,.08), transparent 55%),
    radial-gradient(ellipse 40% 40% at 10% 100%, rgba(176,109,255,.07), transparent 60%),
    radial-gradient(ellipse 40% 40% at 90% 90%,  rgba(255,64,96,.06),  transparent 60%),
    var(--bg);
  min-height: 100%;
  padding-block: 28px;
  padding-inline: 16px;
}

/* dot grid */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* ── Layout wrapper ──────────────────────────────────────────── */
.casino-wrap {
  position: relative; z-index: 1;
  max-width: 760px;
  margin: 0 auto;
  display: flex; flex-direction: column; gap: 20px;
}

/* ── Marquee header ──────────────────────────────────────────── */
.marquee {
  text-align: center;
  padding-block: 12px 6px;
}
.marquee-title {
  font-family: 'Bebas Neue', 'Impact', sans-serif;
  font-size: clamp(2.8rem, 8vw, 5rem);
  letter-spacing: .08em;
  line-height: 1;
  background: linear-gradient(135deg, var(--gold), #fff 48%, var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  filter: drop-shadow(0 0 28px var(--gold-glow));
}
.marquee-sub {
  font-size: .78rem; letter-spacing: .18em; text-transform: uppercase;
  color: var(--text-dim); margin-top: 4px;
}

/* neon line divider */
.neon-rule {
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--purple), var(--gold), transparent);
  border: none; margin: 0;
  filter: drop-shadow(0 0 6px var(--gold-glow));
}

/* ── Balance bar ─────────────────────────────────────────────── */
.balance-bar {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 20px;
  gap: 12px;
  flex-wrap: wrap;
}
.balance-item { display: flex; flex-direction: column; gap: 2px; }
.balance-label {
  font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--text-dim);
}
.balance-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.9rem; letter-spacing: .04em;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
  filter: drop-shadow(0 0 8px var(--gold-glow));
  transition: transform .1s;
}
.balance-val.pop { animation: pop .25s ease-out; }
@keyframes pop { 0%{transform:scale(1.25)} 100%{transform:scale(1)} }

.balance-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-add {
  cursor: pointer; border: none; border-radius: 10px;
  background: linear-gradient(135deg, var(--gold-deep), var(--gold));
  color: #0a0a10; font-family: 'Inter', sans-serif;
  font-weight: 700; font-size: .78rem; letter-spacing: .06em;
  padding: 8px 14px; transition: filter .15s, transform .1s;
}
.btn-add:hover { filter: brightness(1.15); transform: translateY(-1px); }
.btn-add:active { transform: translateY(0); }

/* ── Machine cabinet ─────────────────────────────────────────── */
.machine {
  background: linear-gradient(175deg, #1c1c3e 0%, #0f0f26 100%);
  border: 2px solid var(--line);
  border-radius: 24px;
  padding: 24px 20px 20px;
  box-shadow:
    0 0 0 1px rgba(255,201,60,.15),
    0 0 60px rgba(255,201,60,.06),
    0 40px 80px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.07);
  position: relative;
}

/* corner lights */
.machine::before, .machine::after {
  content: '';
  position: absolute; top: 16px; width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 10px 3px var(--gold-glow);
  animation: blink 2.4s ease-in-out infinite;
}
.machine::before { left: 16px; }
.machine::after  { right: 16px; animation-delay: 1.2s; }
@keyframes blink {
  0%,100% { opacity:1; } 50% { opacity:.3; }
}

/* ── Reel window ─────────────────────────────────────────────── */
.reel-window {
  display: flex; gap: 8px;
  background: #060610;
  border: 2px solid rgba(255,201,60,.25);
  border-radius: 16px;
  padding: 8px;
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 4px 24px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.03);
}

/* shine overlay on reels */
.reel-window::after {
  content: '';
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg,
    rgba(255,255,255,.06) 0%,
    transparent 30%,
    transparent 70%,
    rgba(0,0,0,.3) 100%);
  border-radius: 14px;
  z-index: 5;
}

/* payline indicator */
.payline {
  position: absolute; top: 50%; left: 0; right: 0;
  transform: translateY(-50%);
  height: 2px;
  background: rgba(255,201,60,.4);
  z-index: 6;
  pointer-events: none;
}

.reel {
  flex: 1; min-width: 0;
  height: var(--reel-h);
  overflow: hidden;
  border-radius: 10px;
  position: relative;
}

.reel-strip {
  display: flex; flex-direction: column;
  will-change: transform;
  transition: transform 0s;
}
.reel-strip.spinning {
  transition: none;
}

.symbol {
  height: calc(var(--reel-h) / 3);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(2.2rem, 6vw, 3.6rem);
  flex-shrink: 0;
  user-select: none;
  position: relative;
}

/* ── Bet controls ────────────────────────────────────────────── */
.bet-row {
  display: flex; align-items: center; gap: 10px;
  justify-content: center; flex-wrap: wrap;
  margin-top: 16px;
}
.bet-label {
  font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-dim); white-space: nowrap;
}
.bet-stepper {
  display: flex; align-items: center; gap: 0;
  background: var(--bg-card2); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden;
}
.bet-btn {
  cursor: pointer; border: none;
  background: transparent; color: var(--text);
  width: 36px; height: 36px;
  font-size: 1.1rem; font-weight: 700;
  transition: background .12s;
}
.bet-btn:hover { background: rgba(255,255,255,.08); }
.bet-val {
  padding: 0 14px; font-weight: 700; font-size: .95rem;
  color: var(--gold); font-variant-numeric: tabular-nums;
  min-width: 60px; text-align: center;
}

/* ── Spin button ─────────────────────────────────────────────── */
.spin-btn {
  cursor: pointer; border: none;
  background: linear-gradient(135deg, var(--red) 0%, #cc2040 100%);
  color: #fff;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.55rem; letter-spacing: .1em;
  padding: 14px 48px; border-radius: 50px;
  box-shadow: 0 0 0 3px rgba(255,64,96,.3), 0 8px 24px rgba(255,64,96,.35);
  transition: transform .12s, box-shadow .12s, filter .12s;
  position: relative; overflow: hidden;
}
.spin-btn::before {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
  transform: skewX(-20deg);
  transition: left .5s;
}
.spin-btn:hover::before { left: 150%; }
.spin-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 0 0 3px rgba(255,64,96,.4), 0 14px 32px rgba(255,64,96,.5);
}
.spin-btn:active:not(:disabled) { transform: translateY(0); }
.spin-btn:disabled {
  filter: saturate(.3) brightness(.6);
  cursor: not-allowed;
  transform: none;
}

/* ── Result banner ───────────────────────────────────────────── */
.result-banner {
  min-height: 52px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.6rem; letter-spacing: .1em;
  border-radius: 12px;
  transition: opacity .3s;
  margin-top: 12px;
  padding: 8px 16px;
}
.result-banner.win {
  background: rgba(0,230,118,.1);
  border: 1px solid rgba(0,230,118,.3);
  color: var(--green);
  filter: drop-shadow(0 0 12px var(--green-glow));
}
.result-banner.lose {
  background: rgba(255,64,96,.08);
  border: 1px solid rgba(255,64,96,.2);
  color: var(--red);
}
.result-banner.idle {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text-dim);
}
.result-banner.jackpot {
  background: rgba(255,201,60,.12);
  border: 1px solid rgba(255,201,60,.4);
  color: var(--gold);
  filter: drop-shadow(0 0 16px var(--gold-glow));
  animation: jackpot-pulse 1s ease-in-out infinite;
}
@keyframes jackpot-pulse {
  0%,100% { filter: drop-shadow(0 0 16px var(--gold-glow)); }
  50%      { filter: drop-shadow(0 0 32px var(--gold-glow)) brightness(1.2); }
}

/* ── Paytable ────────────────────────────────────────────────── */
.paytable {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 20px;
}
.paytable-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem; letter-spacing: .12em;
  color: var(--gold); margin-bottom: 12px;
}
.paytable-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
}
.pay-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-card2);
  border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 10px;
}
.pay-syms { font-size: 1.1rem; letter-spacing: .06em; white-space: nowrap; }
.pay-mult {
  margin-left: auto;
  font-weight: 700; font-size: .82rem;
  color: var(--gold); white-space: nowrap;
}

/* ── Load coins modal ────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.75);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.modal-backdrop.open { opacity: 1; pointer-events: all; }

.modal {
  background: linear-gradient(165deg, #1e1e44, #12122c);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 28px 24px;
  max-width: 440px; width: 100%;
  box-shadow: 0 0 0 1px rgba(255,201,60,.12), 0 40px 80px rgba(0,0,0,.6);
  transform: translateY(24px);
  transition: transform .25s cubic-bezier(.34,1.56,.64,1);
}
.modal-backdrop.open .modal { transform: translateY(0); }

.modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem; letter-spacing: .1em;
  color: var(--gold); margin-bottom: 4px;
}
.modal-sub { font-size: .8rem; color: var(--text-dim); margin-bottom: 20px; }

.packages { display: flex; flex-direction: column; gap: 8px; }
.pkg {
  cursor: pointer; border: none;
  background: var(--bg-card2);
  border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 16px;
  display: flex; align-items: center; gap: 14px;
  transition: border-color .15s, background .15s, transform .1s;
  text-align: left;
  color: var(--text);
  font-family: 'Inter', sans-serif;
}
.pkg:hover { border-color: var(--gold); background: rgba(255,201,60,.07); transform: translateX(3px); }
.pkg:active { transform: translateX(1px); }
.pkg.popular { border-color: rgba(255,201,60,.5); }
.pkg-icon { font-size: 1.8rem; }
.pkg-info { flex: 1; }
.pkg-name { font-weight: 700; font-size: .92rem; }
.pkg-coins { font-size: .78rem; color: var(--text-dim); margin-top: 1px; }
.pkg-coins strong { color: var(--gold); }
.pkg-badge {
  font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  background: var(--gold); color: #0a0a10;
  border-radius: 20px; padding: 2px 8px;
}
.pkg-price {
  font-weight: 700; font-size: 1rem;
  color: var(--text-dim);
}

.modal-note {
  font-size: .72rem; color: var(--text-muted);
  margin-top: 14px; text-align: center; line-height: 1.5;
}
.modal-close {
  position: absolute; top: 14px; right: 14px;
  cursor: pointer; border: none; background: transparent;
  color: var(--text-dim); font-size: 1.3rem;
  padding: 4px 8px; border-radius: 8px; transition: background .12s;
}
.modal-close:hover { background: rgba(255,255,255,.08); }
.modal { position: relative; }

/* ── Stats row ───────────────────────────────────────────────── */
.stats-row {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.stat-card {
  flex: 1; min-width: 100px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 3px;
}
.stat-lbl {
  font-size: .66rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-dim);
}
.stat-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.45rem; letter-spacing: .04em;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.stat-val.green { color: var(--green); }
.stat-val.red   { color: var(--red); }

/* ── win burst ───────────────────────────────────────────────── */
.win-particles {
  position: fixed; inset: 0; pointer-events: none; z-index: 200;
}
.particle {
  position: absolute;
  width: 10px; height: 10px;
  border-radius: 2px;
  animation: fall linear forwards;
}
@keyframes fall {
  0%   { opacity:1; transform: translateY(-20px) rotate(0deg) scale(1); }
  100% { opacity:0; transform: translateY(60vh) rotate(720deg) scale(.4); }
}

/* ── Responsive tweaks ───────────────────────────────────────── */
@media (max-width: 520px) {
  :root { --reel-h: 240px; }
  .symbol { font-size: 2rem; }
  .machine { padding: 16px 12px; }
  .paytable-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<!-- Win particles container -->
<div class="win-particles" id="winParticles"></div>

<!-- Load coins modal -->
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="Coins aufladen">
  <div class="modal">
    <button class="modal-close" id="modalClose" aria-label="Schließen">✕</button>

</div>

<div class="casino-wrap">
  <!-- Marquee -->
  <header class="marquee">
    <div class="marquee-title">BLOCK CASINO</div>
    <p class="marquee-sub">Fortune Slots · Spielgeld · Immer geöffnet</p>
  </header>
  <hr class="neon-rule">

  <!-- Balance -->
  <div class="balance-bar">
    <div class="balance-item">
      <span class="balance-label">Guthaben</span>
      <span class="balance-val" id="balanceVal">1.000</span>
    </div>
    <div class="balance-item" style="align-items:center">
      <span class="balance-label">Letzter Gewinn</span>
      <span class="balance-val" id="lastWinVal" style="color:var(--green)">—</span>

      <button class="btn-add" id="btnLoad">+ Coins laden</button>

  <!-- Slot machine -->
  <div class="machine">
    <div class="reel-window">
      <div class="payline"></div>
      <div class="reel" id="reel0"><div class="reel-strip" id="strip0"></div></div>
      <div class="reel" id="reel1"><div class="reel-strip" id="strip1"></div></div>

      <span class="bet-label">Einsatz</span>

        <button class="bet-btn" id="betDown">−</button>
        <span class="bet-val" id="betVal">50</span>
        <button class="bet-btn" id="betUp">+</button>

      <span class="stat-lbl">Spiele</span>

    <div class="stat-card">
      <span class="stat-lbl">Gewonnen</span>
      <span class="stat-val green" id="statWins">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-lbl">Größter Gewinn</span>
      <span class="stat-val" id="statBest">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-lbl">Jackpots</span>
      <span class="stat-val" style="color:var(--gold)" id="statJackpots">0</span>
    </div>
  </div>

  <!-- Paytable -->
  <div class="paytable">
    <div class="paytable-title">Gewinntabelle</div>
    <div class="paytable-grid" id="paytableGrid"></div>
  </div>
</div>

<script>
'use strict';

// ── Symbols & payouts ──────────────────────────────────────────
const SYMBOLS = [
  { s: '7️⃣', weight: 1,  mult: 20,  label: '777 Jackpot' },
  { s: '💎', weight: 2,  mult: 10,  label: 'Diamant' },
  { s: '🔔', weight: 4,  mult: 5,   label: 'Glocke' },
  { s: '⭐', weight: 6,  mult: 3,   label: 'Stern' },
  { s: '🍒', weight: 9,  mult: 2,   label: 'Kirsche' },
  { s: '🍋', weight: 10, mult: 1.5, label: 'Zitrone' },
  { s: '🍇', weight: 12, mult: 1.5, label: 'Traube' },
  { s: '🎴', weight: 14, mult: 1.2, label: 'Karte' },
];

// weighted random pick
const POOL = SYMBOLS.flatMap(sym => Array(sym.weight).fill(sym));
function randSym() { return POOL[Math.floor(Math.random() * POOL.length)]; }

// ── State ──────────────────────────────────────────────────────
let balance  = 1000;
let bet      = 50;
let spinning = false;
let stats    = { spins: 0, wins: 0, best: 0, jackpots: 0 };

const BET_STEPS = [10, 25, 50, 100, 250, 500];
let betIdx = 2;

// ── DOM refs ───────────────────────────────────────────────────
const balanceVal  = document.getElementById('balanceVal');
const lastWinVal  = document.getElementById('lastWinVal');
const betValEl    = document.getElementById('betVal');
const spinBtn     = document.getElementById('spinBtn');
const resultBanner= document.getElementById('resultBanner');
const strips      = [0,1,2].map(i => document.getElementById('strip'+i));
const statEls     = {
  spins:    document.getElementById('statSpins'),
  wins:     document.getElementById('statWins'),
  best:     document.getElementById('statBest'),
  jackpots: document.getElementById('statJackpots'),
};

// ── Utility ────────────────────────────────────────────────────
function fmt(n) { return n.toLocaleString('de-DE'); }
function clamp(n,a,b) { return Math.max(a,Math.min(b,n)); }

function updateBalance(delta = 0) {
  balance += delta;
  balance = Math.max(0, balance);
  balanceVal.textContent = fmt(balance);
  if (delta !== 0) {
    balanceVal.classList.remove('pop');
    void balanceVal.offsetWidth;
    balanceVal.classList.add('pop');
  }
}

function updateBet() {
  bet = BET_STEPS[betIdx];
  betValEl.textContent = fmt(bet);
}

function updateStats() {
  statEls.spins.textContent    = stats.spins;
  statEls.wins.textContent     = stats.wins;
  statEls.best.textContent     = stats.best > 0 ? fmt(stats.best) : '—';
  statEls.jackpots.textContent = stats.jackpots;
}

// ── Build reels ────────────────────────────────────────────────
const REEL_ROWS = 9; // rows per strip (3 visible + buffer top/bottom)
const STRIP_H   = () => {
  const r = document.getElementById('reel0');
  return r ? r.offsetHeight : 300;
};

function buildStrip(strip) {
  strip.innerHTML = '';
  const pool = [];
  for (let i = 0; i < REEL_ROWS; i++) pool.push(randSym());
  pool.forEach(sym => {
    const el = document.createElement('div');
    el.className = 'symbol';
    el.textContent = sym.s;
    strip.appendChild(el);
  });
  return pool;
}

let reelContents = [[], [], []];

function initReels() {
  strips.forEach((strip, i) => {
    reelContents[i] = buildStrip(strip);
    // start at showing index 3 (middle of strip)
    setStripPos(strip, 3);
  });
}

function setStripPos(strip, row) {
  const h = STRIP_H() / 3; // symbol height
  strip.style.transform = `translateY(${-row * h}px)`;
}

function getSymAtRow(strip, row) {
  return strip.children[row];
}

// ── Spin logic ─────────────────────────────────────────────────
function spin() {
  if (spinning) return;
  if (balance < bet) {
    flashBanner('Nicht genug Coins! Lade mehr auf.', 'lose');
    return;
  }

  spinning = true;
  spinBtn.disabled = true;
  updateBalance(-bet);
  stats.spins++;
  resultBanner.className = 'result-banner idle';
  resultBanner.textContent = '…';
  lastWinVal.textContent = '—';

  // Determine final symbols (before spinning)
  const finals = [randSym(), randSym(), randSym()];

  // Animate each reel with offset timing
  const promises = strips.map((strip, i) => spinReel(strip, i, finals[i]));

  Promise.all(promises).then(() => {
    spinning = false;
    spinBtn.disabled = false;
    evaluateResult(finals);
    updateStats();
  });
}

function spinReel(strip, reelIdx, finalSym) {
  return new Promise(resolve => {
    const delay   = reelIdx * 320; // stagger
    const duration= 900 + reelIdx * 350 + Math.random() * 200;

    setTimeout(() => {
      // Rebuild strip so finalSym lands at display row (index 1 of visible = middle)
      strip.innerHTML = '';
      const count = 24 + Math.floor(Math.random() * 8);
      for (let i = 0; i < count; i++) strip.appendChild(makeSymEl(randSym()));
      // final symbol at position count (will scroll to)
      strip.appendChild(makeSymEl(finalSym));
      // two more after
      strip.appendChild(makeSymEl(randSym()));
      strip.appendChild(makeSymEl(randSym()));

      const symH   = STRIP_H() / 3;
      const target = count; // index of finalSym

      // Start from top
      strip.style.transition = 'none';
      strip.style.transform  = `translateY(0px)`;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        strip.style.transition = `transform ${duration}ms cubic-bezier(.22,.65,.35,1)`;
        // Position so finalSym is in center row (offset by 1 row from top of visible)
        strip.style.transform = `translateY(${-(target - 1) * symH}px)`;

        setTimeout(() => {
          // gentle bounce back
          strip.style.transition = `transform .18s cubic-bezier(.34,1.56,.64,1)`;
          strip.style.transform  = `translateY(${-(target - 1) * symH - 6}px)`;
          setTimeout(() => {
            strip.style.transition = `transform .1s ease-out`;
            strip.style.transform  = `translateY(${-(target - 1) * symH}px)`;
            setTimeout(resolve, 120);
          }, 180);
        }, duration);
      }));
    }, delay);
  });
}

function makeSymEl(sym) {
  const el = document.createElement('div');
  el.className = 'symbol';
  el.textContent = sym.s;
  el._sym = sym;
  return el;
}

// ── Result evaluation ──────────────────────────────────────────
function evaluateResult(finals) {
  const a = finals[0], b = finals[1], c = finals[2];

  if (a.s === b.s && b.s === c.s) {
    // Triple match
    const winAmt = Math.round(bet * a.mult * 3);
    const isJackpot = a.s === '7️⃣';
    updateBalance(winAmt);
    stats.wins++;
    if (winAmt > stats.best) stats.best = winAmt;
    if (isJackpot) stats.jackpots++;

    lastWinVal.textContent = '+' + fmt(winAmt);
    if (isJackpot) {
      setBanner(`🏆 JACKPOT! +${fmt(winAmt)} Coins`, 'jackpot');
      burst(64, ['#ffc93c','#fff','#ff4060','#b06dff']);
    } else {
      setBanner(`🎉 Treffer! +${fmt(winAmt)} Coins`, 'win');
      burst(32, ['#00e676','#4db5ff','#ffc93c']);
    }
  } else if (a.s === b.s || b.s === c.s || a.s === c.s) {
    // Pair match
    const matched = (a.s === b.s) ? a : (b.s === c.s) ? b : a;
    const winAmt  = Math.round(bet * matched.mult * 0.8);
    updateBalance(winAmt);
    stats.wins++;
    if (winAmt > stats.best) stats.best = winAmt;

    lastWinVal.textContent = '+' + fmt(winAmt);
    setBanner(`✨ Paar! +${fmt(winAmt)} Coins`, 'win');
  } else {
    setBanner('Kein Treffer. Nochmal?', 'lose');
  }
}

function setBanner(text, cls) {
  resultBanner.className = `result-banner ${cls}`;
  resultBanner.textContent = text;
}
function flashBanner(text, cls) {
  setBanner(text, cls);
  setTimeout(() => setBanner('Drücke SPIN!', 'idle'), 2200);
}

// ── Win burst particles ────────────────────────────────────────
function burst(count, colors) {
  const container = document.getElementById('winParticles');
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left       = `${10 + Math.random() * 80}vw`;
    p.style.top        = `${-10}px`;
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.width      = `${6 + Math.random() * 10}px`;
    p.style.height     = `${6 + Math.random() * 10}px`;
    p.style.animationDuration  = `${1.2 + Math.random() * 1.4}s`;
    p.style.animationDelay     = `${Math.random() * .5}s`;
    container.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}

// ── Paytable ───────────────────────────────────────────────────
function buildPaytable() {
  const grid = document.getElementById('paytableGrid');
  SYMBOLS.forEach(sym => {
    const row = document.createElement('div');
    row.className = 'pay-row';
    row.innerHTML = `
      <span class="pay-syms">${sym.s}${sym.s}${sym.s}</span>
      <span class="pay-mult">×${sym.mult}</span>
    `;
    grid.appendChild(row);
  });
  // also add pair note
  const pair = document.createElement('div');
  pair.className = 'pay-row';
  pair.innerHTML = `<span class="pay-syms" style="font-size:.85rem;color:var(--text-dim)">Paar</span><span class="pay-mult">×0.8</span>`;
  grid.appendChild(pair);
}

// ── Controls ───────────────────────────────────────────────────
document.getElementById('betDown').addEventListener('click', () => {
  betIdx = clamp(betIdx - 1, 0, BET_STEPS.length - 1);
  updateBet();
});
document.getElementById('betUp').addEventListener('click', () => {
  betIdx = clamp(betIdx + 1, 0, BET_STEPS.length - 1);
  updateBet();
});
spinBtn.addEventListener('click', spin);

// keyboard shortcut: Space = spin
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !spinning) { e.preventDefault(); spin(); }
});

// ── Modal ──────────────────────────────────────────────────────
const backdrop = document.getElementById('modalBackdrop');
document.getElementById('btnLoad').addEventListener('click', () => {
  backdrop.classList.add('open');
});
document.getElementById('modalClose').addEventListener('click', () => {
  backdrop.classList.remove('open');
});
backdrop.addEventListener('click', e => {
  if (e.target === backdrop) backdrop.classList.remove('open');
});
document.querySelectorAll('.pkg').forEach(btn => {
  btn.addEventListener('click', () => {
    const coins = parseInt(btn.dataset.coins, 10);
    const bonus  = btn.querySelector('.pkg-coins').textContent.includes('Bonus')
      ? parseInt(btn.querySelector('.pkg-coins strong').textContent.replace(/\D/g,''), 10) - coins
      : 0;
    updateBalance(coins + bonus);
    backdrop.classList.remove('open');
    setBanner(`+${fmt(coins + bonus)} Coins aufgeladen! 🎉`, 'win');
    burst(20, ['#ffc93c','#fff']);
    setTimeout(() => setBanner('Drücke SPIN!', 'idle'), 2500);
  });
});

// ── Init ───────────────────────────────────────────────────────
buildPaytable();
// Wait for fonts/layout before building reels
window.addEventListener('load', () => {
  initReels();
  updateBet();
  updateBalance(0);
  updateStats();
});
</script>

</body>
</html>
