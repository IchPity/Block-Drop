<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Block Presser — Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Kanit:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&family=Share+Tech+Mono&family=Tilt+Neon&display=swap" rel="stylesheet">
  <script src="/mode.js"></script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #ffb000; }
    body { min-height: 100vh; padding: 76px 14px 32px; overflow-x: clip; }

    .wrap {
      position: relative; z-index: 1; max-width: 1020px; margin: 0 auto;
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 22px;
    }
    @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }

    /* Gehäuse */
    .panel {
      background: linear-gradient(180deg, rgba(196,178,255,0.06), transparent 140px), var(--board-raised);
      border: 1px solid var(--board-line); border-radius: 16px; padding: 18px;
      box-shadow: inset 0 1px 0 rgba(255,176,0,0.65), 0 26px 60px rgba(8,4,26,0.6);
    }
    .panel h2 {
      font-family: var(--font-cab); font-style: italic; font-size: 20px; font-weight: 900;
      color: var(--chalk); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 14px;
    }
    .panel h2::after { content: ''; display: block; width: 46px; height: 3px; margin-top: 6px; border-radius: 2px; background: var(--marquee); box-shadow: 0 4px 14px var(--marquee); }

    /* ── Presse ── */
    .press { text-align: center; position: sticky; top: 84px; align-self: start; }
    @media (max-width: 760px) { .press { position: relative; top: auto; } }
    /* Zählwerk: Leuchtanzeige hinter dunklem Glas */
    .count {
      padding: 14px 12px 12px; border-radius: 12px; background: #05030c;
      border: 1px solid rgba(255,176,0,0.3); box-shadow: inset 0 0 30px rgba(0,0,0,0.9), inset 0 -18px 30px rgba(255,176,0,0.08);
      font-family: var(--font-data); font-size: clamp(34px, 7vw, 54px); line-height: 1;
      color: #ffc23a; text-shadow: 0 0 2px #fff3c4, 0 4px 26px rgba(255,176,0,0.75); font-variant-numeric: tabular-nums;
    }
    .count small { display: block; font-family: var(--font-cab); font-style: italic; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-dim); margin-top: 8px; text-shadow: none; }
    .rate { font-family: var(--font-data); color: var(--neon-cyan); margin-top: 10px; font-size: 15px; }

    .stage { position: relative; height: 300px; margin: 8px 0 6px; display: grid; place-items: center; --blockcol: #ffb000; }
    /* Lichtkegel unter dem Block */
    .stage::before {
      content: ''; position: absolute; left: 2%; right: 2%; bottom: -6px; height: 110px; pointer-events: none;
      background: radial-gradient(ellipse 50% 50% at 50% 55%, color-mix(in srgb, var(--blockcol) 50%, transparent), color-mix(in srgb, var(--blockcol) 16%, transparent) 50%, transparent 74%);
    }
    .block-btn {
      position: relative; width: 180px; height: 180px; border: 0; cursor: pointer;
      background: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      transition: transform .09s var(--ease-out); margin-top: 74px; transform-origin: 50% 100%;
    }
    .block-btn:active, .block-btn.hit { transform: scale(1.1, .86); transition-duration: .03s; }
    .block-btn:focus-visible { outline: 3px solid var(--neon-cyan); outline-offset: 8px; border-radius: 22px; }
    .block-face {
      position: absolute; inset: 0; border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.55), transparent 42%),
        radial-gradient(circle at 70% 80%, rgba(0,0,0,.25), transparent 60%),
        var(--blockcol);
      box-shadow: inset 0 -14px 0 rgba(0,0,0,.22), inset 0 0 0 4px rgba(255,255,255,.3), 0 16px 0 rgba(0,0,0,.45), 0 30px 60px color-mix(in srgb, var(--blockcol) 55%, transparent);
      display: grid; place-items: center; transition: background-color .3s, box-shadow .3s;
    }
    .block-face::after { content: ''; width: 34px; height: 56px; border-radius: 6px; background: rgba(10,5,32,.5); box-shadow: inset 0 3px 0 rgba(0,0,0,.3); }
    /* Hydraulik: Stempel mit zwei Kolben */
    .plate {
      position: absolute; top: 46px; left: 50%; width: 230px; height: 24px; margin-left: -115px;
      border-radius: 6px; background: linear-gradient(180deg, #a59cc8, #5a517c 55%, #2e2748); border: 1px solid rgba(196,178,255,.4);
      box-shadow: 0 8px 0 rgba(0,0,0,.45), 0 0 0 1px #000; transition: transform .09s var(--ease-out); pointer-events: none; z-index: 2;
    }
    .plate::before, .plate::after {
      content: ''; position: absolute; bottom: 100%; width: 18px; height: 46px;
      background: linear-gradient(90deg, #4a4366, #cfc8ea 45%, #4a4366);
    }
    .plate::before { left: 34px; } .plate::after { right: 34px; }
    .stage:has(.block-btn:active) .plate, .stage:has(.hit) .plate { transform: translateY(38px); transition-duration: .03s; }

    .pop {
      position: absolute; pointer-events: none; font-family: var(--font-cab); font-style: italic;
      font-weight: 900; font-size: 26px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.6), 0 6px 22px var(--blockcol);
      animation: pop .9s var(--ease-out) forwards; z-index: 5; white-space: nowrap;
    }
    @keyframes pop { from { transform: translateY(0) scale(.5); } 18% { transform: translateY(-26px) scale(1.25); } to { transform: translateY(-120px) scale(1); opacity: 0; } }

    /* Förderband: läuft, sobald Maschinen von allein pressen */
    .belt { position: relative; height: 22px; margin: 0 6px 12px; border-radius: 11px; background: #05030c; border: 1px solid var(--board-line); overflow: hidden; }
    .belt i {
      position: absolute; inset: 3px 0; width: 200%; display: block; opacity: .16; transition: opacity .4s;
      background: repeating-linear-gradient(90deg, var(--marquee) 0 14px, transparent 14px 46px);
      animation: belt var(--belt, 3s) linear infinite paused;
    }
    /* steht das Band, sieht man die Glieder nur schwach; läuft es, leuchten sie */
    .belt.on i { opacity: .9; animation-play-state: running; }
    @keyframes belt { to { transform: translateX(-46px); } }

    .hint { font-size: 13px; color: var(--chalk-faint); }

    /* Schulglocke (Bonus) */
    .bell {
      position: fixed; z-index: 60; width: 72px; height: 72px; border-radius: 50%; display: none; place-items: center;
      background: radial-gradient(circle at 35% 30%, #fff, var(--neon-cyan) 40%, #0a6f86); color: var(--ink); font-size: 34px; cursor: pointer;
      border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(46,230,255,.25), 0 14px 40px rgba(46,230,255,.7);
      animation: bellshake .5s ease-in-out infinite alternate;
    }
    .bell.show { display: grid; }
    .bell svg { width: 40px; height: 40px; display: block; }
    .bell::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--neon-cyan); animation: bellRing 1.1s var(--ease-out) infinite; }
    @keyframes bellshake { from { transform: rotate(-16deg) scale(1); } to { transform: rotate(16deg) scale(1.08); } }
    @keyframes bellRing { from { transform: scale(.8); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }

    .buff {
      display: none; margin-top: 10px; font-family: var(--font-data); font-size: 14px;
      color: var(--ink); background: var(--neon-cyan); padding: 5px 12px; border-radius: 6px;
      box-shadow: 0 8px 24px rgba(46,230,255,.45);
    }
    .buff.show { display: inline-block; }
    /* Pausenglocke aktiv: die ganze Presse läuft heiß */
    body.buffed .count { border-color: var(--neon-cyan); color: #c8f8ff; text-shadow: 0 0 2px #fff, 0 4px 26px var(--neon-cyan); }
    /* der heiße Schein ist fertig gemalt und pulsiert nur über die Deckkraft */
    .press::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
      box-shadow: inset 0 1px 0 var(--neon-cyan), 0 26px 70px rgba(46,230,255,.45);
    }
    body.buffed .press::after { animation: hot .6s ease-in-out infinite alternate; }
    @keyframes hot { to { opacity: 1; } }

    /* ── Werkstatt ── */
    .shop { display: flex; flex-direction: column; gap: 8px; }
    .up {
      display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; text-align: left;
      width: 100%; padding: 10px 12px; border-radius: 12px; cursor: pointer;
      background: rgba(196,178,255,.04); border: 1px solid var(--board-line); color: var(--chalk);
      font-family: inherit; transition: background .15s, border-color .15s, opacity .15s, transform .2s var(--ease-out), box-shadow .2s;
    }
    .up:hover:not(:disabled) { background: rgba(255,176,0,.1); border-color: rgba(255,176,0,.6); transform: translateX(4px); box-shadow: 0 10px 26px rgba(255,176,0,.18); }
    .up:disabled { opacity: .5; cursor: not-allowed; }
    .up.can { border-color: rgba(255,176,0,.5); background: rgba(255,176,0,.07); }
    .up.can .up-ico { box-shadow: 0 6px 18px rgba(255,176,0,.45); background: rgba(255,176,0,.18); }
    .up:active:not(:disabled) { transform: scale(.985); }
    .up:focus-visible { outline: 2px solid var(--neon-cyan); }
    .up-ico {
      width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center;
      font-size: 24px; background: rgba(196,178,255,.08); transition: box-shadow .2s, background .2s;
      color: var(--mc, var(--marquee));
    }
    .up-ico svg { width: 30px; height: 30px; display: block; }
    .spu .up-ico svg { width: 24px; height: 24px; }
    .up-name { font-family: var(--font-cab); font-style: italic; font-weight: 700; font-size: 16px; }
    .up-desc { font-size: 13px; color: var(--chalk-dim); line-height: 1.35; }
    .up-side { text-align: right; }
    .up-cost { font-family: var(--font-data); font-size: 15px; color: var(--marquee); }
    .up-mile { display: inline-block; margin-top: 2px; font-size: 12px; color: var(--chalk-faint); font-family: var(--font-data); }
    .matura { margin-top: 16px; text-align: center; }
    .matura button {
      font-family: var(--font-cab); font-style: italic; font-weight: 800; font-size: 14px; padding: 11px 16px; border-radius: 999px; cursor: pointer; color: var(--ink); border: 0;
      background: linear-gradient(180deg, #ffd476, var(--marquee) 55%, #c98300); box-shadow: 0 0 0 3px rgba(10,5,32,.9), 0 10px 26px rgba(255,176,0,.45);
      animation: lamp 1.4s ease-in-out infinite;
    }
    @keyframes lamp { 50% { filter: brightness(1.2); } }
    .matura button:disabled { background: rgba(196,178,255,.08); color: var(--chalk-faint); cursor: not-allowed; box-shadow: none; animation: none; font-weight: 600; }
    .up-own { font-family: var(--font-cab); font-style: italic; font-size: 24px; font-weight: 900; color: var(--chalk-faint); line-height: 1; margin-top: 2px; }

    /* Bestenliste als Highscore-Tafel */
    .board { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .board li {
      display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; padding: 8px 10px; border-radius: 6px;
      background: rgba(12,6,34,.7); font-family: var(--font-data); font-size: 15px;
    }
    .board li:first-child { color: var(--marquee); box-shadow: inset 0 0 0 1px rgba(255,176,0,.4); }
    .board li.me { background: rgba(46,230,255,.12); box-shadow: inset 0 0 0 1px rgba(46,230,255,.5); }
    .board .rk { color: var(--chalk-faint); }
    .board .sc { color: var(--marquee); }
    .board-empty { display: block !important; color: var(--chalk-dim); font-family: var(--font-body) !important; }
    .menu-box .tools { margin-top: 12px; }
    .tools { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
    .tool {
      font-family: var(--font-cab); font-size: 13px; font-weight: 600; color: var(--chalk-dim); background: rgba(196,178,255,.04);
      border: 1px solid var(--board-line); border-radius: 8px; padding: 7px 13px; min-height: 36px; cursor: pointer; transition: color .2s, border-color .2s;
    }
    .tool:hover { color: var(--chalk); border-color: var(--neon-cyan); }
    .stats { font-size: 13px; color: var(--chalk-dim); margin-top: 12px; line-height: 1.6; }
    .stats b { color: var(--chalk); }
    .goal { margin-top: 12px; height: 8px; border-radius: 4px; background: #05030c; overflow: hidden; border: 1px solid var(--board-line); }
    .goal > i { display: block; height: 100%; transform: scaleX(0); transform-origin: 0 50%; background: linear-gradient(90deg, var(--neon-pink), var(--marquee)); transition: transform .3s; }
    .goal-lbl { font-size: 12px; color: var(--chalk-dim); margin-top: 6px; font-family: var(--font-data); }

    /* ── Menü (Esc) ── */
    .menu { position: fixed; inset: 0; z-index: 90; display: none; padding: 76px 16px 16px; background: rgba(12,6,34,.93); overflow-y: auto; }
    .menu.show { display: flex; animation: fadein .2s ease-out; }
    @keyframes fadein { from { opacity: 0; } }
    .menu-box { width: 100%; max-width: 420px; margin: auto; background: var(--board-raised); border: 1px solid var(--board-line); border-radius: 16px; padding: 16px; box-shadow: inset 0 1px 0 rgba(255,214,10,.7), 0 24px 60px rgba(0,0,0,.6); animation: menuIn .35s var(--ease-out); }
    @keyframes menuIn { from { transform: translateY(26px) scale(.96); opacity: 0; } }
    .menu-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
    .menu-head h2 { margin: 0; }
    .sp-bal { font-family: var(--font-cab); font-style: italic; font-size: 22px; font-weight: 900; color: #ffd60a; margin-bottom: 12px; }
    .sp-shop { display: flex; flex-direction: column; gap: 6px; }
    .spu { padding: 7px 10px; grid-template-columns: 36px 1fr auto; gap: 10px; }
    .spu .up-ico { width: 36px; height: 36px; font-size: 19px; }
    .spu .up-cost { font-size: 15px; font-weight: 700; }
    .spu .up-cost::before { content: '★ '; }
    .spu .up-own { font-family: var(--font-data); font-style: normal; font-size: 12px; font-weight: 400; color: var(--chalk-dim); margin-top: 1px; }
    .menu-reset { margin-top: 14px; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,46,99,.5); background: rgba(255,46,99,.08); text-align: center; }
    .menu-reset p { font-size: 13px; color: var(--chalk-dim); line-height: 1.45; margin-bottom: 10px; text-wrap: pretty; }
    .menu-reset button { font-family: var(--font-cab); font-weight: 700; font-size: 14px; padding: 10px 14px; width: 100%; border-radius: 10px; cursor: pointer; color: #fff; background: #d81b4e; border: 0; }
    .menu-reset button:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }
    .menu-reset button:disabled { background: rgba(196,178,255,.08); color: var(--chalk-faint); cursor: not-allowed; }
    .up.flash { animation: flash .9s ease-out; }
    @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(255,176,0,.9); background: rgba(255,176,0,.4); } 100% { box-shadow: 0 0 0 20px rgba(255,176,0,0); } }
    @media (prefers-reduced-motion: reduce) { .bell, .up.flash, .matura button, .belt i { animation: none; } body.buffed .press::after { animation: none; opacity: 1; } .pop { animation-duration: .01s; } }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <a href="../../" class="nav-back">&larr; Arcade</a>
    <div class="nav-title"><span class="pill">BP</span> Block Presser</div>
  </div>
  <div class="nav-right">
    <div data-auth-slot></div>
  </div>
</nav>

<main class="wrap">
  <section class="panel press" aria-label="Presse">
    <div class="count"><span id="count">0</span><small>Blöcke</small></div>
    <div class="rate"><span id="rate">0</span> Blöcke / Sek.</div>
    <div class="stage" id="stage">
      <div class="plate"></div>
      <button class="block-btn" id="block" aria-label="Block pressen"><div class="block-face"></div></button>
    </div>
    <div class="belt" id="belt" aria-hidden="true"><i></i></div>
    <div class="hint">Klick, Tippen oder Leertaste</div>
    <div class="buff" id="buff" role="status" aria-live="polite"></div>
    <div class="stats" id="stats"></div>
    <div class="matura">
      <button id="matura"><span id="matura-txt"></span></button>
      <div class="hint" id="pts" style="margin-top:8px"></div>
    </div>
    <div class="goal-wrap">
      <div class="goal"><i id="goal-bar"></i></div>
      <div class="goal-lbl" id="goal-lbl"></div>
    </div>
    <div class="tools">
      <button class="tool" id="save">Speichern</button>
      <button class="tool" id="reset">Menü (Esc)</button>
    </div>
  </section>

  <section class="panel" aria-label="Verbesserungen">
    <h2>Werkstatt</h2>
    <div class="shop" id="shop"></div>
    <h2 style="margin-top:26px">Bestenliste</h2>
    <ol class="board" id="board"><li class="board-empty">Lädt …</li></ol>
    <div class="hint" id="board-note" style="margin-top:8px"></div>
  </section>
</main>

<div class="menu" id="menu" role="dialog" aria-modal="true" aria-labelledby="menu-h">
  <div class="menu-box">
    <div class="menu-head"><h2 id="menu-h">Menü</h2><button class="tool" id="menu-x">✕ Schließen (Esc)</button></div>
    <div class="sp-bal">★ Spezialpunkte: <span id="sp">0</span></div>
    <div class="sp-shop" id="sp-shop"></div>
    <div class="menu-reset">
      <p id="reset-info"></p>
      <button id="prestige"></button>
    </div>
    <div class="tools"><button class="tool" id="save2">Speichern</button><button class="tool" id="credits" hidden>Abspann ansehen</button></div>
  </div>
</div>

<button class="bell" id="bell" aria-label="Schulglocke — Bonus einsammeln"></button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/fx.js"></script>
<script src="/auth.js"></script>
<script>
(() => {
  const KEY = 'blockpresser_v1';
  const TAB = Math.random().toString(36).slice(2); // unterscheidet diesen Tab von anderen
  const COLORS = ['#ffb000', '#ff3d9a', '#2ee6ff', '#b8ff3d', '#a78bfa', '#ff8a2e'];
  const FX = window.FX;

  // Gezeichnete Symbole für die Kino-Screens (Farbe kommt vom Screen selbst)
  const svg = d => '<svg viewBox="0 0 64 64" aria-hidden="true">' + d + '</svg>';
  const ICON = {
    factory: svg('<path d="M6 56V30l14 8v-8l14 8v-8l14 8V12h8v44z" fill="currentColor"/><path d="M48 12h8v6h-8z" fill="#fff" opacity=".6"/><g fill="#0a0520"><rect x="13" y="44" width="7" height="7"/><rect x="26" y="44" width="7" height="7"/><rect x="39" y="44" width="7" height="7"/></g>'),
    gear: svg('<g fill="currentColor"><circle cx="32" cy="32" r="18"/>' + [0, 45, 90, 135, 180, 225, 270, 315].map(a => '<rect x="27" y="4" width="10" height="14" rx="2" transform="rotate(' + a + ' 32 32)"/>').join('') + '</g><circle cx="32" cy="32" r="8" fill="#0a0520"/><path d="M19 26a14 14 0 0 1 9-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".7"/>'),
    truck: svg('<rect x="3" y="16" width="35" height="28" rx="3" fill="currentColor"/><path d="M38 25h12l11 11v8H38z" fill="currentColor"/><path d="M42 29h7l7 7H42z" fill="#0a0520"/><path d="M8 22h24" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/><g fill="#0a0520"><circle cx="16" cy="47" r="8"/><circle cx="48" cy="47" r="8"/></g><g fill="#fff"><circle cx="16" cy="47" r="3"/><circle cx="48" cy="47" r="3"/></g>'),
    diamond: svg('<path d="M32 59L3 24 15 7h34l12 17z" fill="currentColor"/><path d="M3 24h58M15 7l9 17 8-17 8 17 9-17M24 24l8 35 8-35" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" opacity=".8"/>'),
    cap: svg('<path d="M14 34v13c0 5 8 9 18 9s18-4 18-9V34L32 44z" fill="currentColor" opacity=".75"/><path d="M32 9L2 25l30 16 30-16z" fill="currentColor"/><path d="M12 24l20-10" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/><path d="M57 28v18" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="57" cy="50" r="4.500" fill="#fff"/>'),
    wrench: svg('<path d="M45 5a15 15 0 0 0-14 20L7 49a6 6 0 0 0 8 8l24-24a15 15 0 0 0 20-14l-9 9-9-2-2-9 9-9a15 15 0 0 0-3-1z" fill="currentColor"/><circle cx="12" cy="52" r="2.800" fill="#0a0520"/><path d="M33 31L14 50" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/>'),
    trophy: svg('<path d="M18 10H7v4a11 11 0 0 0 12 11M46 10h11v4a11 11 0 0 1-12 11" fill="none" stroke="currentColor" stroke-width="4.500"/><path d="M17 5h30v15a15 15 0 0 1-30 0z" fill="currentColor"/><rect x="28" y="34" width="8" height="12" fill="currentColor"/><rect x="15" y="46" width="34" height="11" rx="3" fill="currentColor"/><path d="M25 11v10" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>'),
    bell: svg('<path d="M32 5a4 4 0 0 0-4 4v2C20 13 15 20 15 29v12l-7 8v4h48v-4l-7-8V29c0-9-5-16-13-18V9a4 4 0 0 0-4-4z" fill="currentColor"/><circle cx="32" cy="57" r="5" fill="currentColor"/><path d="M23 26a10 10 0 0 1 6-8" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round" opacity=".8"/>'),
    finger: svg('<path d="M22 58c-8-6-12-14-12-22V26a4 4 0 0 1 8 0v8V12a4 4 0 0 1 8 0v16V8a4 4 0 0 1 8 0v20V12a4 4 0 0 1 8 0v22l4-8a4 4 0 0 1 7 4l-7 18c-3 6-8 10-14 10z" fill="currentColor"/>'),
    prakt: svg('<path d="M24 18v-4a8 8 0 0 1 16 0v4" fill="none" stroke="currentColor" stroke-width="5"/><rect x="13" y="17" width="38" height="42" rx="11" fill="currentColor"/><rect x="21" y="36" width="22" height="15" rx="4" fill="#0a0520"/><path d="M21 43h22" stroke="currentColor" stroke-width="3"/><path d="M20 24h10" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>'),
    bank: svg('<rect x="5" y="18" width="54" height="10" rx="2" fill="currentColor"/><path d="M12 28v29M52 28v29" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><rect x="21" y="38" width="22" height="7" rx="2" fill="currentColor" opacity=".7"/><path d="M26 45v12M38 45v12" stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity=".7"/>'),
    kantine: svg('<path d="M32 30c-8-15-25-10-23 4 2 13 17 16 23 4 6 12 21 9 23-4 2-14-15-19-23-4zM13 52l19-14 19 14" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>'),
    plan: svg('<path d="M20 5v10M44 5v10" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><rect x="7" y="11" width="50" height="47" rx="6" fill="currentColor"/><rect x="7" y="11" width="50" height="12" rx="6" fill="#fff" opacity=".5"/><g fill="#0a0520"><rect x="15" y="30" width="8" height="8"/><rect x="28" y="30" width="8" height="8"/><rect x="41" y="30" width="8" height="8"/><rect x="15" y="43" width="8" height="8"/><rect x="28" y="43" width="8" height="8"/></g>'),
    tetris: svg('<g fill="currentColor"><rect x="22" y="3" width="20" height="13" rx="2"/><rect x="11" y="18" width="20" height="13" rx="2"/><rect x="33" y="18" width="20" height="13" rx="2" opacity=".7"/><rect x="22" y="33" width="20" height="13" rx="2" opacity=".7"/><rect x="5" y="48" width="26" height="13" rx="2"/><rect x="33" y="48" width="26" height="13" rx="2"/></g>'),
    dir: svg('<path d="M32 5l26 15v7H6v-7z" fill="currentColor"/><rect x="9" y="29" width="46" height="29" fill="currentColor" opacity=".8"/><rect x="27" y="41" width="10" height="17" fill="#0a0520"/><g fill="#0a0520"><rect x="14" y="35" width="8" height="9"/><rect x="42" y="35" width="8" height="9"/></g><circle cx="32" cy="18" r="3.500" fill="#0a0520"/>'),
    automat: svg('<rect x="7" y="42" width="50" height="17" rx="5" fill="currentColor"/><path d="M32 42V20" stroke="currentColor" stroke-width="6"/><circle cx="32" cy="14" r="11" fill="currentColor"/><circle cx="28" cy="10" r="3.500" fill="#fff" opacity=".7"/><circle cx="46" cy="50" r="3.500" fill="#0a0520"/>'),
    gold: svg('<path d="M19 3h11l2 17-9 4zM45 3H34l-2 17 9 4z" fill="currentColor" opacity=".7"/><circle cx="32" cy="41" r="19" fill="currentColor"/><path d="M27 35l5-4v19" fill="none" stroke="#0a0520" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>'),
    click: svg('<path d="M27 24v34" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><rect x="8" y="6" width="38" height="20" rx="4" fill="currentColor"/><rect x="46" y="10" width="11" height="12" rx="2" fill="currentColor" opacity=".7"/><path d="M14 12h18" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>'),
    cheap: svg('<path d="M5 31V7h24l30 30-24 24z" fill="currentColor"/><circle cx="18" cy="20" r="5.500" fill="#0a0520"/><path d="M30 44l14-14" stroke="#0a0520" stroke-width="4.500" stroke-linecap="round"/>'),
    night: svg('<path d="M40 5a27 27 0 1 0 19 45A23 23 0 0 1 40 5z" fill="currentColor"/><path d="M12 10l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff" opacity=".8"/>'),
    restart: svg('<path d="M49 20A21 21 0 1 0 53 35" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><path d="M38 6l18 4-6 18z" fill="currentColor"/>'),
  };

  ICON.start = ICON.prakt;

  const UPS = [
    { id: 'finger',  ico: '✋', name: 'Kreide-Finger',        desc: '+1 Block pro Klick',            base: 15 },
    { id: 'prakt',   ico: '🎒', name: 'Praktikant',           desc: 'Presst 0,2 Blöcke pro Sekunde', base: 30,    bps: 0.2 },
    { id: 'bank',    ico: '🪑', name: 'Schulbank-Presse',     desc: '1 Block pro Sekunde',           base: 150,   bps: 1 },
    { id: 'kantine', ico: '🥨', name: 'Kantinen-Bäckerei',    desc: '6 Blöcke pro Sekunde',          base: 1100,  bps: 6 },
    { id: 'plan',    ico: '📅', name: 'Stundenplan-Fabrik',   desc: '35 Blöcke pro Sekunde',         base: 12000, bps: 35 },
    { id: 'tetris',  ico: '🧱', name: 'Fallblock-Turm',       desc: '200 Blöcke pro Sekunde',        base: 130000, bps: 200 },
    { id: 'dir',     ico: '🏫', name: 'Direktorats-Presswerk', desc: '1.400 Blöcke pro Sekunde',     base: 1.4e6, bps: 1400 },
    { id: 'automat', ico: '🕹️', name: 'Die Pensions-Presse', desc: '10.000 Blöcke pro Sekunde',     base: 2e7,   bps: 10000 },
  ];
  const GROWTH = 1.15;
  const MATURA_MIN = 1e7;  // Matura ab 10 Mio. Blöcken im Durchlauf
  const UNI_GOAL = 1e8;    // Uni-Abschluss bei 100 Mio. insgesamt: du wirst Hausmeister Jürgen
  const END_GOAL = 5e8;    // 500 Mio. insgesamt = durchgespielt
  const OFFLINE_RATE = 0.5;
  const MATURA_BONUS = 15; // % pro Zeugnispunkt

  const fresh = () => ({ blocks: 0, total: 0, life: 0, allTime: 0, pts: 0, sp: 0, up: {}, reached: {}, clicks: 0, owned: {}, last: Date.now(), start: Date.now() });
  let S = fresh();

  const $ = id => document.getElementById(id);
  // Die Anzeige läuft zehnmal pro Sekunde durch: ins Dokument geschrieben wird nur, was sich geändert hat
  const shownText = new Map();
  const put = (el, text) => { if (shownText.get(el) !== text) { shownText.set(el, text); el.textContent = text; } };
  const own = id => S.owned[id] || 0;
  const lv = id => (S.up && S.up[id]) || 0;
  const cost = u => Math.ceil(u.base * Math.pow(GROWTH, own(u.id)) * Math.max(0.5, 1 - 0.04 * lv('cheap')));

  let buffUntil = 0, buffMult = 1;
  const buffed = () => Date.now() < buffUntil;
  const mult = () => (buffed() ? buffMult : 1);
  // Geschenke (Glocke, Meilensteine) rechnen mit der Grundleistung, nicht mit dem laufenden Boost
  const giftBase = secs => Math.max(bps() * secs, clickPower() * 100) / mult();
  const earn = n => { S.blocks += n; S.total += n; S.life += n; S.allTime = (S.allTime || 0) + n; };

  // Meilensteine: ab 10 / 25 / 50 / 100 / 200 Stück verdoppelt sich die Leistung dieser Maschine
  const MILES = [10, 25, 50, 100, 200];
  const milestoneMult = u => Math.pow(2, MILES.filter(m => own(u.id) >= m).length);
  const nextMile = u => MILES.find(m => own(u.id) < m);
  // Matura: jeder Zeugnispunkt = +15 % auf alles, dauerhaft
  const maturaMult = () => 1 + MATURA_BONUS / 100 * (S.pts || 0);
  const maturaGain = () => S.total >= MATURA_MIN ? Math.floor(Math.sqrt(S.total / 1e6)) : 0;

  // Dauerhafte Boni: Matura-Punkte, Gold-Presse (Spezialpunkte), +10 % je erreichtem Meilenstein
  const msCount = () => Object.keys(S.reached || {}).length;
  const bonusMult = () => maturaMult() * (1 + 0.5 * lv('gold')) * (1 + 0.1 * msCount());
  const clickPower = () => (1 + own('finger') * milestoneMult(UPS[0])) * Math.pow(1.5, lv('click')) * bonusMult() * mult();
  const bps = () => UPS.reduce((a, u) => a + (u.bps || 0) * own(u.id) * milestoneMult(u), 0) * bonusMult() * mult();

  const SUF = ['', 'Tsd', 'Mio', 'Mrd', 'Bio', 'Brd', 'Trl'];
  function fmt(n) {
    if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1).replace('.', ',') : Math.floor(n).toLocaleString('de-AT');
    const e = Math.min(Math.floor(Math.log10(n) / 3), SUF.length - 1);
    return (n / Math.pow(1000, e)).toFixed(2).replace('.', ',') + ' ' + SUF[e];
  }

  // Zwei offene Tabs: Es gilt der Tab, in dem zuletzt geklickt oder getippt wurde (S.act).
  // Der andere übernimmt dessen Stand, statt ihn mit seinem alten zu überschreiben.
  function adopt(raw) {
    S = Object.assign(fresh(), raw);
    if (!(S.life >= S.total)) S.life = S.total;
    if (!(S.allTime >= S.life)) S.allTime = S.life;
    if (!S.up || typeof S.up !== 'object') S.up = {};
    if (!S.reached || typeof S.reached !== 'object') S.reached = {};
    if (!S.owned || typeof S.owned !== 'object') S.owned = {};
    if (S.buffUntil > Date.now() && S.buffMult > 1) { buffUntil = S.buffUntil; buffMult = S.buffMult; }
  }
  // Stand eines anderen Tabs übernehmen, wenn dort zuletzt gespielt wurde. true = übernommen.
  function pull() {
    try {
      const other = JSON.parse(localStorage.getItem(KEY));
      if (other && typeof other.blocks === 'number' && other.tab && other.tab !== TAB && (other.act || 0) > (S.act || 0)) {
        adopt(other);
        if (menuOpen()) { buildSpShop(); updateMenu(); }
        return true;
      }
    } catch (e) {}
    return false;
  }
  function save() {
    pull();
    S.last = Date.now(); S.tab = TAB;
    S.buffUntil = buffUntil; S.buffMult = buffMult;
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }
  const acted = () => { S.act = Date.now(); };
  document.addEventListener('pointerdown', acted, true);
  document.addEventListener('keydown', acted, true);
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      if (raw && typeof raw.blocks === 'number') {
        adopt(raw);
        const away = Math.max(0, Math.min((Date.now() - S.last) / 1000, 8 * 3600));
        const gain = bps() * away * (OFFLINE_RATE + 0.1 * lv('night')); // offline nur zur Hälfte, damit aktives Spielen lohnt
        if (gain >= 1) { earn(gain); toast('Willkommen zurück! Während du weg warst: +' + fmt(gain) + ' Blöcke'); }
      }
    } catch (e) {}
  }

  function toast(msg) {
    const b = $('buff'); put(b, msg); b.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => { if (!buffed()) b.classList.remove('show'); }, 4000);
  }

  let shopRows = [];
  function buildShop() {
    $('shop').innerHTML = UPS.map((u, i) =>
      '<button class="up" data-id="' + u.id + '" style="--mc:' + COLORS[i % COLORS.length] + '">' +
        '<span class="up-ico">' + ICON[u.id] + '</span>' +
        '<span><span class="up-name">' + u.name + '</span><br><span class="up-desc">' + u.desc + '</span><br><span class="up-mile"></span></span>' +
        '<span class="up-side"><div class="up-cost"></div><div class="up-own"></div></span>' +
      '</button>').join('');
    shopRows = UPS.map(u => {
      const el = $('shop').querySelector('[data-id="' + u.id + '"]');
      return { u, el, cost: el.querySelector('.up-cost'), own: el.querySelector('.up-own'), mile: el.querySelector('.up-mile') };
    });
    $('shop').addEventListener('click', e => {
      const btn = e.target.closest('.up'); if (!btn) return;
      const u = UPS.find(x => x.id === btn.dataset.id), c = cost(u);
      if (S.blocks < c) return;
      S.blocks -= c; S.owned[u.id] = own(u.id) + 1;
      btn.blur(); // Leertaste soll danach wieder den Block pressen, nicht nochmal kaufen
      const col = COLORS[UPS.indexOf(u) % COLORS.length];
      // Kauf: Funken aus dem Maschinen-Symbol
      const ir = btn.querySelector('.up-ico').getBoundingClientRect();
      if (FX) { FX.burst(ir.left + ir.width / 2, ir.top + ir.height / 2, { kind: 'spark', n: 26, speed: 9, color: col }); FX.pulse(col, 0.35); }
      if (MILES.includes(own(u.id))) {
        btn.classList.remove('flash'); void btn.offsetWidth; btn.classList.add('flash');
        pushReward({ ico: ICON[u.id] || u.ico, col, title: own(u.id) + '× ' + u.name + '!',
          text: 'Meilenstein in der Werkstatt: ' + u.name + ' arbeitet jetzt doppelt so schnell.',
          chips: ['×2 Leistung', 'gesamt ×' + milestoneMult(u)] });
      } else if (own(u.id) === 1 && firstTime('buy_' + u.id)) {
        pushReward({ ico: ICON[u.id] || u.ico, col, title: u.name + ' eingeweiht!',
          text: 'Neue Maschine in der Werkstatt: ' + u.desc + '.', chips: ['Neue Maschine', 'nächster Meilenstein bei ' + MILES[0] + ' Stück'] });
      }
      render(); save();
    });
  }

  let shownBelt = '', shownStats = '', shownTitle = '', shownGoal = -1;
  function render() {
    put($('count'), fmt(S.blocks));
    const rate = bps();
    put($('rate'), fmt(rate));
    // Förderband läuft umso schneller, je mehr die Maschinen pressen
    $('belt').classList.toggle('on', rate > 0);
    const beltDur = rate > 0 ? Math.max(0.25, 3 / (1 + Math.log10(1 + rate))).toFixed(2) + 's' : shownBelt;
    if (beltDur !== shownBelt) { shownBelt = beltDur; $('belt').style.setProperty('--belt', beltDur); }
    const bonus = bonusMult();
    for (const row of shopRows) {
      const u = row.u, c = cost(u), n = own(u.id), can = S.blocks >= c;
      if (row.el.disabled === can) row.el.disabled = !can;
      row.el.classList.toggle('can', can);
      put(row.cost, fmt(c));
      put(row.own, String(n));
      const m = nextMile(u), x = milestoneMult(u);
      put(row.mile, (u.bps && n ? fmt(u.bps * n * x * bonus) + '/s · ' : '') + (x > 1 ? '×' + x + ' aktiv · ' : '') + (m ? 'bei ' + m + ' Stück ×2' : 'Maximal ausgebaut'));
    }
    const mg = maturaGain();
    if ($('matura').disabled !== mg < 1) $('matura').disabled = mg < 1;
    put($('matura-txt'), mg >= 1
      ? 'Matura ablegen: +' + mg + ' Zeugnispunkt' + (mg > 1 ? 'e' : '') + ' (+' + (mg * MATURA_BONUS) + ' % dauerhaft)'
      : 'Matura ab 10 Mio. Blöcken (Werkstätten bleiben)');
    let pts = (S.pts || 0) ? 'Zeugnispunkte: ' + S.pts + ' (×' + maturaMult().toFixed(2).replace('.', ',') + ' auf alles)' : '';
    if (mg >= 1) pts += ((S.pts || 0) ? ' · ' : '') + 'Nächster Punkt bei ' + fmt(Math.pow(mg + 1, 2) * 1e6) + ' Blöcken';
    put($('pts'), pts);
    const goal = S.life >= UNI_GOAL ? END_GOAL : UNI_GOAL;
    const goalK = Math.round(Math.min(1, S.life / goal) * 1000) / 1000;
    if (goalK !== shownGoal) { shownGoal = goalK; $('goal-bar').style.transform = 'scaleX(' + goalK + ')'; }
    put($('goal-lbl'), S.life >= END_GOAL ? 'Durchgespielt: Schulleben komplett'
      : (S.life >= UNI_GOAL ? 'Hausmeister Jürgen · Weg zur Pension: ' : 'Weg zum Uni-Abschluss: ') + fmt(S.life) + ' / ' + fmt(goal));
    checkAchievements();
    if (menuOpen()) updateMenu();
    const mins = Math.floor((Date.now() - S.start) / 60000);
    const stats = 'Pro Klick: <b>' + fmt(clickPower()) + '</b> · Geklickt: ' + fmt(S.clicks) +
      '<br>Insgesamt gepresst: ' + fmt(S.life) + ' · Spielzeit: ' + mins + ' Min.';
    if (stats !== shownStats) { shownStats = stats; $('stats').innerHTML = stats; }
    const title = fmt(S.blocks) + ' Blöcke — Block Presser';
    if (title !== shownTitle) { shownTitle = title; document.title = title; }
  }

  function press(x, y) {
    const p = clickPower();
    earn(p); S.clicks++;
    const col = COLORS[Math.floor(S.total / 50) % COLORS.length];
    $('stage').style.setProperty('--blockcol', col);
    const el = document.createElement('div');
    el.className = 'pop'; el.textContent = '+' + fmt(p);
    const r = $('stage').getBoundingClientRect();
    el.style.left = (x - r.left - 14 + (Math.random() * 40 - 20)) + 'px';
    el.style.top = (y - r.top - 20) + 'px';
    $('stage').appendChild(el); setTimeout(() => el.remove(), 900);
    if (FX) {
      // Der Stempel schlägt auf: Funken an der Oberkante, Splitter fliegen weg
      const b = $('block').getBoundingClientRect(), cx = b.left + b.width / 2;
      FX.burst(cx, b.top + 8, { kind: 'spark', n: 12, speed: 12, spread: 3.4, radius: b.width / 2.4, radiusY: 2, colors: [col, '#ffffff'] });
      FX.burst(cx, b.top + b.height * 0.5, { kind: 'block', n: 3, speed: 9, lift: -5, size: 5, life: 1.3, colors: [col] });
      if (S.clicks % 10 === 0) { FX.ring(cx, b.top + b.height / 2, col, { to: 260, width: 7, dur: 0.5 }); FX.pulse(col, 0.5); FX.shake($('stage'), 5, 220); }
      if (buffed()) FX.burst(cx, b.top + 8, { kind: 'spark', n: 14, speed: 18, color: '#2ee6ff' });
    }
    render();
  }
  $('block').addEventListener('click', e => {
    const r = $('block').getBoundingClientRect();
    press(e.clientX || r.left + r.width / 2, e.clientY || r.top + r.height / 2);
    $('block').blur(); // sonst feuert gehaltenes Enter den Knopf in Tastenwiederholrate
  });
  $('block').addEventListener('keydown', e => { if (e.repeat && (e.key === 'Enter' || e.code === 'Space')) e.preventDefault(); });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && document.activeElement === document.body && !menuOpen() && !rewardOpen()) {
      e.preventDefault();
      if (e.repeat) return;
      const b = $('block'), r = b.getBoundingClientRect();
      b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 80);
      press(r.left + r.width / 2, r.top + r.height / 2);
    }
  });

  // Schulglocke: erscheint zufällig, 50 % Pausen-Boost (×7, 30 s), 50 % Sofort-Gewinn (5 Min. Produktion)
  function scheduleBell() {
    setTimeout(() => {
      const b = $('bell');
      b.style.left = (10 + Math.random() * 75) + 'vw';
      b.style.top = (18 + Math.random() * 60) + 'vh';
      b.classList.add('show');
      b.timeout = setTimeout(() => { b.classList.remove('show'); scheduleBell(); }, 12000);
    }, (45000 + Math.random() * 75000) * (1 - 0.12 * lv('bell')));
  }
  $('bell').addEventListener('click', () => {
    const b = $('bell'), br = b.getBoundingClientRect(); clearTimeout(b.timeout); b.classList.remove('show');
    grant('bp_bell');
    if (FX) {
      const x = br.left + br.width / 2, y = br.top + br.height / 2;
      FX.flash('#2ee6ff', 380); FX.streak(y, '#2ee6ff'); FX.ring(x, y, '#2ee6ff', { width: 12 }); FX.pulse('#2ee6ff', 1.2);
      FX.burst(x, y, { kind: 'spark', n: 110, speed: 20, colors: ['#2ee6ff', '#ffffff'] });
      FX.shake($('stage').closest('.wrap'), 9, 380);
    }
    if (firstTime('bell')) pushReward({ ico: ICON.bell, col: '#2ee6ff', title: 'Pausenglocke erwischt!', text: 'Die Schulglocke läutet zufällig und gibt dir Bonus. Bleib wachsam, sie kommt wieder.', chips: ['Bonus-Glocke', 'Boost ×7 oder Sofort-Gewinn'] });
    if (Math.random() < 0.5) {
      buffMult = 7; buffUntil = Date.now() + 30000;
    } else {
      const g = giftBase(300);
      earn(g); toast('Schulglocke! +' + fmt(g) + ' Blöcke');
      if (FX) FX.rain({ kind: 'block', ms: 900, per: 4, colors: COLORS, bounce: false });
    }
    render(); save(); scheduleBell();
  });

  let last = performance.now(), lastSave = performance.now(), hotTick = 0;
  function tick() {
    const now = performance.now();
    const dt = Math.min((now - last) / 1000, 3600); last = now; // Hintergrund-Tabs feuern gedrosselt
    earn(bps() * dt);
    document.body.classList.toggle('buffed', buffed());
    if (buffed()) {
      const b = $('buff');
      put(b, 'Pausenglocke! Alles ×' + buffMult + ' — noch ' + Math.ceil((buffUntil - Date.now()) / 1000) + 's');
      b.classList.add('show');
      if (FX && ++hotTick % 6 === 0 && !document.hidden) FX.pulse('#2ee6ff', 0.4);
    } else if (buffUntil) { buffUntil = 0; $('buff').classList.remove('show'); }
    if (now - lastSave > 10000) { lastSave = now; save(); }
    render();
  }

  $('matura').addEventListener('click', () => {
    const g = maturaGain(); if (g < 1) return;
    if (!confirm('Matura ablegen? Deine Werkstätten und Meilensteine bleiben, nur die Blöcke werden zurückgesetzt. Du bekommst dauerhaft +' + (g * MATURA_BONUS) + ' % auf alles.')) return;
    S.pts = (S.pts || 0) + g; S.blocks = 0; S.total = 0;
    grant('bp_matura'); render(); save();
    pushReward({ ico: ICON.cap, col: '#ffb000', tier: 'epic', title: 'Matura bestanden!', text: 'Zeugnis in der Hand. Deine Werkstätten und Meilensteine bleiben, nur die Blöcke fangen neu an.',
      chips: ['+' + g + ' Zeugnispunkt' + (g > 1 ? 'e' : ''), '+' + (g * MATURA_BONUS) + ' % dauerhaft'] });
  });

  // ── Erfolge (gleiches System wie auf der Erfolge-Seite) ──
  const ACH = {
    bp_first:   { name: 'Erster Druck',    desc: 'Presse deinen ersten Block',        icon: '🧱' },
    bp_1k:      { name: 'Kleinbetrieb',    desc: 'Presse insgesamt 1.000 Blöcke',     icon: '🏭' },
    bp_1m:      { name: 'Block-Millionär', desc: 'Presse insgesamt 1 Million Blöcke', icon: '💎' },
    bp_bell:    { name: 'Pausenglocke',    desc: 'Erwische eine Schulglocke',         icon: '🔔' },
    bp_automat: { name: 'Pensionsreif',    desc: 'Kaufe „Die Pensions-Presse"',       icon: '🕹️' },
    bp_matura:  { name: 'Bestanden!',      desc: 'Lege die Matura ab (ab 10 Mio. Blöcken)', icon: '🎓' },
    bp_uni:     { name: 'Hausmeister Jürgen', desc: 'Schließe die Uni ab (100 Mio. Blöcke) und werde Hausmeister', icon: '🔧' },
    bp_end:     { name: 'Schulleben komplett', desc: 'Presse 500 Mio. Blöcke — durchgespielt', icon: '🏆' },
  };
  // Die Prüfung läuft zehnmal pro Sekunde: schon gemeldete Erfolge merkt sich ein Set
  const granted = new Set();
  function grant(id) {
    const def = ACH[id]; if (!def || granted.has(id)) return;
    granted.add(id);
    if (window.Achievements) window.Achievements.unlock(id, def);
    else if (window.showAchToast) window.showAchToast(def);
  }
  // ── Meilensteine mit Kino-Screen (+10 % auf alles je Meilenstein, plus Sofort-Geschenk) ──
  const MS = [
    { id: 'm1k',   at: 1e3, ico: ICON.factory, col: '#b8ff3d', title: 'Kleinbetrieb eröffnet!',  text: '1.000 Blöcke gepresst. In der Werkstatt brummt es zum ersten Mal richtig.' },
    { id: 'm10k',  at: 1e4, ico: ICON.gear, col: '#2ee6ff', title: 'Serienproduktion läuft!', text: '10.000 Blöcke. Das ist keine Bastelei mehr, das ist ein Betrieb.' },
    { id: 'm100k', at: 1e5, ico: ICON.truck, col: '#ff8a2e', title: 'Die Lieferwagen rollen!', text: '100.000 Blöcke. Die ganze Schule wird jetzt von dir beliefert.', extra: 'Menü (Esc) freigeschaltet' },
    { id: 'm1m',   at: 1e6, ico: ICON.diamond, col: '#a78bfa', title: 'Block-Millionär!',        text: 'Eine Million Blöcke. Selbst der Direktor schaut neidisch.' },
    { id: 'm10m',  at: 1e7, ico: ICON.cap, col: '#ffb000', title: 'Matura-Reife!',           text: '10 Millionen Blöcke. Die Matura ist freigeschaltet — und deine Werkstätten darfst du dabei behalten!', extra: 'Matura freigeschaltet' },
    { id: 'm100m', at: 1e8, ico: ICON.wrench, col: '#ff3d9a', title: 'Du bist jetzt Hausmeister Jürgen!', text: '100 Millionen Blöcke, Uni-Abschluss in der Tasche … und der Schulwart geht in Pension. Du übernimmst seinen Schlüsselbund. Jetzt gehört die ganze Schule dir.', extra: 'Schlüsselbund erhalten' },
    { id: 'm500m', at: 5e8, ico: ICON.trophy, col: '#ffd60a', title: 'Schulleben komplett!',    text: '500 Millionen Blöcke — von der Schulbank bis zum Hausmeister. Jetzt gibt Jürgen den Schlüsselbund ab und geht in Pension.', extra: 'Durchgespielt', cta: 'In Pension gehen', pension: true },
  ];
  const rewardOpen = () => !!(FX && FX.cinemaOpen());

  // Jeder Fortschritt bekommt einen Kino-Screen; laufen mehrere gleichzeitig ein, kommen sie nacheinander
  function pushReward(r) {
    if (!FX) return Promise.resolve();
    if (menuOpen() && r.tier === 'epic') closeMenu();
    const drawn = String(r.ico).charAt(0) === '<'; // gezeichnetes Symbol oder Maschinen-Emoji aus der Werkstatt
    return FX.cinema({ icon: drawn ? '' : r.ico, iconHtml: drawn ? r.ico : '', color: r.col, title: r.title, text: r.text, chips: r.chips, tier: r.tier, cta: r.cta || 'Weiterspielen', count: r.count, particles: r.particles })
      .then(() => { if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur(); });
  }
  const firstTime = key => { S.firsts = S.firsts || {}; if (S.firsts[key]) return false; S.firsts[key] = true; return true; };

  // ── Abspann: Jürgen geht in Pension ──
  function rollCredits() {
    if (!FX) return;
    const A = window.Auth, name = (A && A.user && A.profile && A.profile.username) || 'Du';
    const mins = Math.floor((Date.now() - S.start) / 60000);
    const cast = UPS.filter(u => own(u.id) > 0).map(u => [own(u.id) + ' × ' + u.name, u.desc]);
    S.firsts = S.firsts || {}; S.firsts.pension = true; save();
    closeMenu();
    FX.credits({
      color: '#ffd60a',
      sections: [
        { logo: 'Block Presser', tag: 'Ein Schulleben in 500 Millionen Blöcken' },
        { head: 'In der Hauptrolle', big: name, small: 'als Hausmeister Jürgen, ab heute in Pension' },
        { head: 'Der Werdegang', rows: [
          ['Schulbank', 'Der erste Block', 'von Hand gepresst'],
          ['Matura', (S.pts || 0) + ' Zeugnispunkt' + ((S.pts || 0) === 1 ? '' : 'e'), 'Werkstätten durften bleiben'],
          ['Uni', 'Abschluss bei 100 Mio.', 'und der Schulwart ging'],
          ['Schulhaus', 'Hausmeister Jürgen', 'mit Schlüsselbund'],
          ['Heute', 'Pension', 'verdient'],
        ] },
        { head: 'Die Belegschaft', rows: cast.length ? cast : [['Niemand', 'Du hast alles allein gepresst']] },
        { head: 'In Zahlen', stats: [
          [fmt(S.allTime || S.life), 'Blöcke insgesamt'], [fmt(S.clicks), 'Klicks von Hand'], [mins + ' Min.', 'Spielzeit'],
          [String(S.sp || 0) + ' ★', 'Spezialpunkte'], [String(msCount()), 'Meilensteine'],
        ] },
        { head: 'Besondere Auftritte', rows: [
          ['Die Schulglocke', 'als sie selbst'],
          ['Der Direktor', 'schaut neidisch'],
          ['Die Lieferwagen', 'rollen immer noch'],
        ] },
        { head: 'Gepresst in', big: 'Klasse 5DK', small: 'Baujahr 2026' },
        { note: 'Bei der Produktion kam kein Praktikant zu Schaden. Die Kantinen-Bäckerei hat durchgehend geöffnet.' },
      ],
      end: { title: 'Ende', text: 'Genieß die Pension, Jürgen. Die Presse läuft weiter, und die Bestenliste zählt mit.', cta: 'Weiterpressen' },
    }).then(() => { if (document.activeElement) document.activeElement.blur(); });
  }

  function checkMilestones() {
    const fresh = MS.filter(m => S.life >= m.at && !S.reached[m.id]);
    if (!fresh.length) return;
    fresh.forEach(m => { S.reached[m.id] = true; });
    // Nach dem Laden eines alten Spielstands nicht alle Screens hintereinander zeigen
    const show = fresh.length > 2 ? fresh.slice(-1) : fresh;
    show.forEach(m => {
      const gift = giftBase(600);
      earn(gift);
      pushReward({ ico: m.ico, col: m.col, tier: 'epic', title: m.title, text: m.text, cta: m.cta, particles: 'block',
        count: { from: 0, to: gift, fmt: v => '+' + fmt(v) + ' Blöcke', ms: 1500 },
        chips: (m.extra ? [m.extra] : []).concat(['+10 % auf alles', 'Sofort-Geschenk']) })
        .then(() => { if (m.pension) rollCredits(); });
    });
    save();
  }
  function checkAchievements() {
    if (S.clicks >= 1) grant('bp_first');
    if (S.life >= 1e3) grant('bp_1k');
    if (S.life >= 1e6) grant('bp_1m');
    if (own('automat') >= 1) grant('bp_automat');
    if (S.life >= UNI_GOAL) grant('bp_uni');
    if (S.life >= END_GOAL) grant('bp_end');
    checkMilestones();
  }

  // ── Menü (Esc): Spezialpunkte-Shop + kompletter Reset ──
  const SPU = [
    { id: 'gold',  ico: '🥇', name: 'Goldene Presse', desc: '+50 % auf alles',                        max: 10, cost: l => 2 + l * 2 },
    { id: 'click', ico: '🔨', name: 'Hammer-Finger',  desc: 'Klickkraft ×1,5',                        max: 8,  cost: l => 2 + l * 2 },
    { id: 'cheap', ico: '🏷️', name: 'Mengenrabatt',   desc: 'Werkstätten 4 % billiger (max. 50 %)',   max: 10, cost: l => 1 + l * 2 },
    { id: 'start', ico: '🎒', name: 'Starthilfe',     desc: 'Nach einem Reset 5 Praktikanten gratis', max: 10, cost: l => 2 + l },
    { id: 'night', ico: '🌙', name: 'Nachtschicht',   desc: '+10 % Ertrag, während du weg bist',      max: 5,  cost: l => 2 + l * 2 },
    { id: 'bell',  ico: '🔔', name: 'Glocken-Magnet', desc: 'Schulglocke erscheint 12 % öfter',       max: 5,  cost: l => 3 + l * 2 },
  ];
  const spGain = () => Math.floor(Math.sqrt(S.life / 1e5));
  const menuOpen = () => $('menu').classList.contains('show');

  function buildSpShop() {
    $('sp-shop').innerHTML = SPU.map(u => {
      const l = lv(u.id), maxed = l >= u.max, c = u.cost(l), ok = !maxed && S.sp >= c;
      return '<button class="up spu' + (ok ? ' can' : '') + '" data-id="' + u.id + '"' + (ok ? '' : ' disabled') + '>' +
        '<span class="up-ico" style="--mc:#ffd60a">' + ICON[u.id] + '</span>' +
        '<span><span class="up-name">' + u.name + '</span><br><span class="up-desc">' + u.desc + '</span></span>' +
        '<span class="up-side"><div class="up-cost">' + (maxed ? 'MAX' : c) + '</div><div class="up-own">' + l + '/' + u.max + '</div></span></button>';
    }).join('');
  }
  let shownReset = '';
  function updateMenu() {
    put($('sp'), String(S.sp || 0));
    const g = spGain();
    if ($('prestige').disabled !== g < 1) $('prestige').disabled = g < 1;
    put($('prestige'), g >= 1 ? 'Alles auf 0 setzen · +' + g + ' ★' : 'Ab 100.000 Blöcken im Durchlauf');
    const info = 'Setzt <b>Blöcke, Werkstätten und Meilensteine</b> auf 0. Spezialpunkte gibt es für diesen Durchlauf (' + fmt(S.life) + '). Zeugnispunkte und Upgrades bleiben.';
    if (info !== shownReset) { shownReset = info; $('reset-info').innerHTML = info; }
    $('credits').hidden = !((S.firsts && S.firsts.pension) || S.allTime >= END_GOAL);
  }
  function openMenu() { if (rewardOpen()) return; if (document.activeElement) document.activeElement.blur(); buildSpShop(); updateMenu(); $('menu').classList.add('show'); }
  function closeMenu() { $('menu').classList.remove('show'); if (document.activeElement) document.activeElement.blur(); }

  $('sp-shop').addEventListener('click', e => {
    const btn = e.target.closest('.spu'); if (!btn || btn.disabled) return;
    const u = SPU.find(x => x.id === btn.dataset.id), c = u.cost(lv(u.id));
    if (S.sp < c || lv(u.id) >= u.max) return;
    S.sp -= c; S.up[u.id] = lv(u.id) + 1;
    const ir = btn.getBoundingClientRect();
    if (FX) FX.burst(ir.left + 28, ir.top + ir.height / 2, { kind: 'spark', n: 30, speed: 10, color: '#ffd60a' });
    buildSpShop(); updateMenu(); render(); save();
    const maxed = lv(u.id) >= u.max;
    if (maxed || firstTime('sp_' + u.id)) pushReward({ ico: ICON[u.id] || u.ico, col: '#ffd60a', tier: maxed ? 'epic' : '', title: maxed ? u.name + ' voll ausgebaut!' : u.name + ' freigeschaltet!',
      text: u.desc + '.', chips: [maxed ? '★ Maximale Stufe' : '★ Stufe ' + lv(u.id) + ' von ' + u.max, 'bleibt für immer'] });
  });
  $('prestige').addEventListener('click', () => {
    const g = spGain(); if (g < 1) return;
    if (!confirm('Wirklich alles auf 0 setzen (Blöcke, Werkstätten, Meilensteine)? Du bekommst ' + g + ' Spezialpunkt' + (g > 1 ? 'e' : '') + '.')) return;
    const before = S.sp || 0;
    S.sp = before + g;
    S.blocks = 0; S.total = 0; S.life = 0; S.owned = {}; S.reached = {};
    if (lv('start')) S.owned.prakt = 5 * lv('start');
    buildSpShop(); updateMenu(); render(); save();
    pushReward({ ico: ICON.restart, col: '#a78bfa', tier: 'epic', title: 'Alles auf Anfang!', text: 'Blöcke, Werkstätten und Meilensteine sind zurückgesetzt. Dafür gibt es Spezialpunkte für richtig starke Upgrades.',
      count: { from: before, to: S.sp, fmt: v => '★ ' + Math.round(v), ms: 1200 },
      chips: ['★ +' + g + ' Spezialpunkt' + (g > 1 ? 'e' : '')] }).then(() => { if (!menuOpen()) openMenu(); });
  });
  $('reset').addEventListener('click', openMenu);
  $('menu-x').addEventListener('click', closeMenu);
  $('menu').addEventListener('click', e => { if (e.target === $('menu')) closeMenu(); });
  $('save2').addEventListener('click', () => { save(); toast('Gespeichert ✔'); });
  $('credits').addEventListener('click', rollCredits);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || rewardOpen()) return; // den Kino-Screen schließt fx.js selbst
    if (menuOpen()) closeMenu(); else openMenu();
  });
  $('save').addEventListener('click', () => { save(); toast('Gespeichert ✔'); });

  window.addEventListener('beforeunload', save);
  window.addEventListener('storage', e => { if (e.key === KEY && pull()) render(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });


  // ── Konto-Highscore: Wert = insgesamt gepresste Blöcke ──
  let synced = 0, syncedFor = null;
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  async function syncScore() {
    const A = window.Auth, score = Math.floor(S.allTime || S.life);
    if (!A || !A.user || !A.profile) return;
    if (syncedFor !== A.user.id) { syncedFor = A.user.id; synced = 0; }
    if (score <= synced || score < 1 || !Number.isSafeInteger(score)) return;
    const { error } = await A.saveBestScore({ game: 'blockpresser', mode: 'total', score });
    if (error) console.warn('[Block Presser] saveBestScore:', error.message); else synced = score;
  }
  async function loadBoard() {
    const A = window.Auth, ol = $('board');
    if (!A || !A.getLeaderboard) { ol.innerHTML = '<li class="board-empty">Bestenliste nicht verfügbar.</li>'; return; }
    const rows = await A.getLeaderboard('blockpresser', 'total', 10);
    if (!rows.length) { ol.innerHTML = '<li class="board-empty">Noch niemand drin — sei der Erste!</li>'; }
    else ol.innerHTML = rows.map((r, i) =>
      '<li' + (A.user && r.user_id === A.user.id ? ' class="me"' : '') + '><span class="rk">' + (i + 1) + '.</span><span>' +
      esc(r.username) + '</span><span class="sc">' + fmt(r.best_score) + '</span></li>').join('');
    $('board-note').textContent = A.user ? 'Gewertet: insgesamt gepresste Blöcke.' : 'Melde dich an, um in die Bestenliste zu kommen.';
  }
  setInterval(() => { syncScore(); }, 60000);
  setInterval(loadBoard, 120000);
  if (window.Auth && window.Auth.onChange) window.Auth.onChange(() => { granted.clear(); loadBoard(); syncScore(); });
  else loadBoard();
  document.addEventListener('visibilitychange', () => { if (document.hidden) syncScore(); });

  $('bell').innerHTML = ICON.bell;
  buildShop(); load(); render(); scheduleBell(); setInterval(tick, 100);
})();
</script>
</body>
</html>
