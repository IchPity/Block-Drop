<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Space Blaster im Alkomat: schieß die schlechten Noten ab, bevor sie im Zeugnis landen.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Space Blaster — Alkomat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Kanit:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&family=Share+Tech+Mono&family=Tilt+Neon&display=swap" rel="stylesheet">
<script src="/mode.js"></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/games/mini.css">
<style>
  :root { --accent: #7b4dff; }
  .mg { max-width: 800px; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <a href="../../" class="nav-back">&larr; Arcade</a>
    <div class="nav-game-title"><span class="pill">SB</span> Space Blaster</div>
  </div>
  <div class="nav-right"><div data-auth-slot></div></div>
</nav>

<main class="mg">
  <section class="mg-cab" aria-label="Space Blaster">
    <div class="mg-bar"><div class="mg-meter"><span>Punkte</span><b id="mScore">0</b></div><div class="mg-meter plain"><span>Welle</span><b id="mWave">1</b></div><div class="mg-meter plain"><span>Leben</span><b id="mLives">3</b></div><div class="mg-meter"><span>Bestwert</span><b id="mBest">–</b></div></div>
    <div class="mg-screen">
      <canvas id="cv" aria-label="Spielfeld"></canvas>
      <div class="mg-over" id="mgOver" hidden></div>
    </div>
    <p class="mg-hint">Am Handy: Finger aufs Feld legen, das Schiff folgt.</p>
  </section>

  <aside class="mg-side">
    <div class="panel-box"><h3>Bestenliste</h3><ol class="mg-lb" id="mgLb"></ol><p class="mg-note" id="mgLbNote" hidden style="margin-top:8px">Melde dich an, um in die Bestenliste zu kommen.</p></div>
    <div class="panel-box"><h3>Steuerung</h3><div class="mg-keys"><kbd>← →</kbd><span>Schiff</span><kbd>A D</kbd><span>Schiff</span><kbd>Maus</kbd><span>Schiff folgt</span><kbd>P</kbd><span>Pause</span></div></div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/fx.js"></script>
<script src="/auth.js"></script>
<script src="/games/mini.js"></script>
<script>
(() => {
  'use strict';
  const W = 480, H = 560, COLS = 7, FW = 38, FH = 30, GAP = 14;
  const cv = document.getElementById('cv');
  const M = Mini.init({ game: 'spaceblaster', accent: '#7b4dff' });
  const ctx = M.fit(cv, W, H);
  // Die Gegner sind Noten: je schlechter, desto mehr Punkte
  const GRADE = [['5', 30, 'd'], ['4', 20, 'c'], ['3', 10, 'a']];
  let x, shots, foes, drops, dir, speed, score, lives, wave, cool, hurt, alive = false, paused = false, last = 0, target = null, t = 0;
  const held = { l: false, r: false };
  const stars = Array.from({ length: 46 }, () => [Math.random() * W, Math.random() * H, 0.3 + Math.random() * 1.2]);

  function spawn() {
    const rows = Math.min(2 + Math.floor((wave + 1) / 2), 5), left = (W - (COLS * FW + (COLS - 1) * GAP)) / 2;
    foes = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) foes.push({ x: left + c * (FW + GAP), y: 56 + r * (FH + 12), g: GRADE[Math.min(2, Math.floor(r * 3 / rows))] });
    dir = 1; speed = 26 + wave * 7; drops = []; shots = [];
  }
  function reset() { x = W / 2; score = 0; lives = 3; wave = 1; cool = 0; hurt = 0; spawn(); meters(); }
  function meters() { M.meter('mScore', score.toLocaleString('de-AT')); M.meter('mWave', wave); M.meter('mLives', lives); }
  function start() { reset(); alive = true; paused = false; last = performance.now(); }
  async function over() {
    alive = false; M.shake(); M.flash(M.pal().d);
    const s = score, w = wave, rec = await M.end(s, { level: w });
    M.show({ title: rec ? 'Neuer Rekord' : 'Sitzen geblieben', text: '<b>' + s.toLocaleString('de-AT') + '</b> Punkte bis Welle <b>' + w + '</b>.', cta: 'Nochmal', onGo: start });
  }
  function update(dt) {
    const P = M.pal(), v = 330;
    if (held.l || held.r) { x += (held.r ? 1 : -1) * v * dt; target = null; }
    else if (target != null) x += Math.max(-v * 1.8 * dt, Math.min(v * 1.8 * dt, target - x));
    x = Math.max(22, Math.min(W - 22, x));
    cool -= dt; hurt -= dt;
    if (cool <= 0) { shots.push({ x, y: H - 54 }); cool = 0.3; } // Dauerfeuer
    shots.forEach(s => { s.y -= 520 * dt; }); shots = shots.filter(s => s.y > -10);
    // Der Block wandert seitwärts und rückt am Rand eine Zeile nach unten
    let edge = false; const sp = speed * (1 + (1 - foes.length / (COLS * 5)) * 0.9);
    foes.forEach(f => { f.x += dir * sp * dt; if (f.x < 8 || f.x + FW > W - 8) edge = true; });
    if (edge) { dir = -dir; foes.forEach(f => { f.x += dir * sp * dt * 2; f.y += 16; }); }
    if (Math.random() < dt * (0.5 + wave * 0.18) && foes.length) { const f = foes[Math.random() * foes.length | 0]; drops.push({ x: f.x + FW / 2, y: f.y + FH }); }
    drops.forEach(d => { d.y += (150 + wave * 12) * dt; });
    for (const s of shots) for (const f of foes) {
      if (!f.dead && !s.dead && s.x > f.x && s.x < f.x + FW && s.y > f.y && s.y < f.y + FH) {
        f.dead = s.dead = true; score += f.g[1] * wave;
        M.burst(cv, f.x + FW / 2, f.y + FH / 2, { n: 9, colors: [P[f.g[2]], P.b] });
      }
    }
    shots = shots.filter(s => !s.dead); foes = foes.filter(f => !f.dead);
    drops = drops.filter(d => {
      if (d.y > H) return false;
      if (hurt <= 0 && Math.abs(d.x - x) < 18 && d.y > H - 52 && d.y < H - 22) { lives--; hurt = 1.2; M.shake(); M.flash(P.d); meters(); return false; }
      return true;
    });
    meters();
    if (lives <= 0 || foes.some(f => f.y + FH > H - 60)) return over();
    if (!foes.length) { wave++; score += 100 * (wave - 1); M.flash(P.b); spawn(); meters(); }
  }
  function draw() {
    const P = M.pal(); t += 0.016;
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = P.dim; stars.forEach(s => { s[1] = (s[1] + s[2] * 0.4) % H; ctx.globalAlpha = 0.15 + s[2] * 0.25; ctx.fillRect(s[0], s[1], s[2], s[2]); }); ctx.globalAlpha = 1;
    ctx.font = "700 17px 'Kanit', sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    foes.forEach(f => {
      const col = P[f.g[2]], bob = Math.sin(t * 3 + f.x * 0.05) * 2;
      ctx.save(); ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = P.glow ? 10 : 0; ctx.beginPath(); ctx.roundRect(f.x, f.y + bob, FW, FH, 6); ctx.fill(); ctx.restore();
      ctx.fillStyle = P.bg; ctx.fillText(f.g[0], f.x + FW / 2, f.y + bob + FH / 2 + 1);
    });
    ctx.fillStyle = P.b; shots.forEach(s => ctx.fillRect(s.x - 2, s.y - 8, 4, 12));
    ctx.fillStyle = P.d; drops.forEach(d => { ctx.beginPath(); ctx.arc(d.x, d.y, 4, 0, 7); ctx.fill(); });
    if (hurt <= 0 || Math.floor(hurt * 10) % 2) { // Schiff blinkt nach einem Treffer
      ctx.save(); ctx.fillStyle = P.text; ctx.shadowColor = P.a; ctx.shadowBlur = P.glow ? 16 : 0;
      ctx.beginPath(); ctx.moveTo(x, H - 54); ctx.lineTo(x + 18, H - 24); ctx.lineTo(x + 6, H - 30); ctx.lineTo(x - 6, H - 30); ctx.lineTo(x - 18, H - 24); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    if (paused) { ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = P.text; ctx.font = "600 22px 'Barlow', sans-serif"; ctx.fillText('Pause', W / 2, H / 2); }
  }
  function frame(now) { const dt = Math.min(0.033, (now - last) / 1000); last = now; if (alive && !paused) update(dt); draw(); requestAnimationFrame(frame); }

  const key = (e, on) => {
    if (e.target.closest('input, textarea') || (window.FX && FX.cinemaOpen && FX.cinemaOpen())) return;
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') { held.l = on; if (alive) e.preventDefault(); }
    else if (k === 'arrowright' || k === 'd') { held.r = on; if (alive) e.preventDefault(); }
    else if (on && (k === 'p' || k === 'escape') && alive) { paused = !paused; last = performance.now(); }
  };
  addEventListener('keydown', e => key(e, true)); addEventListener('keyup', e => key(e, false));
  const aim = e => { const r = cv.getBoundingClientRect(); target = (e.clientX - r.left) / r.width * W; };
  cv.addEventListener('pointermove', aim); cv.addEventListener('pointerdown', aim);
  document.addEventListener('visibilitychange', () => { if (document.hidden && alive) paused = true; });

  reset();
  M.show({ title: 'Space Blaster', text: 'Schieß die schlechten Noten ab, bevor sie im Zeugnis landen. <b>Fünfer</b> bringen am meisten. Drei Leben, das Schiff feuert von selbst.', onGo: start });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
