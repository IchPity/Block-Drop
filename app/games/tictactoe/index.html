<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Tic Tac Toe — Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #a855f7;
      --x: #fb5d77;
      --o: #22d3ee;
      --bg: #060818;
      --cell: 104px;
    }

    body {
      background: var(--bg); min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #eee; overflow-x: hidden;
      display: flex; flex-direction: column; align-items: center;
      padding: 84px 16px 40px; gap: 18px;
    }

    /* ── Background ─────────────────────────────────────── */
    .orb { position: fixed; border-radius: 50%; filter: blur(130px); pointer-events: none; z-index: 0; }
    .orb-1 { width: 700px; height: 700px; background: #a855f7; opacity: 0.05; top: -240px; left: -200px; animation: f1 26s ease-in-out infinite alternate; }
    .orb-2 { width: 580px; height: 580px; background: #22d3ee; opacity: 0.045; bottom: -200px; right: -180px; animation: f2 32s ease-in-out infinite alternate; }
    .orb-3 { width: 400px; height: 400px; background: #fb5d77; opacity: 0.035; top: 50%; left: 50%; transform: translate(-50%,-50%); animation: f3 20s ease-in-out infinite alternate; }
    @keyframes f1 { from{transform:translate(0,0)scale(1)} to{transform:translate(80px,60px)scale(1.15)} }
    @keyframes f2 { from{transform:translate(0,0)scale(1)} to{transform:translate(-70px,-80px)scale(1.18)} }
    @keyframes f3 { from{transform:translate(-50%,-50%)scale(1)} to{transform:translate(-54%,-46%)scale(1.12)} }
    .dot-grid { position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(rgba(255,255,255,0.012)1px,transparent 1px);background-size:30px 30px; }
    .vignette { position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 90% 75% at 50% 50%,transparent 35%,rgba(5,5,14,0.75)100%); }

    /* ── Navbar ─────────────────────────────────────────── */
    .navbar {
      position:fixed;top:0;left:0;right:0;z-index:100;
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 24px; background:rgba(6,8,24,0.75);
      border-bottom:1px solid rgba(255,255,255,0.05);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    }
    .nav-left { display:flex;align-items:center;gap:14px; }
    .nav-back {
      display:inline-flex;align-items:center;gap:6px;
      text-decoration:none;color:rgba(255,255,255,0.35);
      font-size:11px;font-weight:600;
      border:1px solid rgba(255,255,255,0.1);border-radius:8px;
      padding:6px 12px;transition:all 0.2s;
    }
    .nav-back:hover { color:rgba(255,255,255,0.75);border-color:rgba(255,255,255,0.2); }
    .nav-title { font-size:13px;font-weight:900;color:#fff;letter-spacing:-0.3px; }
    .nav-right { display:flex;align-items:center;gap:10px; }
    .btn-new {
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(168,85,247,0.12);border:1px solid rgba(168,85,247,0.28);border-radius:8px;
      padding:6px 14px;color:var(--accent);font-family:inherit;
      font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;
    }
    .btn-new:hover { background:rgba(168,85,247,0.2);border-color:rgba(168,85,247,0.5); }

    /* ── Layout ─────────────────────────────────────────── */
    #wrapper { position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:420px; }

    /* ── Scorebar ───────────────────────────────────────── */
    #scorebar {
      display:flex;align-items:stretch;justify-content:center;gap:8px;width:100%;
    }
    .score-box {
      flex:1;background:rgba(255,255,255,0.028);border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;padding:10px 8px;text-align:center;transition:border-color 0.25s, box-shadow 0.25s;
    }
    .score-box.active-x { border-color:rgba(251,93,119,0.5); box-shadow:0 0 22px rgba(251,93,119,0.14); }
    .score-box.active-o { border-color:rgba(34,211,238,0.5); box-shadow:0 0 22px rgba(34,211,238,0.14); }
    .score-label { font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px; }
    .score-box.x .score-label { color:var(--x); }
    .score-box.o .score-label { color:var(--o); }
    .score-box.draw .score-label { color:rgba(255,255,255,0.35); }
    .score-name { font-size:11px;font-weight:600;color:rgba(255,255,255,0.55);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .score-val { font-size:24px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1; }

    /* ── Status ─────────────────────────────────────────── */
    #status-text {
      font-size:13px;font-weight:700;color:rgba(255,255,255,0.6);
      letter-spacing:0.2px;text-align:center;min-height:18px;
    }
    #status-text b.x { color:var(--x); }
    #status-text b.o { color:var(--o); }

    /* ── Board ──────────────────────────────────────────── */
    #board-wrap {
      position:relative;border-radius:18px;padding:14px;
      background:rgba(255,255,255,0.022);
      box-shadow:0 0 0 1px rgba(255,255,255,0.07),0 0 60px rgba(168,85,247,0.08),0 32px 80px rgba(0,0,0,0.85);
    }
    #board {
      display:grid;grid-template-columns:repeat(3,var(--cell));grid-template-rows:repeat(3,var(--cell));
      gap:10px;user-select:none;
    }
    .cell {
      position:relative;border-radius:14px;
      background:rgba(255,255,255,0.035);
      border:1px solid rgba(255,255,255,0.06);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:background 0.16s, transform 0.1s, box-shadow 0.2s;
    }
    .cell:hover.empty.playable { background:rgba(168,85,247,0.1);border-color:rgba(168,85,247,0.3); }
    .cell:active.empty.playable { transform:scale(0.96); }
    .cell.win { box-shadow:0 0 0 2px currentColor, 0 0 26px currentColor; }
    .cell.win.x { color:var(--x); background:rgba(251,93,119,0.12); }
    .cell.win.o { color:var(--o); background:rgba(34,211,238,0.12); }
    body.locked .cell { cursor:default; }

    .mark { width:64%;height:64%;overflow:visible; }
    .mark line, .mark circle { fill:none; stroke-linecap:round; }
    .mark-x line { stroke:var(--x); stroke-width:11; stroke-dasharray:90; stroke-dashoffset:90; animation:draw 0.22s ease-out forwards; }
    .mark-x line:nth-child(2) { animation-delay:0.16s; }
    .mark-o circle { stroke:var(--o); stroke-width:11; stroke-dasharray:201; stroke-dashoffset:201; animation:draw 0.32s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset:0; } }

    /* ── Overlays (shared) ──────────────────────────────── */
    .overlay {
      position:absolute;inset:0;z-index:20;border-radius:18px;
      background:rgba(8,8,20,0.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:22px;
    }
    .overlay.open { display:flex; }
    .ov-logo { font-size:24px;font-weight:900;letter-spacing:-1px;color:#fff;text-align:center;line-height:1.1; }
    .ov-logo span { color:var(--accent); }
    .ov-sub { font-size:11px;color:rgba(255,255,255,0.4);text-align:center;margin-top:-8px; }

    /* Mode buttons */
    .mode-list { display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px; }
    .mode-btn {
      display:flex;align-items:center;gap:12px;width:100%;
      background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
      border-radius:14px;padding:13px 16px;cursor:pointer;font-family:inherit;
      color:#fff;text-align:left;transition:all 0.18s;
    }
    .mode-btn:hover { background:rgba(168,85,247,0.12);border-color:rgba(168,85,247,0.4);transform:translateY(-1px); }
    .mode-ico { font-size:22px;line-height:1;flex-shrink:0;width:30px;text-align:center; }
    .mode-txt { display:flex;flex-direction:column;gap:2px; }
    .mode-txt .mt { font-size:14px;font-weight:800;letter-spacing:-0.2px; }
    .mode-txt .md { font-size:10px;font-weight:500;color:rgba(255,255,255,0.4); }

    /* Online sub-screens */
    .field-group { display:flex;flex-direction:column;gap:6px;width:100%;max-width:280px; }
    .field-label { font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.28); }
    .ov-input {
      background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;padding:12px 14px;color:#fff;font-family:inherit;
      font-size:18px;font-weight:800;letter-spacing:4px;text-align:center;text-transform:uppercase;
      outline:none;transition:border-color 0.2s;width:100%;
    }
    .ov-input:focus { border-color:rgba(168,85,247,0.45);background:rgba(168,85,247,0.05); }
    .code-display {
      font-size:40px;font-weight:900;letter-spacing:10px;color:var(--accent);
      text-shadow:0 0 30px rgba(168,85,247,0.4);padding-left:10px;
    }
    .ov-btn {
      width:100%;max-width:280px;background:var(--accent);border:none;border-radius:13px;
      padding:13px;color:#fff;font-family:inherit;font-size:14px;font-weight:800;
      cursor:pointer;box-shadow:0 0 28px rgba(168,85,247,0.32);transition:all 0.2s;
    }
    .ov-btn:hover { background:#9333ea;transform:translateY(-1px);box-shadow:0 0 40px rgba(168,85,247,0.5); }
    .ov-btn.ghost { background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);box-shadow:none;color:rgba(255,255,255,0.7); }
    .ov-btn.ghost:hover { background:rgba(255,255,255,0.09);color:#fff;transform:none; }
    .ov-link { font-size:11px;color:rgba(255,255,255,0.4);cursor:pointer;text-decoration:none;font-weight:600;margin-top:2px; }
    .ov-link:hover { color:#fff; }
    .ov-msg { font-size:11px;line-height:1.5;text-align:center;min-height:16px; }
    .ov-msg.err { color:#ff97aa; }
    .ov-msg.ok { color:#7ee2a3; }
    .ov-msg.wait { color:rgba(255,255,255,0.45); }
    .spinner {
      width:26px;height:26px;border:3px solid rgba(168,85,247,0.2);
      border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Game over */
    .go-icon { font-size:56px;animation:popIn 0.5s 0.05s both cubic-bezier(0.34,1.56,0.64,1);line-height:1; }
    @keyframes popIn { from{transform:scale(0)rotate(-12deg);opacity:0} to{transform:scale(1)rotate(0);opacity:1} }
    #go-title { font-size:26px;font-weight:900;color:#fff;letter-spacing:-1px;text-align:center; }
    #go-title b.x { color:var(--x); } #go-title b.o { color:var(--o); }
    .go-sub { font-size:12px;color:rgba(255,255,255,0.4);text-align:center;margin-top:-6px; }
    .go-actions { display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px;margin-top:4px; }

    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.07);border-radius:3px; }

    /* ── Mobile ─────────────────────────────────────────── */
    @media (max-width:520px) {
      body { padding: 74px 12px 32px; gap: 14px; }
      .navbar { padding: 10px 14px; }
      .nav-back { padding: 5px 10px; font-size: 10px; }
      :root { --cell: min(26vw, 96px); }
      #board { gap: 8px; }
      #board-wrap { padding: 11px; border-radius: 16px; }
      .score-val { font-size: 21px; }
      .code-display { font-size: 34px; letter-spacing: 8px; }
      .ov-logo { font-size: 21px; }
    }
    @media (max-width:360px) {
      :root { --cell: 27vw; }
    }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="dot-grid"></div>
<div class="vignette"></div>

<nav class="navbar">
  <div class="nav-left">
    <a href="../../" class="nav-back">&#8592; Arcade</a>
    <div class="nav-title">Tic Tac Toe</div>
  </div>
  <div class="nav-right">
    <button class="btn-new" id="menu-btn">&#9776; Modus</button>
    <button class="btn-new" id="new-game-btn">&#8635; Neu</button>
    <div data-auth-slot></div>
  </div>
</nav>

<div id="wrapper">

  <!-- Scorebar -->
  <div id="scorebar">
    <div class="score-box x" id="sb-x">
      <div class="score-label">✕</div>
      <div class="score-name" id="name-x">Spieler X</div>
      <div class="score-val" id="score-x">0</div>
    </div>
    <div class="score-box draw">
      <div class="score-label">Unent.</div>
      <div class="score-name">Remis</div>
      <div class="score-val" id="score-draw">0</div>
    </div>
    <div class="score-box o" id="sb-o">
      <div class="score-label">◯</div>
      <div class="score-name" id="name-o">Spieler O</div>
      <div class="score-val" id="score-o">0</div>
    </div>
  </div>

  <div id="status-text"></div>

  <!-- Board -->
  <div id="board-wrap">
    <div id="board"></div>

    <!-- Mode selection -->
    <div class="overlay" id="mode-overlay">
      <div class="ov-logo">TIC TAC TOE<span>.</span></div>
      <div class="ov-sub">Wähle deinen Spielmodus</div>
      <div class="mode-list">
        <button class="mode-btn" data-mode="local">
          <span class="mode-ico">👥</span>
          <span class="mode-txt"><span class="mt">Lokal zu zweit</span><span class="md">Beide am selben Gerät</span></span>
        </button>
        <button class="mode-btn" data-mode="online">
          <span class="mode-ico">🌐</span>
          <span class="mode-txt"><span class="mt">Online Multiplayer</span><span class="md">Mit Raum-Code gegen Freunde</span></span>
        </button>
        <button class="mode-btn" data-mode="ai-easy">
          <span class="mode-ico">🤖</span>
          <span class="mode-txt"><span class="mt">KI — Leicht</span><span class="md">Entspannter Gegner zum Üben</span></span>
        </button>
        <button class="mode-btn" data-mode="ai-hard">
          <span class="mode-ico">🧠</span>
          <span class="mode-txt"><span class="mt">KI — Schwer</span><span class="md">Unbesiegbar — schaffst du ein Remis?</span></span>
        </button>
      </div>
    </div>

    <!-- Online setup -->
    <div class="overlay" id="online-overlay">
      <!-- choose create / join -->
      <div id="online-choose" style="display:flex;flex-direction:column;align-items:center;gap:14px;width:100%">
        <div class="ov-logo">Online<span>.</span></div>
        <div class="ov-sub">Erstelle einen Raum oder tritt einem bei</div>
        <button class="ov-btn" id="online-create-btn">Raum erstellen</button>
        <button class="ov-btn ghost" id="online-join-show">Raum beitreten</button>
        <a class="ov-link" data-back-menu>&#8592; Zurück zum Menü</a>
      </div>

      <!-- waiting as host -->
      <div id="online-host" style="display:none;flex-direction:column;align-items:center;gap:14px;width:100%">
        <div class="ov-sub" style="margin:0">Dein Raum-Code</div>
        <div class="code-display" id="host-code">----</div>
        <button class="ov-btn ghost" id="copy-code-btn" style="max-width:200px">Code kopieren</button>
        <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
          <div class="spinner"></div>
          <div class="ov-msg wait">Warte auf Gegner…</div>
        </div>
        <a class="ov-link" data-back-menu>&#8592; Abbrechen</a>
      </div>

      <!-- join input -->
      <div id="online-join" style="display:none;flex-direction:column;align-items:center;gap:14px;width:100%">
        <div class="ov-logo">Beitreten<span>.</span></div>
        <div class="field-group">
          <div class="field-label">Raum-Code</div>
          <input class="ov-input" id="join-code-input" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" />
        </div>
        <div class="ov-msg" id="join-msg"></div>
        <button class="ov-btn" id="join-connect-btn">Verbinden</button>
        <a class="ov-link" data-back-online>&#8592; Zurück</a>
      </div>
    </div>

    <!-- Game over -->
    <div class="overlay" id="gameover-overlay">
      <div class="go-icon" id="go-icon">🏆</div>
      <div id="go-title">Sieg!</div>
      <div class="go-sub" id="go-sub"></div>
      <div class="go-actions">
        <button class="ov-btn" id="go-rematch">Nochmal</button>
        <button class="ov-btn ghost" id="go-menu">Modus wechseln</button>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
<script src="game.js"></script>
</body>
</html>
