<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>SchulUhr — Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --board:  #25382d;
            --board2: #1b2a21;
            --card: rgba(255,255,255,0.035);
            --border: rgba(243,239,226,0.22);
            --purple: #cabcff;
            --blue: #93d7ff;
            --green: #a6e6a0;
            --yellow: #ffe08a;
            --red: #ff9aa6;
            --orange: #ffbd80;
            --chalk: #f3efe2;
            --text: #f3efe2;
            --muted: rgba(243,239,226,0.32);
            --muted2: rgba(243,239,226,0.62);
            --frame: #b07b42;
            --frame-dark: #6e4a24;
            --hand: 'Caveat', cursive;
            --chalk-font: 'Gaegu', 'Comic Sans MS', cursive;
        }

        body {
            font-family: var(--chalk-font);
            background: var(--board2);
            color: var(--text);
            min-height: 100vh;
            padding: 84px 0 60px;
            overflow-x: hidden;
        }

        /* ── Chalkboard surface ──────────────────────── */
        .chalkboard {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 70% 55% at 30% 25%, rgba(255,255,255,0.045), transparent 60%),
                radial-gradient(ellipse 80% 60% at 80% 80%, rgba(255,255,255,0.03), transparent 60%),
                radial-gradient(ellipse 120% 100% at 50% 40%, #2c4234 0%, var(--board) 45%, var(--board2) 100%);
        }
        /* chalk dust / faint eraser smudges */
        .chalk-dust {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5;
            background:
                radial-gradient(ellipse 240px 60px at 22% 70%, rgba(255,255,255,0.05), transparent 70%),
                radial-gradient(ellipse 300px 50px at 75% 30%, rgba(255,255,255,0.045), transparent 70%),
                radial-gradient(ellipse 180px 40px at 55% 88%, rgba(255,255,255,0.04), transparent 70%);
        }
        /* Wooden chalk-tray frame around the board */
        .board-frame {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            border: 16px solid transparent;
            border-image: linear-gradient(135deg, #c98f4f, var(--frame) 40%, var(--frame-dark) 75%, #c98f4f) 1;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35), inset 0 0 40px rgba(0,0,0,0.4);
        }
        @media (max-width: 720px) { .board-frame { border-width: 10px; } }

        /* ── Navbar (chalk tray) ─────────────────────── */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 11px 24px;
            background: linear-gradient(180deg, #c98f4f, var(--frame) 55%, var(--frame-dark));
            border-bottom: 2px solid rgba(0,0,0,0.35);
            box-shadow: 0 3px 12px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,225,180,0.3);
        }
        .nav-left { display: flex; align-items: center; gap: 14px; }
        .nav-back {
            display: inline-flex; align-items: center; gap: 6px;
            text-decoration: none; color: #fff5e6;
            font-size: 14px; font-weight: 700;
            background: rgba(0,0,0,0.16);
            border: 1px solid rgba(255,225,180,0.3); border-radius: 8px;
            padding: 4px 12px; transition: all 0.2s;
        }
        .nav-back:hover { background: rgba(0,0,0,0.28); border-color: #fff5e6; }
        .nav-game-title {
            font-family: var(--hand); font-size: 22px; font-weight: 700; color: #fff7ec; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px;
            text-shadow: 0 1px 0 var(--frame-dark);
        }
        .nav-game-title .pill {
            background: #fff5e6; color: var(--frame-dark); padding: 1px 8px;
            border-radius: 4px; font-family: var(--chalk-font); font-size: 12px; font-weight: 700; letter-spacing: 1px;
        }
        .nav-right { display: flex; align-items: center; gap: 12px; }

        /* ── Container & Hero ─────────────────────────── */
        .container { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 0 24px; }

        .hero { margin-top: 24px; margin-bottom: 20px; }
        .hero-eyebrow {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--chalk-font); font-size: 14px; font-weight: 700; letter-spacing: 3px;
            text-transform: uppercase; color: var(--yellow); margin-bottom: 8px;
        }
        .hero-eyebrow::before { content:''; width: 22px; height: 2px; background: var(--yellow); border-radius: 1px; }
        .hero h1 {
            font-family: var(--hand); font-size: 68px; font-weight: 700; letter-spacing: 0px; line-height: 0.9;
            color: var(--chalk);
            text-shadow: 0 0 1px rgba(255,255,255,0.5), 1px 1px 0 rgba(0,0,0,0.25);
        }
        .hero h1 em { font-style: normal; color: var(--yellow); }
        .hero-sub {
            margin-top: 12px; font-size: 17px; max-width: 540px;
            color: var(--muted2); line-height: 1.5;
        }

        /* ── Info row (live clock + day + popout) ───── */
        .info-row {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 16px; flex-wrap: wrap;
        }
        .info-clock {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 6px 14px;
            font-family: var(--chalk-font);
            font-size: 19px; font-weight: 700; color: var(--chalk);
            letter-spacing: 1px;
        }
        .info-day {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 6px 14px;
            font-size: 15px; font-weight: 700; color: var(--muted2);
            letter-spacing: 1px; text-transform: uppercase;
        }
        .pip-btn {
            margin-left: auto;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 6px 14px;
            color: var(--muted2);
            font-family: var(--chalk-font); font-size: 15px; font-weight: 700;
            letter-spacing: 0.5px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }
        .pip-btn:hover { color: var(--chalk); border-color: rgba(243,239,226,0.4); background: rgba(255,255,255,0.07); }
        .pip-btn.active {
            background: rgba(202,188,255,0.16); color: var(--purple);
            border-color: rgba(202,188,255,0.45);
        }
        .pip-btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

        /* ── Main Card (framed chalk panel) ──────────── */
        .main-card {
            background: var(--card); border: 1.5px solid var(--border);
            border-radius: 16px; overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.18);
            margin-bottom: 16px;
        }
        .card-top-bar { height: 4px; transition: background 0.5s ease; background: linear-gradient(90deg,var(--purple),var(--blue),var(--green)); }
        .card-top-bar.bar-class { background: linear-gradient(90deg,var(--purple),#e0d4ff); }
        .card-top-bar.bar-break { background: linear-gradient(90deg,var(--yellow),var(--orange)); }
        .card-top-bar.bar-free  { background: linear-gradient(90deg,var(--green),var(--blue)); }
        .card-top-bar.bar-soon  { background: linear-gradient(90deg,var(--red),var(--yellow)); }
        .card-top-bar.bar-lunch { background: linear-gradient(90deg,var(--orange),var(--yellow)); }
        .card-body { padding: 34px 36px 30px; text-align: center; }

        /* ── Status badge ──────────────────────────── */
        .status-badge {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 4px 16px; border-radius: 99px;
            font-size: 15px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px;
            margin-bottom: 20px;
        }
        .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .badge-dot.pulse { animation: dotPulse 1.5s ease-in-out infinite; }
        @keyframes dotPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }
        .sb-class { background: rgba(202,188,255,0.14); color: var(--purple); border: 1px solid rgba(202,188,255,0.4); }
        .sb-break { background: rgba(255,224,138,0.14); color: var(--yellow); border: 1px solid rgba(255,224,138,0.4); }
        .sb-free  { background: rgba(166,230,160,0.14); color: var(--green);  border: 1px solid rgba(166,230,160,0.4); }
        .sb-soon  { background: rgba(255,154,166,0.14); color: var(--red);    border: 1px solid rgba(255,154,166,0.4); }
        .sb-lunch { background: rgba(255,189,128,0.14); color: var(--orange); border: 1px solid rgba(255,189,128,0.4); }

        .period-name {
            font-family: var(--hand); font-size: 28px; font-weight: 700; color: var(--chalk);
            margin-bottom: 2px; min-height: 30px; letter-spacing: 0.3px;
        }
        .period-time-range {
            font-size: 16px; color: var(--muted2);
            font-family: var(--chalk-font); letter-spacing: 1px;
            margin-bottom: 22px; min-height: 18px;
        }

        .countdown {
            font-family: var(--chalk-font);
            font-size: clamp(3.6rem, 13vw, 5.4rem);
            font-weight: 700; line-height: 1;
            letter-spacing: 1px;
            transition: color 0.5s;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 1px rgba(255,255,255,0.4);
        }
        .cd-class { color: var(--purple); }
        .cd-break { color: var(--yellow); }
        .cd-free  { color: var(--green); }
        .cd-soon  { color: var(--red); }
        .cd-lunch { color: var(--orange); }

        .countdown-label {
            font-size: 15px; color: var(--muted2);
            text-transform: uppercase; letter-spacing: 2px;
            margin-top: 6px; margin-bottom: 26px;
            font-weight: 700;
        }

        .progress-section { margin: 0 0 22px; }
        .progress-meta {
            display: flex; justify-content: space-between;
            font-size: 14px; font-family: var(--chalk-font);
            color: var(--muted); margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .progress-bg { background: rgba(0,0,0,0.22); border-radius: 99px; height: 7px; overflow: hidden; border: 1px solid rgba(243,239,226,0.12); }
        .progress-fill { height: 100%; border-radius: 99px; transition: width 1s linear; }
        .pf-class { background: linear-gradient(90deg,var(--purple),#e0d4ff); box-shadow: 0 0 10px rgba(202,188,255,0.4); }
        .pf-break { background: linear-gradient(90deg,var(--yellow),var(--orange)); box-shadow: 0 0 10px rgba(255,224,138,0.4); }
        .pf-free  { background: linear-gradient(90deg,var(--green),var(--blue)); box-shadow: 0 0 10px rgba(166,230,160,0.4); }
        .pf-soon  { background: linear-gradient(90deg,var(--red),var(--yellow)); box-shadow: 0 0 10px rgba(255,154,166,0.4); }
        .pf-lunch { background: linear-gradient(90deg,var(--orange),var(--yellow)); box-shadow: 0 0 10px rgba(255,189,128,0.4); }

        .next-event {
            font-size: 16px; color: var(--muted2);
            padding-top: 16px; border-top: 1px dashed var(--border);
        }
        .next-event b { color: var(--chalk); font-weight: 700; }

        /* Free state */
        .free-big {
            font-family: var(--hand); font-size: clamp(2.6rem, 10vw, 4rem);
            font-weight: 700; color: var(--green); line-height: 1;
            letter-spacing: 0.5px; margin: 10px 0 8px;
            text-shadow: 0 0 1px rgba(255,255,255,0.4);
        }
        .free-sub { font-size: 18px; color: var(--muted2); margin-bottom: 22px; }
        .free-countdown-label {
            font-size: 14px; color: var(--muted); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 4px; font-weight: 700;
        }
        .free-countdown {
            font-family: var(--chalk-font);
            font-size: 30px; font-weight: 700; color: var(--chalk);
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        /* ── Schedule ─────────────────────────────── */
        .schedule-card {
            background: var(--card); border: 1.5px solid var(--border);
            border-radius: 16px; padding: 20px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.18);
        }
        .section-title {
            font-family: var(--hand); font-size: 22px; font-weight: 700; letter-spacing: 0.5px;
            color: var(--chalk); margin-bottom: 14px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--border) 0 6px, transparent 6px 12px); }
        .schedule-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
        .sched-item {
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(243,239,226,0.12);
            border-radius: 11px; padding: 9px 12px; font-size: 12px;
            transition: all 0.3s;
        }
        .sched-item.active {
            background: rgba(202,188,255,0.13);
            border-color: rgba(202,188,255,0.4);
            box-shadow: 0 0 14px rgba(202,188,255,0.12);
        }
        .sched-item.done { opacity: 0.34; }
        .sched-item.break-type { background: rgba(255,224,138,0.05); border-color: rgba(255,224,138,0.12); }
        .sched-item.break-type.active { background: rgba(255,224,138,0.14); border-color: rgba(255,224,138,0.4); box-shadow: 0 0 14px rgba(255,224,138,0.12); }
        .sched-item.lunch-type { background: rgba(255,189,128,0.05); border-color: rgba(255,189,128,0.12); }
        .sched-item.lunch-type.active { background: rgba(255,189,128,0.14); border-color: rgba(255,189,128,0.4); box-shadow: 0 0 14px rgba(255,189,128,0.12); }
        .si-time {
            font-family: var(--chalk-font); font-size: 14px;
            color: var(--muted); letter-spacing: 0.5px;
            margin-bottom: 1px;
        }
        .si-name { font-weight: 700; color: var(--muted2); font-size: 16px; }
        .sched-item.active .si-name { color: var(--chalk); }

        /* ── Toast ───────────────────────────────── */
        .toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px);
            background: linear-gradient(180deg, #2c4234, #1f3026); border: 1px solid var(--border);
            border-radius: 14px; padding: 12px 22px;
            font-size: 16px; color: var(--muted2);
            box-shadow: 0 14px 36px rgba(0,0,0,0.6);
            opacity: 0; transition: opacity 0.25s, transform 0.25s;
            z-index: 8000; pointer-events: none; text-align: center; line-height: 1.5;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: all; }

        /* ── Floating widget (fallback) ──────────── */
        .float-widget {
            position: fixed; bottom: 28px; right: 28px; width: 250px;
            background: linear-gradient(180deg, #2c4234, #1c2a21);
            border-radius: 16px; border: 1.5px solid var(--border);
            box-shadow: 0 16px 48px rgba(0,0,0,0.7), inset 0 0 24px rgba(0,0,0,0.2);
            z-index: 9999; overflow: hidden;
            opacity: 0; pointer-events: none;
            transform: translateY(8px) scale(0.97);
            transition: opacity 0.22s, transform 0.22s;
        }
        .float-widget.visible { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }
        .float-widget.dragging { transition: none; box-shadow: 0 24px 64px rgba(0,0,0,0.8); cursor: grabbing !important; }
        .fw-topbar { height: 4px; transition: background 0.5s; }
        .fw-topbar.bar-class { background: linear-gradient(90deg,var(--purple),#e0d4ff); }
        .fw-topbar.bar-break { background: linear-gradient(90deg,var(--yellow),var(--orange)); }
        .fw-topbar.bar-free  { background: linear-gradient(90deg,var(--green),var(--blue)); }
        .fw-topbar.bar-soon  { background: linear-gradient(90deg,var(--red),var(--yellow)); }
        .fw-topbar.bar-lunch { background: linear-gradient(90deg,var(--orange),var(--yellow)); }
        .fw-handle { padding: 9px 12px 0; cursor: grab; display: flex; align-items: center; justify-content: space-between; }
        .fw-badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .fw-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
        .fw-close:hover { background: rgba(255,154,166,0.18); color: var(--red); }
        .fw-body { padding: 5px 14px 14px; cursor: grab; }
        .fw-name { font-size: 14px; color: var(--muted2); font-weight: 700; min-height: 16px; margin-bottom: 1px; }
        .fw-countdown {
            font-family: var(--chalk-font);
            font-size: 38px; font-weight: 700; line-height: 1;
            letter-spacing: 0px; margin-bottom: 2px;
            font-variant-numeric: tabular-nums;
        }
        .fw-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; font-weight: 700; }
        .fw-progress-bg { background: rgba(0,0,0,0.22); border-radius: 99px; height: 4px; overflow: hidden; margin-bottom: 8px; }
        .fw-progress-fill { height: 100%; border-radius: 99px; transition: width 1s linear; }
        .fw-next { font-size: 13px; color: var(--muted); }
        .fw-next b { color: var(--muted2); font-weight: 700; }

        @media (max-width: 720px) {
            body { padding: 70px 0 56px; }
            .navbar { padding: 9px 14px; }
            .nav-back { padding: 4px 10px; font-size: 13px; }
            .nav-game-title { font-size: 19px; }
            .container { padding: 0 16px; }
            .hero { margin-top: 16px; margin-bottom: 14px; }
            .hero h1 { font-size: 48px; }
            .hero-eyebrow { font-size: 13px; letter-spacing: 2px; margin-bottom: 6px; }
            .hero-sub { font-size: 15px; margin-top: 8px; }
            .card-body { padding: 26px 18px 22px; }
            .info-row { gap: 8px; }
            .info-clock { font-size: 17px; padding: 5px 12px; }
            .info-day { font-size: 14px; padding: 5px 12px; }
            .pip-btn { margin-left: 0; font-size: 14px; padding: 5px 12px; }
            .schedule-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 5px; }
            .sched-item { padding: 8px 10px; }
            .si-name { font-size: 15px; }
            .si-time { font-size: 13px; }
            .next-event { font-size: 15px; }
            .float-widget { right: 14px; bottom: 14px; width: calc(100% - 28px); max-width: 280px; }
            .toast { left: 16px; right: 16px; transform: translateY(16px); max-width: none; }
            .toast.show { transform: translateY(0); }
        }
        @media (max-width: 420px) {
            .hero h1 { font-size: 40px; }
            .countdown-label, .free-countdown-label { letter-spacing: 1.5px; }
            .schedule-grid { grid-template-columns: repeat(2, 1fr); }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(243,239,226,0.18); border-radius: 3px; }
    </style>
</head>
<body>

<div class="chalkboard"></div>
<div class="chalk-dust"></div>
<div class="board-frame"></div>

<nav class="navbar">
    <div class="nav-left">
        <a href="../../" class="nav-back">&#8592; Arcade</a>
        <div class="nav-game-title"><span class="pill">SU</span> SchulUhr</div>
    </div>
    <div class="nav-right">
        <div data-auth-slot></div>
    </div>
</nav>

<div class="container">

    <section class="hero">
        <div class="hero-eyebrow">Live Stundenplan</div>
        <h1>SCHUL<em>UHR</em></h1>
        <p class="hero-sub">Countdown bis zur nächsten Pause, Mittagspause oder zum Schulschluss — immer aktuell, mit Popout-Fenster für den zweiten Bildschirm.</p>
    </section>

    <div class="info-row">
        <div class="info-clock" id="liveClock">--:--:--</div>
        <div class="info-day" id="dayBadge">---</div>
        <button class="pip-btn" id="pipBtn" onclick="handlePipBtn()">
            <svg viewBox="0 0 16 16"><path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H8v2h2a1 1 0 0 1 0 2H6a1 1 0 0 1 0-2h2v-2H2a2 2 0 0 1-2-2V2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H2z"/></svg>
            Popout
        </button>
    </div>

    <div class="main-card">
        <div class="card-top-bar" id="topBar"></div>
        <div class="card-body" id="cardBody"></div>
    </div>

    <div class="schedule-card">
        <div class="section-title" id="scheduleTitle">Heutiger Stundenplan</div>
        <div class="schedule-grid"  id="scheduleGrid"></div>
    </div>

</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<!-- Achievement overlay -->

<!-- Floating widget (fallback when PiP not available) -->
<div class="float-widget" id="floatWidget">
    <div class="fw-topbar" id="fwTopBar"></div>
    <div class="fw-handle" id="fwHandle">
        <div id="fwBadge" class="fw-badge sb-class">
            <div class="badge-dot pulse"></div>
            <span id="fwBadgeText">—</span>
        </div>
        <button class="fw-close" onclick="closeWidget()">✕</button>
    </div>
    <div class="fw-body">
        <div id="fwName"      class="fw-name">—</div>
        <div id="fwCountdown" class="fw-countdown cd-class">--:--</div>
        <div id="fwLabel"     class="fw-label">—</div>
        <div class="fw-progress-bg"><div id="fwProgress" class="fw-progress-fill pf-class" style="width:0%"></div></div>
        <div id="fwNext"      class="fw-next"></div>
    </div>
</div>

<script>
// ─── Schedule ─────────────────────────────────────────────────
const MORNING = [
    { type:'class', name:'1. Stunde',   h1:7,  m1:50, h2:8,  m2:40 },
    { type:'break', name:'Pause',        h1:8,  m1:40, h2:8,  m2:45 },
    { type:'class', name:'2. Stunde',   h1:8,  m1:45, h2:9,  m2:35 },
    { type:'break', name:'Pause',        h1:9,  m1:35, h2:9,  m2:40 },
    { type:'class', name:'3. Stunde',   h1:9,  m1:40, h2:10, m2:30 },
    { type:'break', name:'Große Pause', h1:10, m1:30, h2:10, m2:45 },
    { type:'class', name:'4. Stunde',   h1:10, m1:45, h2:11, m2:35 },
    { type:'break', name:'Pause',        h1:11, m1:35, h2:11, m2:40 },
    { type:'class', name:'5. Stunde',   h1:11, m1:40, h2:12, m2:30 },
    { type:'break', name:'Pause',        h1:12, m1:30, h2:12, m2:35 },
    { type:'class', name:'6. Stunde',   h1:12, m1:35, h2:13, m2:25 },
];
const MON_AFTERNOON = [
    { type:'lunch', name:'Mittagspause', h1:13, m1:25, h2:14, m2:15 },
    { type:'class', name:'7. Stunde',   h1:14, m1:15, h2:15, m2:5  },
    { type:'class', name:'8. Stunde',   h1:15, m1:5,  h2:15, m2:55 },
];
const DAYS = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

function toMin(h,m)  { return h*60+m; }
function padZ(n)     { return String(n).padStart(2,'0'); }
function fmtTime(h,m){ return `${padZ(h)}:${padZ(m)}`; }

function fmtCountdown(sec) {
    const s = Math.max(0,Math.floor(sec));
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
    return h > 0 ? `${padZ(h)}:${padZ(m)}:${padZ(ss)}` : `${padZ(m)}:${padZ(ss)}`;
}

function getNextSchoolDay(now) {
    const d = new Date(now);
    d.setSeconds(0,0); d.setMinutes(50); d.setHours(7);
    d.setDate(d.getDate()+1);
    while (d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()+1);
    return d;
}

function freeCountdown(now) {
    const next = getNextSchoolDay(now);
    const diff = Math.max(0, Math.floor((next-now)/1000));
    const dh = Math.floor(diff/3600), dm = Math.floor((diff%3600)/60), ds = diff%60;
    return dh>=24 ? `${Math.floor(dh/24)}d ${padZ(dh%24)}:${padZ(dm)}:${padZ(ds)}` : `${padZ(dh)}:${padZ(dm)}:${padZ(ds)}`;
}

function getState(now) {
    const day = now.getDay();
    const curMin = toMin(now.getHours(), now.getMinutes()) + now.getSeconds()/60;
    const isWeekend = day===0||day===6, isMon=day===1, isFri=day===5, isSchool=day>=1&&day<=5;
    const schoolStart=toMin(7,50), morningEnd=toMin(13,25), monEnd=toMin(15,55);

    const isFree = isWeekend||(isFri&&curMin>=morningEnd)||(!isMon&&isSchool&&curMin>=morningEnd)||(isMon&&curMin>=monEnd);
    if (isFree) return { kind:'free', now, day, isWeekend: isWeekend||isFri };

    if (isSchool && curMin<schoolStart)
        return { kind:'before', secsLeft:(schoolStart-curMin)*60, isMon };

    if (isSchool) {
        const sched = isMon ? [...MORNING,...MON_AFTERNOON] : MORNING;
        for (let i=0;i<sched.length;i++) {
            const slot=sched[i], slotS=toMin(slot.h1,slot.m1), slotE=toMin(slot.h2,slot.m2);
            if (curMin>=slotS && curMin<slotE) {
                return {
                    kind:'active', slot, isMon,
                    secsLeft: (slotE-curMin)*60,
                    progress: Math.min(100,((curMin-slotS)/(slotE-slotS))*100),
                    next: sched[i+1]||null
                };
            }
        }
    }
    return null;
}

// ─── Main view ────────────────────────────────────────────────
function setTopBar(cls) { document.getElementById('topBar').className='card-top-bar '+cls; }

function update() {
    const now = new Date();
    const day = now.getDay();
    const h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
    const curMin = toMin(h,m)+s/60;

    document.getElementById('liveClock').textContent=`${padZ(h)}:${padZ(m)}:${padZ(s)}`;
    document.getElementById('dayBadge').textContent=DAYS[day];

    const st = getState(now);
    if (!st) return;

    if (st.kind==='free') {
        const until=freeCountdown(now), nextDay=DAYS[getNextSchoolDay(now).getDay()];
        setTopBar('bar-free');
        document.getElementById('cardBody').innerHTML=`
            <div class="status-badge sb-free"><div class="badge-dot pulse"></div>Frei</div>
            <div class="free-big">ENDLICH FREI!</div>
            <div class="free-sub">${st.isWeekend?'🎮 Genieß dein Wochenende! 🎮':'🏆 Schöner Nachmittag! 🏆'}</div>
            <div class="free-countdown-label">Schule wieder in</div>
            <div class="free-countdown">${until}</div>
            <div style="height:16px"></div>
            <div class="next-event">Nächster Schultag: <b>${nextDay}</b> um 07:50 Uhr</div>`;
        renderScheduleToday(st.day===1?[...MORNING,...MON_AFTERNOON]:MORNING, curMin);
    } else if (st.kind==='before') {
        const sched=st.isMon?[...MORNING,...MON_AFTERNOON]:MORNING;
        setTopBar('bar-soon');
        document.getElementById('cardBody').innerHTML=`
            <div class="status-badge sb-soon"><div class="badge-dot pulse"></div>Bald los</div>
            <div class="period-name">Schule beginnt gleich</div>
            <div class="period-time-range">Beginn um 07:50 Uhr</div>
            <div class="countdown cd-soon">${fmtCountdown(st.secsLeft)}</div>
            <div class="countdown-label">bis Schulbeginn</div>
            <div class="progress-section">
                <div class="progress-meta"><span></span><span>07:50</span></div>
                <div class="progress-bg"><div class="progress-fill pf-soon" style="width:0%"></div></div>
            </div>
            <div class="next-event">Nächstes: <b>1. Stunde</b> — 07:50 bis 08:40</div>`;
        renderScheduleToday(sched, curMin);
    } else if (st.kind==='active') {
        const {slot,secsLeft,progress,next}=st;
        const isBreak=slot.type==='break', isLunch=slot.type==='lunch';
        const barCls=isLunch?'bar-lunch':isBreak?'bar-break':'bar-class';
        const sbCls=isLunch?'sb-lunch':isBreak?'sb-break':'sb-class';
        const cdCls=isLunch?'cd-lunch':isBreak?'cd-break':'cd-class';
        const pfCls=isLunch?'pf-lunch':isBreak?'pf-break':'pf-class';
        const badge=isLunch?'Mittagspause':isBreak?'Pause':'Unterricht';
        const cdLabel=isBreak||isLunch?'bis Unterrichtsbeginn':'bis zur Pause';
        const nextLabel=next?`Danach: <b>${next.name}</b> — ${fmtTime(next.h1,next.m1)} bis ${fmtTime(next.h2,next.m2)}`:'Danach: <b>Endlich Frei! 🎉</b>';
        const sched=st.isMon?[...MORNING,...MON_AFTERNOON]:MORNING;
        setTopBar(barCls);
        document.getElementById('cardBody').innerHTML=`
            <div class="status-badge ${sbCls}"><div class="badge-dot pulse"></div>${badge}</div>
            <div class="period-name">${slot.name}</div>
            <div class="period-time-range">${fmtTime(slot.h1,slot.m1)} – ${fmtTime(slot.h2,slot.m2)}</div>
            <div class="countdown ${cdCls}">${fmtCountdown(secsLeft)}</div>
            <div class="countdown-label">${cdLabel}</div>
            <div class="progress-section">
                <div class="progress-meta"><span>${fmtTime(slot.h1,slot.m1)}</span><span>${fmtTime(slot.h2,slot.m2)}</span></div>
                <div class="progress-bg"><div class="progress-fill ${pfCls}" style="width:${progress.toFixed(2)}%"></div></div>
            </div>
            <div class="next-event">${nextLabel}</div>`;
        renderScheduleToday(sched, curMin);
    }

    updateWidget(st);
    updatePip(st);
}

function renderScheduleToday(sched, curMin) {
    document.getElementById('scheduleTitle').textContent='Heutiger Stundenplan';
    document.getElementById('scheduleGrid').innerHTML=sched.map(slot=>{
        const s=toMin(slot.h1,slot.m1),e=toMin(slot.h2,slot.m2);
        const ec=slot.type==='break'?' break-type':slot.type==='lunch'?' lunch-type':'';
        return `<div class="sched-item${ec}${curMin>=s&&curMin<e?' active':''}${curMin>=e?' done':''}">
            <div class="si-time">${fmtTime(slot.h1,slot.m1)}–${fmtTime(slot.h2,slot.m2)}</div>
            <div class="si-name">${slot.name}</div></div>`;
    }).join('');
}

// ─── PiP window (always on top) ───────────────────────────────
let pipWindow = null;
let pipInterval = null;

const PIP_CSS = `
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--purple:#7c6fff;--blue:#38bdf8;--green:#4ade80;--yellow:#fbbf24;--red:#f87171;--orange:#fb923c;--text:#e2e8f0;--muted:#4a5568;--muted2:#718096}
body{font-family:'Inter','Segoe UI',sans-serif;background:#08081a;color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
.topbar{height:3px;flex-shrink:0}
.bc{background:linear-gradient(90deg,var(--purple),#a78bfa)}
.bb{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.bf{background:linear-gradient(90deg,var(--green),var(--blue))}
.bs{background:linear-gradient(90deg,var(--red),var(--yellow))}
.bl{background:linear-gradient(90deg,#f97316,var(--yellow))}
.wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 16px 14px;gap:1px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:3px;width:fit-content}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:p 1.5s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.bc-b{background:rgba(124,111,255,.12);color:var(--purple);border:1px solid rgba(124,111,255,.25)}
.bb-b{background:rgba(251,191,36,.12);color:var(--yellow);border:1px solid rgba(251,191,36,.25)}
.bf-b{background:rgba(74,222,128,.12);color:var(--green);border:1px solid rgba(74,222,128,.25)}
.bs-b{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.25)}
.bl-b{background:rgba(249,115,22,.12);color:var(--orange);border:1px solid rgba(249,115,22,.25)}
.name{font-size:.68rem;color:var(--muted2);font-weight:500;min-height:14px}
.cd{font-family:'Orbitron',monospace;font-size:2.4rem;font-weight:900;line-height:1;letter-spacing:-1px;margin:1px 0}
.cd-c{color:var(--purple)}.cd-b{color:var(--yellow)}.cd-f{color:var(--green)}.cd-s{color:var(--red)}.cd-l{color:var(--orange)}
.lbl{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:7px}
.pb{background:rgba(255,255,255,.05);border-radius:100px;height:3px;overflow:hidden;margin-bottom:7px}
.pf{height:100%;border-radius:100px;transition:width 1s linear}
.pf-c{background:linear-gradient(90deg,var(--purple),#a78bfa)}
.pf-b{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.pf-f{background:linear-gradient(90deg,var(--green),var(--blue))}
.pf-s{background:linear-gradient(90deg,var(--red),var(--yellow))}
.pf-l{background:linear-gradient(90deg,#f97316,var(--yellow))}
.nxt{font-size:.63rem;color:var(--muted)}
.nxt b{color:var(--muted2);font-weight:600}
`;

const PIP_HTML = `
<div id="T" class="topbar"></div>
<div class="wrap">
    <div id="B" class="badge bc-b"><div class="dot"></div><span id="BT">—</span></div>
    <div id="N" class="name"></div>
    <div id="C" class="cd cd-c">--:--</div>
    <div id="L" class="lbl">—</div>
    <div class="pb"><div id="P" class="pf pf-c" style="width:0%"></div></div>
    <div id="X" class="nxt"></div>
</div>
`;

function renderPipDoc(doc, st) {
    const T=doc.getElementById('T'), B=doc.getElementById('B'), BT=doc.getElementById('BT');
    const N=doc.getElementById('N'), C=doc.getElementById('C'), L=doc.getElementById('L');
    const P=doc.getElementById('P'), X=doc.getElementById('X');
    if (!T) return;

    const sb=(bar,badgeCls,txt)=>{ T.className='topbar '+bar; B.className='badge '+badgeCls; BT.textContent=txt; };

    if (st.kind==='free') {
        sb('bf','bf-b','Frei');
        N.textContent=''; C.className='cd cd-f'; C.style.fontSize='1.5rem';
        C.textContent='ENDLICH FREI!'; L.textContent='Schule wieder in';
        P.className='pf pf-f'; P.style.width='100%';
        X.innerHTML=`<b>${freeCountdown(st.now)}</b>`;
    } else if (st.kind==='before') {
        sb('bs','bs-b','Bald los');
        N.textContent='Schulbeginn 07:50'; C.className='cd cd-s'; C.style.fontSize='';
        C.textContent=fmtCountdown(st.secsLeft); L.textContent='bis Schulbeginn';
        P.className='pf pf-s'; P.style.width='0%';
        X.innerHTML='Nächstes: <b>1. Stunde</b>';
    } else if (st.kind==='active') {
        const {slot,secsLeft,progress,next}=st;
        const isBreak=slot.type==='break',isLunch=slot.type==='lunch';
        const cfgs={class:{bar:'bc',b:'bc-b',lbl:'Unterricht',c:'cd-c',p:'pf-c',cl:'bis zur Pause'},
                    break:{bar:'bb',b:'bb-b',lbl:'Pause',c:'cd-b',p:'pf-b',cl:'bis Unterrichtsbeginn'},
                    lunch:{bar:'bl',b:'bl-b',lbl:'Mittagspause',c:'cd-l',p:'pf-l',cl:'bis Unterrichtsbeginn'}};
        const cfg=cfgs[slot.type]||cfgs.class;
        sb(cfg.bar,cfg.b,cfg.lbl);
        N.textContent=`${slot.name} · ${fmtTime(slot.h1,slot.m1)}–${fmtTime(slot.h2,slot.m2)}`;
        C.className='cd '+cfg.c; C.style.fontSize=''; C.textContent=fmtCountdown(secsLeft);
        L.textContent=cfg.cl; P.className='pf '+cfg.p; P.style.width=progress.toFixed(2)+'%';
        X.innerHTML=next?`Danach: <b>${next.name}</b>`:'Danach: <b>Endlich Frei! 🎉</b>';
    }
}

async function openPip() {
    pipWindow = await documentPictureInPicture.requestWindow({ width:310, height:195 });
    document.getElementById('pipBtn').classList.add('active');

    const style = pipWindow.document.createElement('style');
    style.textContent = PIP_CSS;
    pipWindow.document.head.appendChild(style);
    pipWindow.document.body.innerHTML = PIP_HTML;
    pipWindow.document.body.style.margin = '0';

    pipWindow.addEventListener('pagehide', () => {
        pipWindow = null;
        clearInterval(pipInterval);
        pipInterval = null;
        document.getElementById('pipBtn').classList.remove('active');
    });

    // Initial render
    const now = new Date();
    const st = getState(now);
    if (st) renderPipDoc(pipWindow.document, st);

    pipInterval = setInterval(() => {
        if (!pipWindow || pipWindow.closed) return;
        const st2 = getState(new Date());
        if (st2) renderPipDoc(pipWindow.document, st2);
    }, 1000);
}

function closePip() {
    if (pipWindow && !pipWindow.closed) pipWindow.close();
    pipWindow = null;
    clearInterval(pipInterval);
    pipInterval = null;
    document.getElementById('pipBtn').classList.remove('active');
}

function updatePip(st) {
    if (!pipWindow || pipWindow.closed || !st) return;
    renderPipDoc(pipWindow.document, st);
}

// ─── Floating widget (fallback) ───────────────────────────────
let widgetVisible = false;

function openWidget() {
    widgetVisible = true;
    document.getElementById('floatWidget').classList.add('visible');
    document.getElementById('pipBtn').classList.add('active');
}
function closeWidget() {
    widgetVisible = false;
    document.getElementById('floatWidget').classList.remove('visible');
    document.getElementById('pipBtn').classList.remove('active');
}

function updateWidget(st) {
    if (!widgetVisible || !st) return;
    const fwTopBar=document.getElementById('fwTopBar'), fwBadge=document.getElementById('fwBadge');
    const fwBText=document.getElementById('fwBadgeText'), fwName=document.getElementById('fwName');
    const fwCount=document.getElementById('fwCountdown'), fwLabel=document.getElementById('fwLabel');
    const fwProg=document.getElementById('fwProgress'), fwNext=document.getElementById('fwNext');
    const sb=(bar,bc,txt)=>{ fwTopBar.className='fw-topbar '+bar; fwBadge.className='fw-badge '+bc; fwBText.textContent=txt; };

    if (st.kind==='free') {
        sb('bar-free','sb-free','Frei'); fwName.textContent='';
        fwCount.className='fw-countdown cd-free'; fwCount.style.fontSize='1.1rem';
        fwCount.textContent='ENDLICH FREI!'; fwLabel.textContent='Schule wieder in';
        fwProg.className='fw-progress-fill pf-free'; fwProg.style.width='100%';
        fwNext.innerHTML=`<b>${freeCountdown(st.now)}</b>`;
    } else if (st.kind==='before') {
        sb('bar-soon','sb-soon','Bald los'); fwName.textContent='Schulbeginn 07:50 Uhr';
        fwCount.className='fw-countdown cd-soon'; fwCount.style.fontSize='';
        fwCount.textContent=fmtCountdown(st.secsLeft); fwLabel.textContent='bis Schulbeginn';
        fwProg.className='fw-progress-fill pf-soon'; fwProg.style.width='0%';
        fwNext.innerHTML='Nächstes: <b>1. Stunde</b>';
    } else if (st.kind==='active') {
        const {slot,secsLeft,progress,next}=st;
        const isBreak=slot.type==='break',isLunch=slot.type==='lunch';
        const bar=isLunch?'bar-lunch':isBreak?'bar-break':'bar-class';
        const bc=isLunch?'sb-lunch':isBreak?'sb-break':'sb-class';
        const cd=isLunch?'cd-lunch':isBreak?'cd-break':'cd-class';
        const pf=isLunch?'pf-lunch':isBreak?'pf-break':'pf-class';
        const bLabel=isLunch?'Mittagspause':isBreak?'Pause':'Unterricht';
        const cl=isBreak||isLunch?'bis Unterrichtsbeginn':'bis zur Pause';
        sb(bar,bc,bLabel);
        fwName.textContent=`${slot.name} · ${fmtTime(slot.h1,slot.m1)}–${fmtTime(slot.h2,slot.m2)}`;
        fwCount.className='fw-countdown '+cd; fwCount.style.fontSize='';
        fwCount.textContent=fmtCountdown(secsLeft); fwLabel.textContent=cl;
        fwProg.className='fw-progress-fill '+pf; fwProg.style.width=progress.toFixed(2)+'%';
        fwNext.innerHTML=next?`Danach: <b>${next.name}</b>`:'Danach: <b>Endlich Frei! 🎉</b>';
    }
}

// ─── Main button handler ──────────────────────────────────────
async function handlePipBtn() {
    // PiP already open → close it
    if (pipWindow && !pipWindow.closed) { closePip(); return; }
    // Widget visible → close it
    if (widgetVisible) { closeWidget(); return; }

    // Try Document PiP (always on top)
    if ('documentPictureInPicture' in window) {
        try { await openPip(); return; } catch(e) { /* fallthrough */ }
    }

    // Fallback: floating widget + hint about desktop widget
    showToast('Dein Browser unterstützt kein Bild-in-Bild.\nNutze stattdessen das schwebende Fenster.');
    openWidget();
}

// ─── Toast ────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
}

// ─── Drag (floating widget fallback) ─────────────────────────
(function() {
    const w = document.getElementById('floatWidget');
    let dragging=false, sx,sy,ox,oy;
    w.addEventListener('mousedown', e => {
        if (e.target.classList.contains('fw-close')) return;
        dragging=true; sx=e.clientX; sy=e.clientY;
        const r=w.getBoundingClientRect(); ox=r.left; oy=r.top;
        w.style.right='auto'; w.style.bottom='auto';
        w.style.left=ox+'px'; w.style.top=oy+'px';
        w.classList.add('dragging'); e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
        if (!dragging) return;
        w.style.left=(ox+e.clientX-sx)+'px'; w.style.top=(oy+e.clientY-sy)+'px';
    });
    document.addEventListener('mouseup', () => { if(dragging){dragging=false;w.classList.remove('dragging');} });
})();

// ─── Achievements ─────────────────────────────────────────────
const SU_OPEN_TIME = Date.now();
let su15Checked = false;

function tryUnlock(id, def) {
    let list;
    try { list = JSON.parse(localStorage.getItem('arcade_achievements')) || []; }
    catch(e) { list = []; }
    if (list.some(a => a.id === id)) return;
    list.push({ id, unlockedAt: new Date().toISOString() });
    localStorage.setItem('arcade_achievements', JSON.stringify(list));
    if (window.showAchToast) window.showAchToast(def);
    if (window.Auth && window.Auth.user) {
        window.Auth.saveAchievements(list).catch(() => {});
    }
}

function checkAchievements() {
    if (!su15Checked && Date.now() - SU_OPEN_TIME >= 15 * 60 * 1000) {
        su15Checked = true;
        tryUnlock('su_15min', {
            name: 'du hast wirklich keine Lust oder',
            desc: '15 Minuten auf der SchulUhr verbracht',
            icon: '😴',
        });
    }
}

// ─── Start ────────────────────────────────────────────────────
update();
setInterval(() => { update(); checkAchievements(); }, 1000);
</script>
