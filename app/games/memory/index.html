<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Memory Match im Alkomat: Paare finden mit möglichst wenigen Zügen.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Memory Match — Alkomat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Kanit:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&family=Share+Tech+Mono&family=Tilt+Neon&display=swap" rel="stylesheet">
<script src="/mode.js"></script>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/games/mini.css">
<style>
  :root { --accent: #ff3d9a; }
  .mm { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 8px; padding: 12px; min-height: 300px; }
  .mm-card { position: relative; aspect-ratio: 4 / 5; border: 0; padding: 0; background: none; cursor: pointer; perspective: 600px; border-radius: 10px; }
  .mm-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.4s var(--ease-out); }
  .mm-card.up .mm-in { transform: rotateY(180deg); }
  .mm-face { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .mm-back { border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--accent) 22%, var(--ink)) 0 8px, var(--ink) 8px 16px); }
  .mm-front { transform: rotateY(180deg); background: var(--board-raised); border: 1px solid var(--board-line); color: var(--c, var(--chalk)); }
  .mm-front svg { width: 54%; height: 54%; }
  .mm-card.done .mm-front { border-color: var(--c, var(--marquee)); background: color-mix(in srgb, var(--c, var(--marquee)) 12%, var(--board-raised)); }
  .mm-card:hover:not(.up) .mm-in { transform: translateY(-3px); }
  .mm-card:disabled { cursor: default; }
  @media (max-width: 820px) { .mm { gap: 6px; padding: 8px; } }
  @media (prefers-reduced-motion: reduce) { .mm-in { transition: none; } }
  html.fx-design .mm-back { border-color: var(--board-line); background: repeating-linear-gradient(45deg, #1b1c22 0 8px, #101116 8px 16px); }
  html.fx-design .mm-card, html.fx-design .mm-face { border-radius: 4px; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <a href="../../" class="nav-back">&larr; Arcade</a>
    <div class="nav-game-title"><span class="pill">MM</span> Memory Match</div>
  </div>
  <div class="nav-right"><div data-auth-slot></div></div>
</nav>

<main class="mg">
  <section class="mg-cab" aria-label="Memory Match">
    <div class="mg-bar"><div class="mg-meter plain"><span>Züge</span><b id="mMoves">0</b></div><div class="mg-meter plain"><span>Paare</span><b id="mPairs">0 / 8</b></div><div class="mg-meter plain"><span>Zeit</span><b id="mTime">0:00</b></div><div class="mg-meter"><span>Bestwert</span><b id="mBest">–</b></div></div>
    <div class="mg-screen">
      <div class="mm" id="grid"></div>
      <div class="mg-over" id="mgOver" hidden></div>
    </div>
    <p class="mg-hint">Zwei gleiche Karten bleiben offen, zwei verschiedene drehen sich wieder um.</p>
  </section>

  <aside class="mg-side">
    <div class="panel-box"><h3>Bestenliste</h3><ol class="mg-lb" id="mgLb"></ol><p class="mg-note" id="mgLbNote" hidden style="margin-top:8px">Melde dich an, um in die Bestenliste zu kommen.</p></div>
    <div class="panel-box"><h3>Steuerung</h3><div class="mg-keys"><kbd>Klick</kbd><span>Karte aufdecken</span><kbd>Tab</kbd><span>Karte wählen</span><kbd>Enter</kbd><span>Aufdecken / Start</span></div></div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/fx.js"></script>
<script src="/auth.js"></script>
<script src="/games/mini.js"></script>
<script>
(() => {
  'use strict';
  // zwölf Motive, gezeichnet wie die Symbole der Seite (24er-Raster)
  const ICON = [
    '<circle cx="12" cy="12" r="8"/><path d="M12 8v8"/>',
    '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
    '<path d="M12 3l2.800 5.700 6.200.9-4.500 4.400 1.100 6.200L12 17.300 6.400 20.200l1.100-6.200L3 9.600l6.200-.9z"/>',
    '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
    '<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',
    '<path d="M12 20s-8-5-8-11a4.500 4.500 0 0 1 8-2.500A4.500 4.500 0 0 1 20 9c0 6-8 11-8 11z"/>',
    '<path d="M6 4h12l4 6-10 11L2 10zM2 10h20"/>',
    '<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>',
    '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
    '<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/>',
    '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 15h.01M15 9h.01M9 15h.01"/>',
    '<path d="M2 9l10-5 10 5-10 5zM6 11.500V16c2 2 10 2 12 0v-4.500"/>',
  ];
  const COL = ['var(--neon-cyan)', 'var(--marquee)', 'var(--neon-pink)', 'var(--neon-lime)'];
  const SIZE = { s: [8, 4], l: [12, 6] };
  const grid = document.getElementById('grid');
  const M = Mini.init({ game: 'memory', accent: '#ff3d9a', modes: [['s', 'Klein', '8 Paare'], ['l', 'Groß', '12 Paare']], onMode: build });
  let deck = [], open = [], moves = 0, found = 0, t0 = 0, timer = 0, lock = false, alive = false;

  const clock = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const secs = () => (performance.now() - t0) / 1000;
  function build() {
    const [pairs, cols] = SIZE[M.mode] || SIZE.s;
    deck = [...Array(pairs).keys()].flatMap(i => [i, i]);
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [deck[i], deck[j]] = [deck[j], deck[i]]; }
    grid.style.setProperty('--cols', matchMedia('(max-width: 520px)').matches && cols === 6 ? 4 : cols);
    grid.innerHTML = deck.map((k, i) => '<button type="button" class="mm-card" data-i="' + i + '" aria-label="Karte ' + (i + 1) + '" style="--c:' + COL[k % 4] + '"><span class="mm-in"><span class="mm-face mm-back"></span><span class="mm-face mm-front"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[k] + '</svg></span></span></button>').join('');
    open = []; moves = 0; found = 0; lock = false;
    M.meter('mMoves', '0'); M.meter('mPairs', '0 / ' + pairs); M.meter('mTime', '0:00');
  }
  function start() { build(); alive = true; t0 = performance.now(); clearInterval(timer); timer = setInterval(() => { if (alive) M.meter('mTime', clock(secs())); }, 500); }
  async function win() {
    alive = false; clearInterval(timer);
    const [pairs] = SIZE[M.mode], s = secs(), score = Math.max(50, Math.round((pairs * 150 - moves * 12 - s * 2) * (pairs === 12 ? 1.5 : 1)));
    if (window.FX) FX.rain({ n: 60 });
    const rec = await M.end(score);
    M.show({ title: rec ? 'Neuer Rekord' : 'Alle gefunden', text: '<b>' + moves + '</b> Züge in <b>' + clock(s) + '</b>. Das sind <b>' + score.toLocaleString('de-AT') + '</b> Punkte.', cta: 'Nochmal', onGo: start });
  }
  grid.addEventListener('click', e => {
    const c = e.target.closest('.mm-card'); if (!c || !alive || lock || c.classList.contains('up')) return;
    c.classList.add('up'); open.push(c);
    if (open.length < 2) return;
    moves++; M.meter('mMoves', moves);
    const [a, b] = open; open = [];
    if (deck[a.dataset.i] === deck[b.dataset.i]) {
      a.classList.add('done'); b.classList.add('done'); a.disabled = b.disabled = true; found++;
      M.meter('mPairs', found + ' / ' + deck.length / 2);
      M.burstEl(b, { n: 12, colors: ['#ffb000', '#fff'] });
      if (found === deck.length / 2) setTimeout(win, 450);
    } else { lock = true; setTimeout(() => { a.classList.remove('up'); b.classList.remove('up'); lock = false; }, 800); }
  });

  build();
  M.show({ title: 'Memory Match', text: 'Deck immer zwei Karten auf und finde die Paare. Weniger Züge und weniger Zeit bringen mehr Punkte.', onGo: start });
})();
</script>
</body>
</html>
