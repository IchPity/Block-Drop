<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>BLOCK DROP — Insert Coin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #07020f;
      --cyan:    #00e5ff;
      --magenta: #ff2bd6;
      --gold:    #ffd400;
      --green:   #00ff7b;
      --red:     #ff3b5c;
      --ink:     #d7f5ff;
      --pixel:   'Press Start 2P', monospace;
      --crt:     'VT323', monospace;
    }

    body {
      background: var(--bg); min-height: 100vh;
      font-family: var(--crt);
      color: var(--ink); overflow-x: hidden;
      display: flex; flex-direction: column; align-items: center;
      padding: 86px 16px 32px; gap: 18px;
    }

    /* ── CRT screen atmosphere ──────────────────────────── */
    .crt-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 50% 35%, rgba(0,229,255,0.10), transparent 60%),
        radial-gradient(ellipse 70% 55% at 80% 90%, rgba(255,43,214,0.09), transparent 60%),
        radial-gradient(ellipse 60% 50% at 15% 80%, rgba(0,255,123,0.06), transparent 60%),
        linear-gradient(180deg, #0a0418 0%, #07020f 55%, #04010a 100%);
    }
    .crt-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5;
      background-image:
        linear-gradient(rgba(0,229,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.05) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(ellipse 75% 75% at 50% 45%, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 45%, #000 30%, transparent 80%);
    }
    .scanlines {
      position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0.5;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.32) 0 1px, transparent 1px 3px);
      mix-blend-mode: multiply;
      /* Stabile GPU-Ebene: mix-blend-mode flackert sonst beim Compositing-Wechsel schwarz. */
      transform: translateZ(0);
    }
    .crt-vignette {
      position: fixed; inset: 0; z-index: 51; pointer-events: none;
      background: radial-gradient(ellipse 95% 88% at 50% 50%, transparent 55%, rgba(2,0,8,0.85) 100%);
      box-shadow: inset 0 0 120px rgba(0,0,0,0.6);
      transform: translateZ(0);
    }
    @keyframes flicker { 0%,97%,100% { opacity:0.5; } 98% { opacity:0.4; } 99% { opacity:0.55; } }
    @media (prefers-reduced-motion: no-preference) { .scanlines { animation: flicker 6s steps(60) infinite; } }

    /* ── Marquee navbar ─────────────────────────────────── */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 22px;
      background: linear-gradient(180deg, rgba(14,4,28,0.92), rgba(8,2,16,0.82));
      border-bottom: 2px solid var(--magenta);
      box-shadow: 0 0 22px rgba(255,43,214,0.35), inset 0 -1px 0 rgba(0,229,255,0.25);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      /* Eigene, stabile GPU-Ebene: verhindert das Neu-Rastern (Schwarz-Blitz),
         wenn das TETRIS-Konfetti oben drüber erscheint. */
      transform: translateZ(0); will-change: transform;
    }
    .nav-left { display: flex; align-items: center; gap: 14px; }
    .nav-back {
      display: inline-flex; align-items: center; gap: 6px;
      text-decoration: none; color: var(--cyan);
      font-family: var(--pixel); font-size: 8px;
      border: 2px solid rgba(0,229,255,0.4); border-radius: 4px;
      padding: 7px 10px; transition: all 0.15s;
      text-shadow: 0 0 8px rgba(0,229,255,0.6);
    }
    .nav-back:hover { background: rgba(0,229,255,0.12); border-color: var(--cyan); box-shadow: 0 0 14px rgba(0,229,255,0.4); }
    .nav-game-title {
      font-family: var(--pixel); font-size: 13px; color: var(--gold);
      letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,212,0,0.6), 2px 2px 0 rgba(255,43,214,0.5);
    }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-score-display {
      display: flex; align-items: center; gap: 16px;
      background: rgba(0,0,0,0.5); border: 1px solid rgba(0,229,255,0.3);
      border-radius: 6px; padding: 5px 14px;
    }
    .nav-stat { display: flex; flex-direction: column; align-items: center; }
    .nav-stat-val { font-family: var(--crt); font-size: 22px; color: var(--cyan); line-height: 0.9; text-shadow: 0 0 10px rgba(0,229,255,0.7); }
    .nav-stat-lbl { font-family: var(--pixel); font-size: 6px; letter-spacing: 1px; text-transform: uppercase; color: rgba(215,245,255,0.4); margin-top: 3px; }
    .nav-divider { width: 1px; height: 24px; background: rgba(0,229,255,0.25); }

    /* ── Layout ─────────────────────────────────────────── */
    #wrapper { position: relative; z-index: 1; display: flex; gap: 14px; align-items: center; }
    #left-panel { display: flex; flex-direction: column; gap: 8px; width: 126px; }
    #right-panel { display: flex; flex-direction: column; gap: 8px; width: 146px; }

    /* ── Panels ─────────────────────────────────────────── */
    .panel-box {
      background: rgba(6,2,16,0.72);
      border: 1px solid rgba(0,229,255,0.25);
      border-radius: 8px; padding: 11px 13px;
      box-shadow: inset 0 0 18px rgba(0,229,255,0.05), 0 0 14px rgba(0,0,0,0.5);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .panel-box h3 {
      font-family: var(--pixel); font-size: 7px;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--magenta); margin-bottom: 9px;
      text-shadow: 0 0 8px rgba(255,43,214,0.5);
    }
    .panel-box .value {
      font-family: var(--crt); font-size: 38px; color: var(--ink);
      letter-spacing: 1px; line-height: 0.8;
      text-shadow: 0 0 12px rgba(0,229,255,0.4);
    }
    #score-display { color: var(--gold); text-shadow: 0 0 16px rgba(255,212,0,0.6); }

    /* ── Board ──────────────────────────────────────────── */
    #game-area {
      position: relative; border-radius: 8px; overflow: hidden;
      border: 2px solid rgba(0,229,255,0.45);
      box-shadow: 0 0 0 4px rgba(7,2,15,0.9), 0 0 38px rgba(0,229,255,0.28), 0 0 80px rgba(255,43,214,0.18), 0 30px 70px rgba(0,0,0,0.85);
    }
    canvas#board { display: block; background: #04010a; }
    canvas#next-canvas, canvas#hold-canvas { display: block; }

    /* ── Overlay ────────────────────────────────────────── */
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(4,1,10,0.92);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 18px;
      padding: 24px;
    }
    #overlay h1 {
      font-family: var(--pixel); font-size: 24px; color: var(--cyan);
      letter-spacing: 1px; line-height: 1.4; text-align: center;
      text-shadow: 0 0 16px rgba(0,229,255,0.7), 3px 3px 0 var(--magenta);
    }
    #overlay .overlay-sub {
      font-family: var(--pixel); font-size: 8px; color: var(--gold);
      text-shadow: 0 0 8px rgba(255,212,0,0.5); margin-top: -4px;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0.25; } }
    #overlay p { font-size: 18px; color: rgba(215,245,255,0.6); text-align: center; line-height: 1.4; }
    #overlay p strong { color: var(--cyan); }

    /* ── Mode Buttons ───────────────────────────────────── */
    .mode-btns { display: flex; gap: 8px; width: 100%; }
    .mode-btn {
      flex: 1; background: rgba(0,229,255,0.05);
      color: rgba(215,245,255,0.55);
      border: 1px solid rgba(0,229,255,0.25);
      padding: 11px 8px; font-family: var(--pixel); font-size: 8px;
      border-radius: 6px; cursor: pointer; transition: all 0.15s;
      text-align: center; line-height: 1.5;
    }
    .mode-btn:hover { border-color: var(--cyan); color: var(--cyan); background: rgba(0,229,255,0.1); }
    .mode-btn.selected {
      background: rgba(255,43,214,0.16); border-color: var(--magenta); color: #fff;
      box-shadow: 0 0 16px rgba(255,43,214,0.35);
      text-shadow: 0 0 8px rgba(255,43,214,0.6);
    }
    .mode-btn small { display: block; font-family: var(--crt); font-size: 13px; font-weight: 400; opacity: 0.7; margin-top: 5px; letter-spacing: 0; }

    /* ── Start Button ───────────────────────────────────── */
    .btn {
      background: linear-gradient(180deg, var(--magenta), #c8189f);
      color: #fff; border: 2px solid #ff7be8;
      padding: 14px 0; font-family: var(--pixel); font-size: 11px;
      border-radius: 8px; cursor: pointer; letter-spacing: 1px; width: 100%;
      box-shadow: 0 0 26px rgba(255,43,214,0.5), inset 0 0 12px rgba(255,255,255,0.15);
      transition: all 0.15s; text-shadow: 0 2px 0 rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(255,43,214,0.7), inset 0 0 12px rgba(255,255,255,0.2); }
    .btn:active { transform: scale(0.97); }

    /* ── Level Bar ──────────────────────────────────────── */
    #level-bar-wrap { background: rgba(0,229,255,0.12); border-radius: 100px; height: 5px; width: 100%; margin-top: 9px; overflow: hidden; border: 1px solid rgba(0,229,255,0.2); }
    #level-bar { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green)); border-radius: 100px; transition: width 0.4s ease; width: 0%; box-shadow: 0 0 10px rgba(0,229,255,0.6); }

    /* ── Mode Badge ─────────────────────────────────────── */
    #mode-badge {
      font-family: var(--pixel); font-size: 6px; text-transform: uppercase;
      letter-spacing: 1px; padding: 4px 8px; border-radius: 4px;
      margin-top: 9px; display: inline-block;
    }
    #mode-badge.classic  { background: rgba(255,59,92,0.15); color: var(--red); border: 1px solid rgba(255,59,92,0.4); }
    #mode-badge.standard { background: rgba(0,229,255,0.12); color: var(--cyan); border: 1px solid rgba(0,229,255,0.4); }

    /* ── Controls ───────────────────────────────────────── */
    #controls-hint { font-family: var(--crt); font-size: 15px; color: rgba(215,245,255,0.42); line-height: 1.65; }

    /* ── High Scores ────────────────────────────────────── */
    #hs-mode-label { font-family: var(--pixel); font-size: 6px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); margin-bottom: 10px; }
    .highscore-list { font-family: var(--crt); font-size: 17px; color: rgba(215,245,255,0.55); line-height: 1.5; min-height: 100px; }
    .highscore-list span { color: var(--gold); }

    /* ── Achievement Overlay ────────────────────────────── */
    #ach-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0);
      display: flex; align-items: center; justify-content: center;
      z-index: 10000; pointer-events: none; transition: background 0.35s;
    }
    #ach-overlay.show { background: rgba(0,0,0,0.9); pointer-events: all; }
    #ach-modal {
      background: rgba(8,2,16,0.98); border: 2px solid rgba(255,212,0,0.4);
      border-radius: 14px; padding: 44px 64px; text-align: center;
      position: relative; overflow: hidden;
      box-shadow: 0 0 60px rgba(255,212,0,0.2), 0 40px 80px rgba(0,0,0,0.95);
      transform: scale(0.55) translateY(48px); opacity: 0;
      transition: transform 0.45s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s;
    }
    #ach-overlay.show #ach-modal { transform: scale(1) translateY(0); opacity: 1; }
    #ach-modal::before {
      content: ''; position: absolute; top: 0; left: -100%;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    #ach-overlay.show #ach-modal::before { animation: achShimmer 2s 0.5s ease-in-out infinite; }
    @keyframes achShimmer { 0% { left:-100%; } 100% { left:200%; } }
    .ach-label { font-family: var(--pixel); font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 18px; }
    #ach-icon-big { font-size: 68px; display: block; margin-bottom: 14px; transform: scale(0); }
    #ach-overlay.show #ach-icon-big { animation: achIconPop 0.55s 0.2s both cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes achIconPop { from { transform: scale(0) rotate(-15deg); } to { transform: scale(1) rotate(0deg); } }
    #ach-name-big { font-family: var(--pixel); font-size: 15px; color: #fff; margin-bottom: 12px; letter-spacing: 0; }
    #ach-desc-big { font-size: 17px; color: rgba(215,245,255,0.5); line-height: 1.4; }
    .ach-hint { font-family: var(--pixel); font-size: 7px; color: rgba(215,245,255,0.2); text-transform: uppercase; letter-spacing: 1px; margin-top: 28px; opacity: 0; }
    #ach-overlay.show .ach-hint { animation: achHintFade 0.6s 1.8s both; }
    @keyframes achHintFade { from { opacity:0; } to { opacity:1; } }

    /* ── Level-Up ───────────────────────────────────────── */
    .levelup-banner {
      position: absolute; top: 38%; left: 50%; z-index: 30;
      transform: translate(-50%, -50%); pointer-events: none;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      animation: levelUpPop 1.3s cubic-bezier(0.34,1.56,0.64,1) forwards;
      text-align: center;
    }
    .levelup-banner span {
      font-family: var(--pixel); font-size: 9px; letter-spacing: 3px;
      color: var(--cyan); text-shadow: 0 0 10px rgba(0,229,255,0.8);
    }
    .levelup-banner b {
      font-family: var(--pixel); font-size: 46px; color: var(--gold);
      text-shadow: 0 0 18px rgba(255,212,0,0.8), 3px 3px 0 var(--magenta);
    }
    @keyframes levelUpPop {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.4); }
      18%  { opacity: 1; transform: translate(-50%,-50%) scale(1.12); }
      32%  { transform: translate(-50%,-50%) scale(1); }
      72%  { opacity: 1; transform: translate(-50%,-58%) scale(1); }
      100% { opacity: 0; transform: translate(-50%,-72%) scale(0.95); }
    }
    @keyframes levelPulse {
      0%   { box-shadow: 0 0 0 4px rgba(7,2,15,0.9), 0 0 38px rgba(0,229,255,0.28), 0 0 80px rgba(255,43,214,0.18), 0 30px 70px rgba(0,0,0,0.85); border-color: rgba(0,229,255,0.45); }
      30%  { box-shadow: 0 0 0 4px rgba(7,2,15,0.9), 0 0 60px rgba(0,255,123,0.7),  0 0 120px rgba(255,212,0,0.5), 0 30px 70px rgba(0,0,0,0.85); border-color: var(--green); }
      100% { box-shadow: 0 0 0 4px rgba(7,2,15,0.9), 0 0 38px rgba(0,229,255,0.28), 0 0 80px rgba(255,43,214,0.18), 0 30px 70px rgba(0,0,0,0.85); border-color: rgba(0,229,255,0.45); }
    }
    #game-area.level-pulse { animation: levelPulse 0.7s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      .levelup-banner { animation: none; opacity: 1; }
      #game-area.level-pulse { animation: none; }
    }

    /* ── Tetris-Effekt (4 Zeilen) ───────────────────────── */
    /* Dauerhaft vorhandene, GPU-isolierte Ebene. Weil sie nie ein-/ausgehängt
       wird, bleibt der Compositing-Baum stabil und die anderen fixed-Ebenen
       (Navbar-backdrop-filter, Scanlines mit mix-blend-mode) müssen beim
       Konfetti nicht neu rastern → kein Schwarz-/Weiß-Blitz. */
    #tetris-fx {
      position: fixed; inset: 0; pointer-events: none; z-index: 9998; overflow: hidden;
      isolation: isolate; transform: translateZ(0); contain: layout style paint;
    }
    #tetris-fx i {
      position: absolute; top: -24px; display: block; opacity: 0;
      animation-name: tetrisConfettiFall;
      animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
      animation-fill-mode: forwards;
    }
    @keyframes tetrisConfettiFall {
      0%   { opacity: 0; transform: translate(0, -10vh) rotate(0deg); }
      8%   { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--xd), 110vh) rotate(var(--rot)); }
    }
    .tetris-banner {
      position: absolute; top: 40%; left: 50%; z-index: 9999; pointer-events: none;
      font-family: var(--pixel); font-size: clamp(34px, 9vw, 92px); letter-spacing: 2px;
      background: linear-gradient(90deg, #00cfcf, #f0c000, #e94560, #a000f0);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 24px rgba(240,192,0,0.55)) drop-shadow(0 0 48px rgba(233,69,96,0.4));
      transform: translate(-50%, -50%) scale(0.3); opacity: 0;
      will-change: transform, opacity;
      animation: tetrisBannerPop 1.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes tetrisBannerPop {
      0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.3) rotate(-6deg); }
      14%  { opacity: 1; transform: translate(-50%,-50%) scale(1.18) rotate(2deg); }
      28%  { transform: translate(-50%,-50%) scale(0.98) rotate(0deg); }
      72%  { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.12); }
    }
    .tetris-shake { animation: tetrisShake 0.65s cubic-bezier(.36,.07,.19,.97); }
    @keyframes tetrisShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-7px, 5px) rotate(-0.6deg); }
      20% { transform: translate(8px, -6px) rotate(0.6deg); }
      30% { transform: translate(-9px, 4px) rotate(-0.5deg); }
      40% { transform: translate(8px, 6px) rotate(0.5deg); }
      50% { transform: translate(-6px, -5px) rotate(-0.4deg); }
      60% { transform: translate(6px, 4px) rotate(0.3deg); }
      70% { transform: translate(-4px, -3px) rotate(-0.2deg); }
      80% { transform: translate(3px, 2px) rotate(0.15deg); }
      90% { transform: translate(-2px, 1px) rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .tetris-shake { animation: none; }
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.2); border-radius: 3px; }

    /* ── Touch Controls (mobile only) ───────────────────── */
    #touch-controls { display: none; }
    @media (hover: none) and (pointer: coarse), (max-width: 760px) {
      #touch-controls {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        width: min(100vw - 24px, 380px);
        margin: 4px auto 0;
        position: relative; z-index: 1;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      .tc-btn {
        background: rgba(0,229,255,0.06);
        border: 1px solid rgba(0,229,255,0.3);
        border-radius: 8px;
        color: var(--cyan); font-size: 22px;
        font-family: var(--crt);
        padding: 14px 0;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        transition: background 0.1s, transform 0.05s;
        -webkit-tap-highlight-color: transparent;
        text-shadow: 0 0 8px rgba(0,229,255,0.5);
      }
      .tc-btn:active {
        background: rgba(255,43,214,0.2);
        border-color: var(--magenta);
        transform: scale(0.95);
      }
      .tc-btn.wide { grid-column: span 1; }
      .tc-btn.lbl { font-family: var(--pixel); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
      .tc-row2 { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px; }
    }

    /* ── Responsive Layout ──────────────────────────────── */
    @media (max-width: 760px) {
      body { padding: 64px 8px 16px; gap: 10px; }
      .navbar { padding: 10px 14px; }
      .nav-back { padding: 6px 8px; font-size: 7px; }
      .nav-game-title { font-size: 10px; }
      .nav-right { gap: 8px; }
      .nav-score-display { gap: 10px; padding: 4px 10px; }
      .nav-stat-val { font-size: 17px; }
      .nav-stat-lbl { font-size: 5px; letter-spacing: 0.5px; }
      .nav-divider { height: 18px; }

      #wrapper { flex-direction: column; gap: 10px; align-items: center; }
      #left-panel, #right-panel { width: min(100vw - 24px, 380px); flex-direction: row; gap: 8px; flex-wrap: wrap; }

      #left-panel { order: 1; }
      #game-area { order: 0; }
      #right-panel { order: 2; }

      .panel-box { padding: 10px 12px; flex: 1 1 calc(33.333% - 6px); min-width: 80px; }
      .panel-box h3 { font-size: 6px; letter-spacing: 0.5px; margin-bottom: 5px; }
      .panel-box .value { font-size: 26px; }
      #level-bar-wrap { margin-top: 6px; }
      #mode-badge { margin-top: 6px; font-size: 5px; padding: 3px 6px; }

      #controls-hint-box, .controls-hint-box { display: none; }

      #hold-canvas { width: 60px; height: 48px; display: block; margin: 0 auto; }
      #next-canvas { width: 60px; height: 156px; display: block; margin: 0 auto; }

      #game-area { width: 100%; max-width: min(100vw - 16px, 320px); aspect-ratio: 1 / 2; touch-action: none; }
      canvas#board { width: 100% !important; height: 100% !important; touch-action: none; }
      #overlay { padding: 16px; }
      #overlay h1 { font-size: 17px; }
      .mode-btn { padding: 9px 6px; font-size: 7px; }
      .mode-btn small { font-size: 12px; }
      .btn { padding: 12px 0; font-size: 9px; }

      #hs-list { font-size: 15px; line-height: 1.4; min-height: 70px; }
      #hs-mode-label { font-size: 5px; letter-spacing: 0.5px; margin-bottom: 6px; }
    }

    @media (max-width: 380px) {
      #overlay h1 { font-size: 15px; }
      .panel-box .value { font-size: 22px; }
      #left-panel, #right-panel { gap: 6px; }
    }
  </style>
</head>
<body>

<!-- Persistente FX-Ebene: Konfetti/Banner werden hier nur als Kinder ein-/ausgehängt.

    <div class="panel-box controls-hint-box">

      <div id="controls-hint">
        ← → &nbsp;Move<br>
        ↑ / Z &nbsp;Rotate CW<br>
        X &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Rotate CCW<br>
        ↓ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Soft drop<br>

        <button class="mode-btn selected" id="mode-standard">Standard<small>Fixed speed</small></button>

<!-- Touch controls (mobile only) -->
<div id="touch-controls" aria-label="Touch-Steuerung">
  <button class="tc-btn" id="tc-rotL" type="button" aria-label="Drehen links">↺</button>
  <button class="tc-btn" id="tc-left" type="button" aria-label="Links">◀</button>
  <button class="tc-btn" id="tc-down" type="button" aria-label="Runter">▼</button>
  <button class="tc-btn" id="tc-right" type="button" aria-label="Rechts">▶</button>
  <button class="tc-btn" id="tc-rotR" type="button" aria-label="Drehen rechts">↻</button>
  <div class="tc-row2">
    <button class="tc-btn lbl" id="tc-hold" type="button">Hold</button>
    <button class="tc-btn lbl" id="tc-drop" type="button" style="background:rgba(255,43,214,0.2);border-color:var(--magenta);">Drop</button>
    <button class="tc-btn lbl" id="tc-pause" type="button">⏸</button>
  </div>

<script>
  // Mirror panel stats to navbar
  const scoreObs = new MutationObserver(() => {
    const v = document.getElementById('score-display').textContent;
    document.getElementById('nav-score').textContent = v;
  });
  const levelObs = new MutationObserver(() => {
    document.getElementById('nav-level').textContent = document.getElementById('level-display').textContent;
  });
  const linesObs = new MutationObserver(() => {
    document.getElementById('nav-lines').textContent = document.getElementById('lines-display').textContent;
  });
  scoreObs.observe(document.getElementById('score-display'), { childList: true, subtree: true, characterData: true });
  levelObs.observe(document.getElementById('level-display'), { childList: true, subtree: true, characterData: true });
  linesObs.observe(document.getElementById('lines-display'), { childList: true, subtree: true, characterData: true });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
<script src="game.js"></script>
<script>
  // ── Touch controls ─────────────────────────────────────────────────
  (function setupTouchControls() {
    const G = () => window._game;

    function bindTap(id, fn) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('click', e => {
        e.preventDefault();
        const g = G();
        if (!g) return;
        if (g.state === 'idle' || g.state === 'gameover') return;
        fn(g);
      });
    }

    // Auto-repeat for horizontal moves + soft drop while finger held
    function bindHold(id, fn, repeatMs = 90, initialDelay = 160) {
      const el = document.getElementById(id);
      if (!el) return;
      let repeat = null, delay = null;

      const start = e => {
        e.preventDefault();
        const g = G(); if (!g || g.state !== 'playing') return;
        fn(g);
        delay = setTimeout(() => {
          repeat = setInterval(() => {
            const g2 = G(); if (g2 && g2.state === 'playing') fn(g2);
          }, repeatMs);
        }, initialDelay);
      };
      const stop = () => {
        clearTimeout(delay); clearInterval(repeat);
        delay = null; repeat = null;
      };
      el.addEventListener('touchstart', start, { passive: false });
      el.addEventListener('touchend', stop);
      el.addEventListener('touchcancel', stop);
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', stop);
      el.addEventListener('mouseleave', stop);
    }

    bindHold('tc-left',  g => g.moveLeft());
    bindHold('tc-right', g => g.moveRight());
    bindHold('tc-down',  g => g.softDrop(),     40, 0);
    bindTap('tc-rotL',  g => g.rotate(-1));
    bindTap('tc-rotR',  g => g.rotate(1));
    bindTap('tc-drop',  g => g.hardDrop());
    bindTap('tc-hold',  g => g.holdPiece && g.holdPiece());
    bindTap('tc-pause', g => g.togglePause && g.togglePause());

    // Swipe on the board itself: left/right = move, up = rotate, down-fast = hard drop.
    // Halten (langer Druck ohne Bewegung) = schneller dropen, je länger desto schneller.
    const board = document.getElementById('game-area');
    if (board) {
      let sx = 0, sy = 0, sxLast = 0, syLast = 0, startTime = 0, moving = false;
      const STEP = 24;       // px per cell move
      const SWIPE_UP = 30;   // px swipe up = rotate
      const HARD_DROP = 60;  // fast down flick triggers hard drop
      const HOLD_DELAY = 180;   // ms gedrückt halten, bevor der Schnell-Drop startet
      const HOLD_MOVE_TOL = 14; // px Wackeln, das noch als "halten" durchgeht

      let holdPressTimer = null;  // wartet HOLD_DELAY ab
      let holdDropTimer  = null;  // wiederholt den Soft-Drop
      let holdDelay = 0;          // aktueller Abstand zwischen den Drops
      let holding = false;        // läuft der Schnell-Drop gerade?

      function holdStep() {
        const g = G();
        if (!g || g.state !== 'playing') { stopHold(); return; }
        g.softDrop();
        holdDelay = Math.max(28, holdDelay - 7); // je länger gehalten, desto schneller
        holdDropTimer = setTimeout(holdStep, holdDelay);
      }
      function startHold() {
        if (holding) return;
        holding = true;
        holdDelay = 75;
        holdStep();
      }
      function stopHold() {
        holding = false;
        clearTimeout(holdPressTimer); holdPressTimer = null;
        clearTimeout(holdDropTimer);  holdDropTimer  = null;
      }

      board.addEventListener('touchstart', e => {
        const g = G();
        if (!g || g.state !== 'playing') return;
        const t = e.touches[0];
        sx = sxLast = t.clientX;
        sy = syLast = t.clientY;
        startTime = Date.now();
        moving = false;
        stopHold();
        holdPressTimer = setTimeout(startHold, HOLD_DELAY);
      }, { passive: false });

      board.addEventListener('touchmove', e => {
        const g = G();
        if (!g || g.state !== 'playing') return;
        e.preventDefault();   // stop page scroll while playing
        const t = e.touches[0];
        const dx = t.clientX - sxLast;
        const dy = t.clientY - syLast;

        // Sobald der Finger merklich wandert, ist es kein "Halten" mehr → Schnell-Drop abbrechen
        if (Math.abs(t.clientX - sx) > HOLD_MOVE_TOL || Math.abs(t.clientY - sy) > HOLD_MOVE_TOL) {
          stopHold();
        }

        // horizontal step
        if (Math.abs(dx) >= STEP && Math.abs(dx) > Math.abs(dy)) {
          if (dx > 0) g.moveRight(); else g.moveLeft();
          sxLast = t.clientX;
          moving = true;
        }
        // continuous soft drop on slow down-drag
        else if (dy >= STEP && dy < HARD_DROP) {
          g.softDrop();
          syLast = t.clientY;
          moving = true;
        }
      }, { passive: false });

      board.addEventListener('touchend', e => {
        const g = G();
        if (!g || g.state !== 'playing') { stopHold(); return; }
        const wasHolding = holding;
        stopHold();
        const ch = e.changedTouches[0];
        const dx = ch.clientX - sx;
        const dy = ch.clientY - sy;
        const dt = Date.now() - startTime;

        // Langer Druck wurde schon als Schnell-Drop gewertet → nichts weiter tun
        if (wasHolding) return;

        // fast flick down → hard drop
        if (!moving && dy > HARD_DROP && Math.abs(dx) < 40 && dt < 350) {
          g.hardDrop();
          return;
        }
        // tap (no move) → rotate
        if (!moving && Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 250) {
          g.rotate(1);
          return;
        }
        // swipe up → rotate
        if (!moving && dy < -SWIPE_UP && Math.abs(dx) < 40) {
          g.rotate(1);
        }
      });
      board.addEventListener('touchcancel', stopHold);
    }
  })();
</script>
</body>
</html>
