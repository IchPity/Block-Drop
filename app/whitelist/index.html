<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Whitelist — Smashin' Kurt</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="stage-light" aria-hidden="true"></div>
  <div class="stage-grain" aria-hidden="true"></div>

  <div class="frame">

    <header class="band band--head">
      <a class="brand" href="/" data-enter style="--enter-step: 0">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Smashin' Kurt</span>
      </a>

      <div class="account" data-account hidden data-enter style="--enter-step: 1">
        <span class="account__id">
          <span class="account__name" data-account-name></span>
          <span class="account__rank" data-account-rank></span>
        </span>
        <button class="avatar-btn" type="button" data-open-profile aria-label="Profil bearbeiten">
          <img class="avatar-btn__img" data-account-avatar alt="">
        </button>
      </div>
    </header>

    <main class="stage stage--app">
      <div class="stage__inner">
        <span class="eyebrow" data-enter style="--enter-step: 3">App · Admin + Stellvertreter</span>
        <h1 class="headline headline--app" data-enter style="--enter-step: 4">Whitelist</h1>
        <p class="lede" data-enter style="--enter-step: 5">
          Neue E-Mail-Adressen freischalten, damit sich die Person anmelden
          und ihr eigenes Passwort setzen kann.
        </p>

        <form class="inline-form" id="whitelist-form" data-enter style="--enter-step: 6" novalidate>
          <div class="field">
            <label class="field__label" for="whitelist-email">Neue E-Mail</label>
            <input class="field__input" id="whitelist-email" type="email"
                   placeholder="vorname.nachname@beispiel.at" required>
          </div>
          <button class="btn btn--lamp" type="submit">Freischalten</button>
        </form>
        <p class="notice" id="whitelist-notice" role="status" aria-live="polite"></p>

        <ul class="datalist" id="whitelist-list" data-enter style="--enter-step: 7"></ul>
      </div>
    </main>

    <footer class="band band--foot" data-enter style="--enter-step: 8">
      <span class="note">Zugang nur für Teammitglieder</span>
      <span class="note">Aufbau läuft</span>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/assets/auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
