<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>METAR — Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red:  #e94560;
      --gold: #f0c000;
      --blue: #38bdf8;
      --green: #22c55e;
      --bg: var(--board);
      --card: var(--board-raised);
      --border: var(--board-line);
    }
    body {
      background: var(--bg); min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--chalk); overflow-x: hidden;
      padding: 72px 0 64px;
    }

    /* Background */
    .orb { position: fixed; border-radius: 50%; filter: blur(140px); pointer-events: none; z-index: 0; }
    .orb-1 { width: 680px; height: 680px; background: #0ea5e9; opacity: 0.05; top: -260px; left: -220px; animation: f1 24s ease-in-out infinite alternate; }
    .orb-2 { width: 540px; height: 540px; background: #1e40af; opacity: 0.05; bottom: -200px; right: -200px; animation: f2 30s ease-in-out infinite alternate; }
    @keyframes f1 { to { transform: translate(80px,70px) scale(1.15); } }
    @keyframes f2 { to { transform: translate(-90px,-110px) scale(1.2); } }
    .dot-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0; background-image: radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px); background-size: 30px 30px; }
    .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(ellipse 90% 75% at 50% 50%, transparent 35%, rgba(5,8,16,0.78) 100%); }

    /* Navbar */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
      background: rgba(5,8,16,0.8);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .nav-left { display: flex; align-items: center; gap: 14px; }
    .nav-back {
      display: inline-flex; align-items: center; gap: 6px;
      text-decoration: none; color: rgba(255,255,255,0.4);
      font-size: 11px; font-weight: 600;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      padding: 6px 12px; transition: all 0.2s;
    }
    .nav-back:hover { color: #fff; border-color: rgba(255,255,255,0.25); }
    .nav-game-title {
      font-size: 13px; font-weight: 900; color: #fff; letter-spacing: 1px;
      display: flex; align-items: center; gap: 8px;
    }
    .nav-game-title .pill {
      background: var(--blue); color: #000; padding: 2px 7px;
      border-radius: 4px; font-size: 11px; font-weight: 900; letter-spacing: 1.5px;
    }
    .nav-right { display: flex; align-items: center; gap: 12px; }

    /* Container */
    .container { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 0 24px; }

    /* Hero */
    .hero { margin-top: 28px; margin-bottom: 28px; }
    .hero h1 {
      font-size: 50px; font-weight: 900; letter-spacing: -2.5px; line-height: 0.98;
      color: #fff;
    }
    .hero-sub {
      margin-top: 14px; font-size: 13px; max-width: 600px;
      color: rgba(255,255,255,0.5); line-height: 1.6;
    }

    /* Search Box */
    .search-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 22px;
      margin-bottom: 22px;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .search-label {
      font-size: 11px; font-weight: 800; letter-spacing: 2.5px;
      text-transform: uppercase; color: rgba(255,255,255,0.45); margin-bottom: 10px;
    }
    .search-row {
      display: flex; gap: 10px; align-items: stretch;
    }
    .search-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 13px 16px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-input:focus { border-color: rgba(56,189,248,0.5); background: rgba(255,255,255,0.07); }
    .search-input::placeholder { color: rgba(255,255,255,0.25); letter-spacing: 1.5px; font-weight: 600; }
    .search-btn {
      background: linear-gradient(135deg, var(--blue), #0284c7);
      color: #000; border: none; border-radius: 12px;
      padding: 0 24px;
      font-family: inherit; font-size: 13px; font-weight: 900;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(56,189,248,0.3);
      transition: all 0.2s;
    }
    .search-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 0 36px rgba(56,189,248,0.45); }
    .search-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    .search-hint {
      margin-top: 10px;
      font-size: 11px; color: rgba(255,255,255,0.35);
    }

    .quick-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 14px;
    }
    .quick-tag {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 12px;
      color: rgba(255,255,255,0.7);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .quick-tag:hover {
      background: rgba(56,189,248,0.1);
      border-color: rgba(56,189,248,0.35);
      color: #fff;
    }
    .quick-tag .city {
      font-family: 'Inter', sans-serif;
      letter-spacing: 0;
      color: rgba(255,255,255,0.4);
      font-weight: 600; margin-left: 6px;
    }

    /* Result card */
    .station-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; overflow: hidden;
      margin-bottom: 14px;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      animation: slideIn 0.35s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .station-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
    }
    .station-id-row { display: flex; align-items: baseline; gap: 12px; }
    .station-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px; font-weight: 800;
      color: #fff; letter-spacing: 2px;
    }
    .station-name {
      font-size: 13px; color: rgba(255,255,255,0.5); font-weight: 600;
    }
    .station-meta {
      text-align: right; font-size: 11px;
      color: rgba(255,255,255,0.4); letter-spacing: 1px;
    }
    .station-meta strong {
      display: block; color: rgba(255,255,255,0.7); font-size: 11px;
      margin-bottom: 2px; font-family: 'JetBrains Mono', monospace;
    }
    .station-meta .age {
      display: inline-block; padding: 2px 7px; border-radius: 99px;
      font-size: 11px; font-weight: 800; letter-spacing: 1.5px;
      margin-top: 4px;
    }
    .station-meta .age.fresh { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .station-meta .age.stale { background: rgba(240,192,0,0.15); color: var(--gold); border: 1px solid rgba(240,192,0,0.3); }
    .station-meta .age.old   { background: rgba(225,6,0,0.13); color: #ff7a7a; border: 1px solid rgba(225,6,0,0.3); }

    .raw-metar {
      padding: 16px 22px;
      background: rgba(0,0,0,0.25);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #e0e8f0;
      letter-spacing: 0.5px;
      word-break: break-word;
      border-bottom: 1px solid var(--border);
    }
    .raw-metar .tok { color: var(--blue); }
    .raw-metar .wind { color: #7dd3fc; }
    .raw-metar .vis  { color: #c0c0c0; }
    .raw-metar .wx   { color: var(--gold); }
    .raw-metar .cld  { color: #a0a0a0; }
    .raw-metar .tmp  { color: var(--green); }
    .raw-metar .alt  { color: #f0c0a0; }

    .decoded {
      padding: 18px 22px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .field {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .field-lbl {
      font-size: 11px; font-weight: 800; letter-spacing: 2px;
      text-transform: uppercase; color: rgba(255,255,255,0.4);
      margin-bottom: 4px;
    }
    .field-val {
      font-size: 16px; font-weight: 800; color: #fff;
      letter-spacing: -0.3px;
    }
    .field-val .unit { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.45); margin-left: 4px; letter-spacing: 0; }
    .field-val.flagged { color: var(--gold); }
    .field-val.bad     { color: #ff7a7a; }

    /* Loading / empty */
    .loading, .empty {
      padding: 36px 24px; text-align: center;
      color: rgba(255,255,255,0.4); font-size: 13px;
    }
    .loading .spinner {
      display: inline-block; width: 26px; height: 26px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--blue);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-icon { font-size: 32px; opacity: 0.45; margin-bottom: 6px; }

    .err-card {
      background: rgba(225,6,0,0.08);
      border: 1px solid rgba(225,6,0,0.3);
      border-radius: 14px; padding: 16px 20px;
      margin-bottom: 14px;
      display: flex; gap: 12px; align-items: center;
    }
    .err-icon { font-size: 22px; }
    .err-body strong { display: block; color: #ffb0b0; font-size: 13px; font-weight: 800; }
    .err-body span { font-size: 12px; color: rgba(255,255,255,0.55); }

    /* Recents */
    .recents {
      margin-top: 14px;
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    .recents-label {
      font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.3); margin-right: 4px;
    }
    .recent-tag {
      background: rgba(56,189,248,0.08);
      border: 1px solid rgba(56,189,248,0.2);
      border-radius: 99px;
      padding: 4px 10px;
      color: #7dd3fc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .recent-tag:hover { background: rgba(56,189,248,0.18); color: #fff; }

    @media (max-width: 720px) {
      body { padding: 64px 0 48px; }
      .navbar { padding: 10px 14px; }
      .nav-back { padding: 5px 10px; font-size: 11px; }
      .nav-game-title { font-size: 12px; }
      .container { padding: 0 14px; }
      .hero { margin-top: 18px; margin-bottom: 20px; }
      .hero h1 { font-size: 32px; letter-spacing: -1.5px; }
      .hero-sub { font-size: 12px; margin-top: 10px; }

      .search-card { padding: 16px; }
      .search-row { flex-direction: column; gap: 8px; }
      .search-input { font-size: 16px; }
      .search-btn { padding: 12px; }

      .station-head { flex-direction: column; gap: 6px; padding: 14px 16px; }
      .station-meta { text-align: left; }
      .station-id { font-size: 20px; }
      .raw-metar { padding: 14px 16px; font-size: 12px; }
      .decoded { grid-template-columns: repeat(2, 1fr); padding: 14px 12px; gap: 8px; }
      .field { padding: 10px 12px; }
      .field-val { font-size: 14px; }

      .quick-row { gap: 5px; }
      .quick-tag { padding: 5px 10px; font-size: 11px; }
      .quick-tag .city { font-size: 11px; }
      .recent-tag { font-size: 11px; }
    }
    @media (max-width: 420px) {
      .hero h1 { font-size: 28px; }
      .decoded { grid-template-columns: 1fr 1fr; }
      .station-id { font-size: 18px; letter-spacing: 1.5px; }
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="dot-grid"></div>
<div class="vignette"></div>

<nav class="navbar">
  <div class="nav-left">
    <a href="/" class="nav-back">&larr; Arcade</a>
    <div class="nav-game-title"><span class="pill">WX</span> METAR Browser</div>
  </div>
  <div class="nav-right">
    <div data-auth-slot></div>
  </div>
</nav>

<div class="container">

  <section class="hero">
    <h1>METAR <em>BROWSER</em></h1>
    <p class="hero-sub">Aktuelle Wetterbeobachtungen von Flughäfen weltweit. ICAO-Code eingeben (4 Buchstaben — z.B. EDDF, LOWW, KJFK) und du bekommst Roh-METAR plus dekodierte Werte. Daten: NOAA Aviation Weather Center.</p>
  </section>

  <div class="search-card">
    <div class="search-label">ICAO-Codes — mehrere mit Komma trennen</div>
    <form id="search-form">
      <div class="search-row">
        <input
          id="icao-input"
          class="search-input"
          type="text"
          maxlength="60"
          autocomplete="off"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          placeholder="EDDF, LOWW, KJFK"
        />
        <button type="submit" class="search-btn" id="search-btn">Abrufen</button>
      </div>
    </form>

    <div class="quick-row" id="quick-row"></div>

    <div class="recents" id="recents" style="display:none;">
      <span class="recents-label">Zuletzt</span>
    </div>
  </div>

  <div id="results"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
<script>
/* ===================================================================
 * METAR Browser
 *  - Datenquelle: NOAA Aviation Weather Center
 *    https://aviationweather.gov/api/data/metar?ids=...&format=json
 *  - kein Key, CORS aktiv für public-facing endpoints
 * =================================================================== */

const NOAA = 'https://aviationweather.gov/api/data/metar';
// NOAA blockt CORS bei Browser-Requests inkonsistent — daher Proxy.
const CORS = 'https://corsproxy.io/?url=';

const QUICK_AIRPORTS = [
  { code: 'LOWW', city: 'Wien' },
  { code: 'EDDF', city: 'Frankfurt' },
  { code: 'EDDM', city: 'München' },
  { code: 'LSZH', city: 'Zürich' },
  { code: 'EGLL', city: 'London' },
  { code: 'LFPG', city: 'Paris' },
  { code: 'EHAM', city: 'Amsterdam' },
  { code: 'KJFK', city: 'New York' },
  { code: 'KLAX', city: 'Los Angeles' },
  { code: 'RJTT', city: 'Tokio' },
];

const RECENT_KEY = 'metar_recents';
const MAX_RECENTS = 8;

const $ = id => document.getElementById(id);

/* ── Quick tags ──────────────────────────────────────────── */
function renderQuick() {
  const row = $('quick-row');
  row.innerHTML = QUICK_AIRPORTS.map(a =>
    `<button type="button" class="quick-tag" data-icao="${a.code}">${a.code}<span class="city">${a.city}</span></button>`
  ).join('');
  row.querySelectorAll('.quick-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      $('icao-input').value = btn.dataset.icao;
      fetchAndRender(btn.dataset.icao);
    });
  });
}

/* ── Recents ─────────────────────────────────────────────── */
function loadRecents() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; }
  catch (e) { return []; }
}
function saveRecents(arr) { localStorage.setItem(RECENT_KEY, JSON.stringify(arr)); }
function addRecent(codes) {
  let arr = loadRecents();
  for (const c of codes) {
    arr = [c, ...arr.filter(x => x !== c)];
  }
  arr = arr.slice(0, MAX_RECENTS);
  saveRecents(arr);
  renderRecents();
}
function renderRecents() {
  const box = $('recents');
  const arr = loadRecents();
  if (!arr.length) { box.style.display = 'none'; return; }
  box.style.display = '';
  box.innerHTML = `<span class="recents-label">Zuletzt</span>` +
    arr.map(c => `<button type="button" class="recent-tag" data-icao="${c}">${c}</button>`).join('');
  box.querySelectorAll('.recent-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      $('icao-input').value = btn.dataset.icao;
      fetchAndRender(btn.dataset.icao);
    });
  });
}

/* ── Search ──────────────────────────────────────────────── */
$('search-form').addEventListener('submit', e => {
  e.preventDefault();
  const val = $('icao-input').value;
  if (!val.trim()) return;
  fetchAndRender(val);
});

async function fetchAndRender(query) {
  const codes = query.toUpperCase().split(/[\s,;]+/).filter(c => /^[A-Z0-9]{4}$/.test(c));
  if (!codes.length) {
    showError('Ungültige Eingabe', 'Bitte mindestens einen 4-stelligen ICAO-Code eingeben (z.B. EDDF).');
    return;
  }

  const btn = $('search-btn');
  btn.disabled = true;
  btn.textContent = 'Lade…';
  $('results').innerHTML = `<div class="loading"><div class="spinner"></div><div>METAR von NOAA ziehen…</div></div>`;

  try {
    const noaaUrl = `${NOAA}?ids=${codes.join(',')}&format=json`;
    let data;
    // 1. Direkter Versuch — falls NOAA gerade CORS sendet, sparen wir uns den Proxy
    try {
      const res = await fetch(noaaUrl);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
    } catch (directErr) {
      // 2. Fallback über CORS-Proxy
      const res = await fetch(CORS + encodeURIComponent(noaaUrl));
      if (!res.ok) throw new Error('Proxy HTTP ' + res.status);
      data = await res.json();
    }
    addRecent(codes);
    render(codes, Array.isArray(data) ? data : []);
  } catch (e) {
    showError('Abruf fehlgeschlagen', e.message || String(e));
  } finally {
    btn.disabled = false;
    btn.textContent = 'Abrufen';
  }
}

function showError(title, body) {
  $('results').innerHTML = `
    <div class="err-card">
      <div class="err-icon">⚠</div>
      <div class="err-body"><strong>${esc(title)}</strong><span>${esc(body)}</span></div>
    </div>`;
}

/* ── Render ──────────────────────────────────────────────── */
function render(requestedCodes, items) {
  const byId = new Map();
  for (const it of items) {
    const id = (it.icaoId || it.station_id || '').toUpperCase();
    if (id) byId.set(id, it);
  }

  let html = '';
  for (const code of requestedCodes) {
    const it = byId.get(code);
    if (!it) {
      html += `
        <div class="err-card">
          <div class="err-icon">∅</div>
          <div class="err-body"><strong>${esc(code)} — keine Daten</strong><span>Kein METAR gefunden. ICAO-Code prüfen oder Station meldet nicht via NOAA.</span></div>
        </div>`;
      continue;
    }
    html += renderStation(it);
  }
  $('results').innerHTML = html;
}

function renderStation(m) {
  const raw = m.rawOb || m.rawText || '';
  const id = (m.icaoId || m.station_id || '').toUpperCase();
  const name = m.name || '';
  const obsTime = parseTime(m.obsTime || m.reportTime);
  const ageMin = obsTime ? Math.round((Date.now() - obsTime.getTime()) / 60000) : null;
  const ageClass = ageMin == null ? '' : (ageMin < 60 ? 'fresh' : ageMin < 180 ? 'stale' : 'old');
  const ageLabel = ageMin == null ? '—' : ageMin < 60 ? `vor ${ageMin} min` : ageMin < 1440 ? `vor ${Math.floor(ageMin/60)} h` : `vor ${Math.floor(ageMin/1440)} d`;

  const decoded = decodeFields(m);

  return `
    <div class="station-card">
      <div class="station-head">
        <div>
          <div class="station-id-row">
            <div class="station-id">${esc(id)}</div>
            <div class="station-name">${esc(name)}</div>
          </div>
        </div>
        <div class="station-meta">
          ${obsTime ? `<strong>${fmtTime(obsTime)}</strong>` : '<strong>—</strong>'}
          UTC Observation
          <div class="age ${ageClass}">${esc(ageLabel)}</div>
        </div>
      </div>
      <div class="raw-metar">${colorizeRaw(raw)}</div>
      <div class="decoded">
        ${decoded.map(d => `
          <div class="field">
            <div class="field-lbl">${esc(d.label)}</div>
            <div class="field-val ${d.cls || ''}">${d.val}${d.unit ? `<span class="unit">${esc(d.unit)}</span>` : ''}</div>
          </div>`).join('')}
      </div>
    </div>
  `;
}

function parseTime(t) {
  if (!t) return null;
  // NOAA gibt UTC-Strings: "2026-05-28T13:50:00Z" oder Unix-Seconds
  if (typeof t === 'number') return new Date(t * 1000);
  const d = new Date(t.endsWith('Z') ? t : t + 'Z');
  return isNaN(d) ? null : d;
}
function fmtTime(d) {
  return d.toISOString().replace('T', ' ').slice(0, 16) + 'Z';
}

function decodeFields(m) {
  const out = [];

  // Wind
  const wdir = m.wdir;
  const wspd = m.wspd;
  const wgst = m.wgst;
  if (wdir != null && wspd != null) {
    let val;
    if (wdir === 'VRB' || wdir === 0 && wspd === 0) val = wspd === 0 ? 'Calm' : `VRB / ${wspd}`;
    else val = `${String(wdir).padStart(3,'0')}° / ${wspd}`;
    if (wgst) val += ` G${wgst}`;
    const isStrong = (wspd >= 25 || (wgst && wgst >= 30));
    out.push({ label: 'Wind', val, unit: wspd === 'Calm' ? '' : 'kt', cls: isStrong ? 'flagged' : '' });
  }

  // Visibility
  if (m.visib != null) {
    const v = m.visib;
    const isLow = (typeof v === 'number' && v < 3) || (typeof v === 'string' && /^[0-2]\b/.test(v));
    out.push({ label: 'Sicht', val: String(v), unit: 'sm', cls: isLow ? 'bad' : '' });
  }

  // Temp / Dewpoint
  if (m.temp != null) out.push({ label: 'Temperatur', val: String(m.temp), unit: '°C' });
  if (m.dewp != null) out.push({ label: 'Taupunkt', val: String(m.dewp), unit: '°C' });

  // Altimeter / Pressure
  if (m.altim != null) {
    const inHg = (m.altim / 33.8639).toFixed(2);
    out.push({ label: 'QNH', val: Math.round(m.altim) + ' hPa', unit: `(${inHg} inHg)` });
  } else if (m.slp != null) {
    out.push({ label: 'Druck (SLP)', val: String(m.slp), unit: 'hPa' });
  }

  // Weather phenomena
  if (m.wxString) {
    out.push({ label: 'Wetter', val: esc(decodeWx(m.wxString)), unit: '', cls: 'flagged' });
  }

  // Clouds
  if (m.clouds && m.clouds.length) {
    const cstr = m.clouds.map(c => {
      const cov = c.cover || c.amount || '';
      const base = c.base != null ? `${c.base}ft` : '';
      return cov + (base ? ' ' + base : '');
    }).filter(Boolean).join(', ');
    if (cstr) out.push({ label: 'Wolken', val: esc(cstr) });
  }

  // Flight category
  if (m.fltCat) {
    const cls = { VFR: '', MVFR: 'flagged', IFR: 'bad', LIFR: 'bad' }[m.fltCat] || '';
    out.push({ label: 'Flight Cat.', val: m.fltCat, cls });
  }

  return out;
}

const WX_MAP = {
  '-': 'leicht ', '+': 'stark ',
  VC: 'in der Nähe ',
  MI: 'flach ', PR: 'teilweise ', BC: 'fleckig ', DR: 'driftend ', BL: 'wehend ',
  SH: 'Schauer ', TS: 'Gewitter ', FZ: 'gefrierend ',
  DZ: 'Nieselregen ', RA: 'Regen ', SN: 'Schnee ', SG: 'Schneegriesel ',
  IC: 'Eiskristalle ', PL: 'Eisregen ', GR: 'Hagel ', GS: 'Graupel ',
  UP: 'unbekanntes Niederschlag ',
  BR: 'Dunst ', FG: 'Nebel ', FU: 'Rauch ', VA: 'Vulkanasche ',
  DU: 'Staub ', SA: 'Sand ', HZ: 'Trockendunst ', PY: 'Sprühregen ',
  PO: 'Staubwirbel ', SQ: 'Böen ', FC: 'Tornado ', SS: 'Sandsturm ', DS: 'Staubsturm ',
};
function decodeWx(s) {
  return s.split(/\s+/).map(tok => {
    if (!tok) return '';
    let out = '';
    let rest = tok;
    if (rest[0] === '-' || rest[0] === '+') { out += WX_MAP[rest[0]] || ''; rest = rest.slice(1); }
    while (rest.length >= 2) {
      const pair = rest.slice(0, 2);
      if (WX_MAP[pair]) { out += WX_MAP[pair]; rest = rest.slice(2); }
      else break;
    }
    return (out || tok).trim();
  }).filter(Boolean).join(', ');
}

/* ── Colorize raw METAR (simple regex highlighting) ──────── */
function colorizeRaw(raw) {
  if (!raw) return '<span style="opacity:.4">— kein Roh-METAR —</span>';
  // ICAO + time, wind, vis, weather, clouds, temp/dew, altimeter
  return esc(raw)
    .replace(/\b(METAR|SPECI|AUTO|COR)\b/g, '<span class="tok">$1</span>')
    .replace(/\b(\d{3}|VRB)\d{2,3}(G\d{2,3})?KT\b/g, '<span class="wind">$&</span>')
    .replace(/\b\d{4}(N|NE|E|SE|S|SW|W|NW)?\b(?!\/)/g, m =>
      /^\d{6}Z$/.test(m + 'Z') ? m : `<span class="vis">${m}</span>`)
    .replace(/\b(M?\d{1,2}\/M?\d{1,2})\b/g, '<span class="tmp">$1</span>')
    .replace(/\b(Q\d{4}|A\d{4})\b/g, '<span class="alt">$1</span>')
    .replace(/\b(FEW|SCT|BKN|OVC|VV)\d{3}(CB|TCU)?\b/g, '<span class="cld">$&</span>')
    .replace(/\b(CAVOK|NSC|NCD|SKC|CLR)\b/g, '<span class="cld">$1</span>')
    .replace(/(?:^| )([+-]?(SH|TS|FZ|MI|BC|DR|BL|VC)?(DZ|RA|SN|SG|IC|PL|GR|GS|UP|BR|FG|FU|VA|DU|SA|HZ|PY|PO|SQ|FC|SS|DS))(?= |$)/g,
      ' <span class="wx">$1</span>');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ── Init ────────────────────────────────────────────────── */
renderQuick();
renderRecents();

// Initial default: lade Wien wenn nichts in recents
const initialRecents = loadRecents();
if (initialRecents.length) {
  $('icao-input').value = initialRecents[0];
  fetchAndRender(initialRecents[0]);
} else {
  fetchAndRender('LOWW');
}
</script>
