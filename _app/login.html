<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade — Anmelden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red: #e94560; --gold: #f0c000; --bg: #060818; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #eee;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }

    .orb { position: fixed; border-radius: 50%; filter: blur(130px); pointer-events: none; z-index: 0; }
    .orb-1 { width: 720px; height: 720px; background: #e94560; opacity: 0.055; top: -280px; left: -240px; animation: orbFloat1 24s ease-in-out infinite alternate; }
    .orb-2 { width: 600px; height: 600px; background: #3050e0; opacity: 0.05; bottom: -220px; right: -220px; animation: orbFloat2 30s ease-in-out infinite alternate; }
    .orb-3 { width: 480px; height: 480px; background: #8030c8; opacity: 0.035; top: 45%; left: 50%; transform: translate(-50%,-50%); animation: orbFloat3 20s ease-in-out infinite alternate; }
    @keyframes orbFloat1 { from { transform: translate(0,0) scale(1); } to { transform: translate(100px,90px) scale(1.18); } }
    @keyframes orbFloat2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-90px,-110px) scale(1.22); } }
    @keyframes orbFloat3 { from { transform: translate(-50%,-50%) scale(1); } to { transform: translate(-55%,-44%) scale(1.14); } }
    .dot-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0; background-image: radial-gradient(rgba(255,255,255,0.011) 1px, transparent 1px); background-size: 30px 30px; }

    .card {
      position: relative; z-index: 1; width: 380px;
      background: rgba(18,18,40,0.85);
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 26px; padding: 38px 34px 34px;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.04);
      opacity: 0; transform: translateY(28px) scale(0.97);
      animation: cardIn 0.65s 0.08s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0) scale(1); } }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      position: fixed; top: 20px; left: 24px; z-index: 10;
      text-decoration: none; color: rgba(255,255,255,0.28);
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      padding: 8px 14px; transition: color 0.2s, border-color 0.2s;
    }
    .back-link:hover { color: rgba(255,255,255,0.65); border-color: rgba(255,255,255,0.2); }

    .logo { text-align: center; margin-bottom: 28px; }
    .logo-eye { font-size: 9px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; color: var(--red); margin-bottom: 8px; }
    .logo h1 { font-size: 30px; font-weight: 900; letter-spacing: -1.5px; color: #fff; }

    .tabs {
      display: flex; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; overflow: hidden; margin-bottom: 24px;
    }
    .tab {
      flex: 1; padding: 9px; background: transparent; border: none;
      color: rgba(255,255,255,0.3); font-family: inherit;
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; cursor: pointer; transition: all 0.2s;
    }
    .tab.active { background: rgba(233,69,96,0.13); color: var(--red); }
    .tab:hover:not(.active) { color: rgba(255,255,255,0.55); }

    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-bottom: 6px; }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.11);
      border-radius: 12px; padding: 10px 13px; color: #fff;
      font-family: inherit; font-size: 13px; outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .field input:focus { border-color: rgba(233,69,96,0.5); background: rgba(233,69,96,0.04); }
    .field input::placeholder { color: rgba(255,255,255,0.18); }

    .btn {
      width: 100%; margin-top: 20px;
      background: var(--red); border: none; border-radius: 14px;
      padding: 12px; color: #fff; font-family: inherit;
      font-size: 10px; font-weight: 800; letter-spacing: 3px;
      text-transform: uppercase; cursor: pointer;
      transition: filter 0.2s, transform 0.15s;
    }
    .btn:hover { filter: brightness(0.82); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }

    .msg { margin-top: 11px; font-size: 11px; text-align: center; border-radius: 7px; padding: 9px 13px; display: none; line-height: 1.5; }
    .msg.error   { background: rgba(233,69,96,0.1); color: #e94560; border: 1px solid rgba(233,69,96,0.2); display: block; }
    .msg.success { background: rgba(0,200,80,0.08); color: #00cc66; border: 1px solid rgba(0,200,80,0.18); display: block; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="dot-grid"></div>

  <a href="/" class="back-link">&#8592; Hauptmenü</a>

  <div class="card">
    <div class="logo">
      <div class="logo-eye">Willkommen</div>
      <h1>ARCADE</h1>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Anmelden</button>
      <button class="tab" id="tab-reg" onclick="switchTab('register')">Registrieren</button>
    </div>

    <div id="form-login">
      <div class="field">
        <label>Benutzername</label>
        <input type="text" id="l-user" placeholder="Dein Benutzername" autocomplete="username">
      </div>
      <div class="field">
        <label>Passwort</label>
        <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn" id="btn-login" onclick="doLogin()">Anmelden</button>
      <div class="msg" id="msg-login"></div>
    </div>

    <div id="form-reg" style="display:none">
      <div class="field">
        <label>Benutzername</label>
        <input type="text" id="r-user" placeholder="Benutzername wählen" autocomplete="username">
      </div>
      <div class="field">
        <label>Passwort</label>
        <input type="password" id="r-pass" placeholder="Passwort wählen" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Passwort bestätigen</label>
        <input type="password" id="r-pass2" placeholder="Passwort wiederholen" autocomplete="new-password">
      </div>
      <button class="btn" id="btn-reg" onclick="doRegister()">Account erstellen</button>
      <div class="msg" id="msg-reg"></div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('arcade_token')) window.location.href = '/';

    function switchTab(tab) {
      document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
      document.getElementById('form-reg').style.display   = tab === 'register' ? '' : 'none';
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-reg').classList.toggle('active',   tab === 'register');
    }

    async function doLogin() {
      const user = document.getElementById('l-user').value.trim();
      const pass = document.getElementById('l-pass').value;
      const msg  = document.getElementById('msg-login');
      const btn  = document.getElementById('btn-login');
      if (!user || !pass) { showMsg(msg, 'Bitte alle Felder ausfüllen.', 'error'); return; }
      btn.disabled = true;
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const d = await r.json();
        if (d.ok) {
          localStorage.setItem('arcade_token',    d.token);
          localStorage.setItem('arcade_username', d.username);
          localStorage.setItem('arcade_role',     d.role);
          window.location.href = '/';
        } else { showMsg(msg, d.error || 'Anmeldung fehlgeschlagen.', 'error'); }
      } catch { showMsg(msg, 'Verbindungsfehler — läuft der Server?', 'error'); }
      btn.disabled = false;
    }

    async function doRegister() {
      const user  = document.getElementById('r-user').value.trim();
      const pass  = document.getElementById('r-pass').value;
      const pass2 = document.getElementById('r-pass2').value;
      const msg   = document.getElementById('msg-reg');
      const btn   = document.getElementById('btn-reg');
      if (!user || !pass) { showMsg(msg, 'Bitte alle Felder ausfüllen.', 'error'); return; }
      if (pass !== pass2) { showMsg(msg, 'Passwörter stimmen nicht überein.', 'error'); return; }
      if (pass.length < 4) { showMsg(msg, 'Passwort muss mindestens 4 Zeichen haben.', 'error'); return; }
      btn.disabled = true;
      try {
        const r = await fetch('/api/auth/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const d = await r.json();
        if (d.ok) {
          localStorage.setItem('arcade_token',    d.token);
          localStorage.setItem('arcade_username', d.username);
          localStorage.setItem('arcade_role',     d.role);
          window.location.href = '/';
        } else { showMsg(msg, d.error || 'Registrierung fehlgeschlagen.', 'error'); }
      } catch { showMsg(msg, 'Verbindungsfehler — läuft der Server?', 'error'); }
      btn.disabled = false;
    }

    function showMsg(el, text, type) { el.textContent = text; el.className = 'msg ' + type; }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const isLogin = document.getElementById('form-reg').style.display === 'none';
      if (isLogin) doLogin(); else doRegister();
    });
  </script>
</body>
</html>
