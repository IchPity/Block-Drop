# Cloudflare Pages Konfiguration für Block Drop Arcade.
# Die statische Seite liegt in app/, das Backend in functions/.

name = "block-drop"
compatibility_date = "2025-05-01"
pages_build_output_dir = "app"

# D1-Datenbank (Users, Scores, Achievements, Sessions, Schach-Räume).
[[d1_databases]]
binding = "DB"
database_name = "block-drop-db"
database_id = "ec59be71-5c15-4338-92d8-e02d04c62f41"
