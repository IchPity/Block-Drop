<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Drop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #eee;
      padding: 20px;
      gap: 12px;
    }

    #wrapper {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    #left-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 120px;
    }

    #right-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 180px;
    }

    .panel-box {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      padding: 12px;
    }

    .panel-box h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a0a0c0;
      margin-bottom: 8px;
    }

    .panel-box .value {
      font-size: 22px;
      font-weight: bold;
      color: #e94560;
    }

    #game-area {
      position: relative;
    }

    canvas#board {
      display: block;
      border: 3px solid #0f3460;
      border-radius: 4px;
      background: #0d0d1a;
    }

    canvas#next-canvas, canvas#hold-canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 4px;
      gap: 16px;
    }

    #overlay h1 {
      font-size: 36px;
      color: #e94560;
      text-shadow: 0 0 20px #e94560;
    }

    #overlay p {
      font-size: 14px;
      color: #ccc;
    }

    #overlay .btn {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #overlay .btn:hover { background: #c73652; }

    #level-bar-wrap {
      background: #0d0d1a;
      border-radius: 4px;
      height: 8px;
      width: 100%;
      margin-top: 4px;
      overflow: hidden;
    }

    #level-bar {
      height: 100%;
      background: #e94560;
      transition: width 0.3s;
      width: 0%;
    }

    #controls-hint {
      font-size: 10px;
      color: #555;
      line-height: 1.7;
    }

    .highscore-list {
      font-size: 12px;
      color: #ccc;
      line-height: 1.8;
      min-height: 110px;
    }

    .highscore-list span {
      color: #e94560;
      font-weight: bold;
    }

    .mode-btns {
      display: flex;
      gap: 10px;
    }

    .mode-btn {
      background: #0f3460;
      color: #ccc;
      border: 2px solid #0f3460;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      line-height: 1.3;
    }

    .mode-btn:hover { border-color: #e94560; color: #fff; }
    .mode-btn.selected { background: #e94560; border-color: #e94560; color: #fff; }

    .mode-btn small {
      display: block;
      font-size: 10px;
      font-weight: normal;
      opacity: 0.8;
      margin-top: 2px;
    }

    #mode-badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 2px 7px;
      border-radius: 4px;
      margin-top: 6px;
      display: inline-block;
    }

    #mode-badge.classic  { background: #e94560; color: #fff; }
    #mode-badge.standard { background: #0090c0; color: #fff; }

    #hs-mode-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-bottom: 8px;
    }

    #back-container {
      text-align: center;
      padding: 18px 0 6px;
      width: 100%;
    }

    .menu-back {
      display: inline-block;
      color: #444;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 7px 20px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 6px;
      transition: color 0.2s, border-color 0.2s;
    }

    .menu-back:hover { color: #bbb; border-color: rgba(255,255,255,0.18); }

    #ach-toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: #16213e;
      border: 1px solid #0f3460;
      border-left: 3px solid #f0c000;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 12px; color: #eee;
      z-index: 9999; opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      text-align: center; white-space: nowrap;
    }
    #ach-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="wrapper">
  <!-- Left panel -->
  <div id="left-panel">
    <div class="panel-box">
      <h3>Score</h3>
      <div class="value" id="score-display">0</div>
    </div>
    <div class="panel-box">
      <h3>Level</h3>
      <div class="value" id="level-display">1</div>
      <div id="level-bar-wrap"><div id="level-bar"></div></div>
      <div id="mode-badge" class="classic">Classic</div>
    </div>
    <div class="panel-box">
      <h3>Lines</h3>
      <div class="value" id="lines-display">0</div>
    </div>
    <div class="panel-box">
      <h3>Hold</h3>
      <canvas id="hold-canvas" width="100" height="80"></canvas>
    </div>
    <div class="panel-box">
      <h3>Controls</h3>
      <div id="controls-hint">
        ← → Move<br>
        ↑ / Z  Rotate CW<br>
        X      Rotate CCW<br>
        ↓      Soft drop<br>
        Space  Hard drop<br>
        C      Hold<br>
        P      Pause
      </div>
    </div>
  </div>

  <!-- Board -->
  <div id="game-area">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="overlay">
      <h1>BLOCK DROP</h1>
      <p>Choose your mode</p>
      <div class="mode-btns">
        <button class="mode-btn" id="mode-classic">Classic<small>Speed increases</small></button>
        <button class="mode-btn selected" id="mode-standard">Standard<small>Fixed speed</small></button>
      </div>
      <button class="btn" id="start-btn">Start Game</button>
    </div>
  </div>

  <!-- Right panel -->
  <div id="right-panel">
    <div class="panel-box">
      <h3>Next</h3>
      <canvas id="next-canvas" width="100" height="260"></canvas>
    </div>
    <div class="panel-box">
      <h3>High Scores</h3>
      <div id="hs-mode-label">Standard</div>
      <div class="highscore-list" id="hs-list"></div>
    </div>
  </div>
</div>

<div id="ach-toast"></div>

<div id="back-container">
  <a class="menu-back" href="../../">&#8592; Zurück zum Menü</a>
</div>

<script src="game.js"></script>
</body>
</html>
