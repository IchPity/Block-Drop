<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievements</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07070f;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #eee;
    }

    .container { max-width: 960px; margin: 0 auto; padding: 0 36px; }

    header {
      padding: 56px 0 36px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 44px;
    }

    .eyebrow {
      font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
      color: #e94560; margin-bottom: 10px;
    }

    header h1 { font-size: 40px; font-weight: 900; color: #fff; line-height: 1; }

    .progress-row {
      display: flex; align-items: center; gap: 14px; margin-top: 14px;
    }

    .progress-track {
      flex: 1; background: rgba(255,255,255,0.05);
      border-radius: 100px; height: 4px; overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f0c000, #e94560);
      border-radius: 100px;
      transition: width 0.6s ease;
      width: 0%;
    }

    .progress-label {
      font-size: 11px; color: #444; white-space: nowrap;
    }

    .section-label {
      font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
      color: #252535; margin-bottom: 14px; margin-top: 8px;
    }

    .ach-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 36px;
    }

    .ach-card {
      background: #0c0c1a;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: border-color 0.2s;
    }

    .ach-card.unlocked {
      border-color: rgba(240,192,0,0.3);
      background: #0d0d1a;
    }

    .ach-card.locked { opacity: 0.3; }

    .ach-icon { font-size: 22px; margin-bottom: 2px; }
    .ach-name { font-size: 12px; font-weight: 700; color: #fff; }
    .ach-desc { font-size: 10px; color: #383848; line-height: 1.5; }

    .ach-status {
      font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
      margin-top: 4px;
    }
    .ach-status.done  { color: #f0c000; }
    .ach-status.todo  { color: #1e1e2e; }

    .back-wrap { text-align: center; padding: 12px 0 56px; }
    .back-link {
      display: inline-block; color: #333; text-decoration: none;
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 7px 20px; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 6px; transition: color 0.2s, border-color 0.2s;
    }
    .back-link:hover { color: #bbb; border-color: rgba(255,255,255,0.18); }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="eyebrow">Deine Fortschritte</div>
    <h1>ACHIEVEMENTS</h1>
    <div class="progress-row">
      <div class="progress-track">
        <div class="progress-fill" id="prog-fill"></div>
      </div>
      <div class="progress-label" id="prog-label">—</div>
    </div>
  </header>

  <div id="ach-content"></div>

  <div class="back-wrap">
    <a class="back-link" href="../">&#8592; Zurück zum Menü</a>
  </div>
</div>

<script>
const ACHIEVEMENTS = [
  { id: 'bd_first',    game: 'Block Drop', name: 'Anfänger',                        desc: 'Starte dein erstes Spiel',                    icon: '🎮' },
  { id: 'bd_tetris',   game: 'Block Drop', name: 'TETRIS!',                         desc: 'Lösch 4 Zeilen auf einmal',                   icon: '✨' },
  { id: 'bd_combo5',   game: 'Block Drop', name: 'Combo Maniac',                    desc: 'Erreiche eine 5× Kombo',                      icon: '🔥' },
  { id: 'bd_level10',  game: 'Block Drop', name: 'Speed Junkie',                    desc: 'Erreiche Level 10 im Classic Modus',          icon: '⚡' },
  { id: 'bd_score50k', game: 'Block Drop', name: 'Großverdiener',                   desc: 'Erziele 50.000 Punkte in einem Spiel',        icon: '💰' },
  { id: 'bd_lines100', game: 'Block Drop', name: 'Linienkiller',                    desc: 'Lösch 100 Zeilen in einem Spiel',             icon: '💥' },
  { id: 'bd_harddrop', game: 'Block Drop', name: 'Kein Zeit für Langsam',          desc: 'Mach 25 Hard Drops in einem Spiel',           icon: '⬇️' },
  { id: 'bd_no_hold',  game: 'Block Drop', name: 'Ich brauch kein Hold',           desc: 'Beende ein Spiel ohne Hold zu benutzen',      icon: '🙅' },
  { id: 'bd_score250k',game: 'Block Drop', name: 'Legende',                         desc: 'Erziele 250.000 Punkte in einem Spiel',       icon: '🏆' },
  { id: 'su_15min',    game: 'SchulUhr',   name: 'du hast wirklich keine Lust oder',desc: '15 Minuten auf der SchulUhr verbracht',       icon: '😴' },
];

async function render() {
  let unlocked = [];
  try {
    const res  = await fetch('/api/achievements');
    const data = await res.json();
    unlocked   = data.unlocked || [];
  } catch(e) {}

  const unlockedIds  = new Set(unlocked.map(a => a.id));
  const unlockedCount = ACHIEVEMENTS.filter(a => unlockedIds.has(a.id)).length;
  const pct = Math.round(unlockedCount / ACHIEVEMENTS.length * 100);

  document.getElementById('prog-fill').style.width  = pct + '%';
  document.getElementById('prog-label').textContent = `${unlockedCount} / ${ACHIEVEMENTS.length}`;

  const games = [...new Set(ACHIEVEMENTS.map(a => a.game))];
  let html = '';

  for (const game of games) {
    const achs = ACHIEVEMENTS.filter(a => a.game === game);
    html += `<div class="section-label">${game}</div><div class="ach-grid">`;

    for (const a of achs) {
      const isUnlocked = unlockedIds.has(a.id);
      const entry = unlocked.find(u => u.id === a.id);
      const dateStr = entry
        ? new Date(entry.unlockedAt).toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric' })
        : '';

      html += `
        <div class="ach-card ${isUnlocked ? 'unlocked' : 'locked'}">
          <div class="ach-icon">${a.icon}</div>
          <div class="ach-name">${a.name}</div>
          <div class="ach-desc">${a.desc}</div>
          <div class="ach-status ${isUnlocked ? 'done' : 'todo'}">
            ${isUnlocked ? `✓ ${dateStr}` : '🔒 Gesperrt'}
          </div>
        </div>`;
    }

    html += '</div>';
  }

  document.getElementById('ach-content').innerHTML = html;
}

render();
</script>
</body>
</html>
